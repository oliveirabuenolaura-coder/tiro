            try {
                const data = localStorage.getItem(RECORDS_KEY);
                if (!data) return [];
                const arr = JSON.parse(data);
                if (!Array.isArray(arr)) return [];
                return arr.slice(0, MAX_RECORDS);
            } catch (e) { return []; }
        }
        function saveRecords(records) {
            try { localStorage.setItem(RECORDS_KEY, JSON.stringify(records.slice(0, MAX_RECORDS))); } catch (e) { }
        }
        function addRecord(score, phase, coins, victory) {
            const records = loadRecords();
            records.push({ score, phase, coins, victory: !!victory, date: new Date().toLocaleDateString('pt-BR') });
            records.sort((a, b) => {
                if (a.victory !== b.victory) return b.victory - a.victory;
                return b.score - a.score;
            });
            saveRecords(records.slice(0, MAX_RECORDS));
            return records.slice(0, MAX_RECORDS);
        }

            try { localStorage.removeItem(RECORDS_KEY); } catch (e) { }

        function generateFloorTexture(themeId) {
            const theme = MAP_THEMES[themeId] || MAP_THEMES[0];
            fctx.clearRect(0, 0, W, H);

            const baseGrad = fctx.createRadialGradient(W / 2, H / 2, 100, W / 2, H / 2, W);
            baseGrad.addColorStop(0, theme.floorLight);
            baseGrad.addColorStop(0.4, theme.floorBase);
            baseGrad.addColorStop(1, theme.floorDark);
            fctx.fillStyle = baseGrad;
            fctx.fillRect(0, 0, W, H);

            if (theme.floorType === 'concrete') {
                for (let i = 0; i < 400; i++) {
                    const x = Math.random() * W, y = Math.random() * H, r = 5 + Math.random() * 40;
                    const grad = fctx.createRadialGradient(x, y, 0, x, y, r);
                    grad.addColorStop(0, 'rgba(255,255,255,0.02)');
                    grad.addColorStop(1, 'rgba(0,0,0,0)');
                    fctx.fillStyle = grad;
                    fctx.beginPath(); fctx.arc(x, y, r, 0, Math.PI * 2); fctx.fill();
                }
            } else if (theme.floorType === 'tile') {
                const tileSize = 60;
                for (let x = 0; x < W; x += tileSize) {
                    for (let y = 0; y < H; y += tileSize) {
                        const v = Math.random() * 0.05;
                        fctx.fillStyle = `rgba(255,255,255,${v})`;
                        fctx.fillRect(x, y, tileSize, tileSize);
                        fctx.strokeStyle = 'rgba(0,0,0,0.5)';
                        fctx.lineWidth = 1;
                        fctx.strokeRect(x + 0.5, y + 0.5, tileSize - 1, tileSize - 1);
                    }
                }
            } else if (theme.floorType === 'stone') {
                const size = 50;
                for (let y = 0; y < H + size; y += size) {
                    for (let x = 0; x < W + size; x += size) {
                        const offsetX = (Math.floor(y / size) % 2) * (size / 2);
                        const px = x + offsetX;
                        fctx.fillStyle = `rgba(255,255,255,${Math.random() * 0.08})`;
                        fctx.fillRect(px + 2, y + 2, size - 4, size - 4);
                        fctx.strokeStyle = 'rgba(0,0,0,0.6)';
                        fctx.lineWidth = 1.5;
                        fctx.strokeRect(px + 1, y + 1, size - 2, size - 2);
                    }
                }
            } else if (theme.floorType === 'grass') {
                for (let i = 0; i < 500; i++) {
                    const x = Math.random() * W, y = Math.random() * H, r = 20 + Math.random() * 60;
                    const grad = fctx.createRadialGradient(x, y, 0, x, y, r);
                    grad.addColorStop(0, 'rgba(100,255,150,0.05)');
                    grad.addColorStop(1, 'rgba(0,0,0,0)');
                    fctx.fillStyle = grad;
                    fctx.beginPath(); fctx.arc(x, y, r, 0, Math.PI * 2); fctx.fill();
                }
            } else if (theme.floorType === 'dirt') {
                for (let i = 0; i < 300; i++) {
                    const x = Math.random() * W, y = Math.random() * H, r = 3 + Math.random() * 20;
                    fctx.fillStyle = `rgba(0,0,0,${0.05 + Math.random() * 0.1})`;
                    fctx.beginPath(); fctx.arc(x, y, r, 0, Math.PI * 2); fctx.fill();
                }
            } else if (theme.floorType === 'cyber') {
                fctx.strokeStyle = 'rgba(0,255,255,0.1)';
                for (let x = 0; x < W; x += 30) { fctx.beginPath(); fctx.moveTo(x, 0); fctx.lineTo(x, H); fctx.stroke(); }
                for (let y = 0; y < H; y += 30) { fctx.beginPath(); fctx.moveTo(0, y); fctx.lineTo(W, y); fctx.stroke(); }
            } else if (theme.floorType === 'grid') {
                fctx.fillStyle = theme.floorBase;
                fctx.fillRect(0, 0, W, H);
                for (let x = 0; x < W; x += 50) {
                    for (let y = 0; y < H; y += 50) {
                        fctx.strokeStyle = 'rgba(255,255,68,0.1)';
                        fctx.strokeRect(x + 0.5, y + 0.5, 49, 49);
                    }
                }
            } else if (theme.floorType === 'rock') {
                for (let i = 0; i < 100; i++) {
                    const x = Math.random() * W, y = Math.random() * H, r = 10 + Math.random() * 50;
                    const grad = fctx.createRadialGradient(x, y, 0, x, y, r);
                    grad.addColorStop(0, 'rgba(0,0,0,0.15)');
                    grad.addColorStop(1, 'rgba(0,0,0,0)');
                    fctx.fillStyle = grad;
                    fctx.beginPath(); fctx.arc(x, y, r, 0, Math.PI * 2); fctx.fill();
                }
            } else if (theme.floorType === 'plasma') {
                const baseGrad2 = fctx.createRadialGradient(W / 2, H / 2, 50, W / 2, H / 2, W);
                baseGrad2.addColorStop(0, 'rgba(150,50,255,0.15)');
                baseGrad2.addColorStop(1, 'rgba(50,0,100,0)');
                fctx.fillStyle = baseGrad2;
                fctx.fillRect(0, 0, W, H);
            } else if (theme.floorType === 'magma') {
                fctx.fillStyle = theme.floorBase;
                fctx.fillRect(0, 0, W, H);
                for (let i = 0; i < 40; i++) {
                    const x = Math.random() * W, y = Math.random() * H;
                    fctx.strokeStyle = `rgba(255,${80 + Math.random() * 100},0,${0.4 + Math.random() * 0.4})`;
                    fctx.lineWidth = 1 + Math.random() * 2;
                    fctx.shadowBlur = 15;
                    fctx.shadowColor = '#ff4400';
                    fctx.beginPath(); fctx.moveTo(x, y);
                    let cx2 = x, cy2 = y;
                    for (let s = 0; s < 6; s++) {
                        cx2 += (Math.random() - 0.5) * 100;
                        cy2 += (Math.random() - 0.5) * 100;
                        fctx.lineTo(cx2, cy2);
                    }
                    fctx.stroke();
                }
                fctx.shadowBlur = 0;
            }

            const edgeGrad = fctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.95);
            edgeGrad.addColorStop(0, 'rgba(0,0,0,0)');
            edgeGrad.addColorStop(1, 'rgba(0,0,0,0.6)');
            fctx.fillStyle = edgeGrad;
            fctx.fillRect(0, 0, W, H);
        }

        /* =========================================================

        const player = {

        function getWeapon() { return WEAPONS[PHASES[currentPhase].weapon]; }

        function findFreeSpawn() {
            const candidates = [
                { x: W / 2, y: H / 2 },
                { x: W / 2, y: H / 2 + 200 }, { x: W / 2, y: H / 2 - 200 },
                { x: 300, y: 300 }, { x: W - 300, y: 300 },
                { x: 300, y: H - 300 }, { x: W - 300, y: H - 300 }
            ];
            for (const c of candidates) if (!circleHitsWalls(c.x, c.y, player.r + 8)) return c;
            return { x: W / 2, y: H / 2 };
        }

        function spawnPlayer() {
            const p = findFreeSpawn();
            player.x = p.x; player.y = p.y;
            player.hp = player.maxHp;
            player.reloading = false;
            player.reloadTimer = 0;

        /* =========================================================

        ========================================================= */
        let bullets = [];

        let enemyBullets = [];
        let particles = [];
        let bloodStains = [];
        let casings = [];
        let allies = [];

        let coinDrops = [];
        let explosions = [];
        let healthDrops = [];
        let medkits = [];
        let floatingTexts = [];

        /* =========================================================
           COLISÃO
        ========================================================= */
        function circleHitsRect(cx, cy, r, rect) {
            const closestX = Math.max(rect.x, Math.min(cx, rect.x + rect.w));
            const closestY = Math.max(rect.y, Math.min(cy, rect.y + rect.h));
            const dx = cx - closestX, dy = cy - closestY;
            return dx * dx + dy * dy < r * r;
        }
        function circleHitsWalls(x, y, r) {
            for (const w of walls) if (circleHitsRect(x, y, r, w)) return true;
            return false;
        }
        function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
        function hasLineOfSight(a, b) {
            const steps = 14;
            for (let i = 1; i < steps; i++) {
                const t = i / steps;
                const x = a.x + (b.x - a.x) * t;
                const y = a.y + (b.y - a.y) * t;
                if (circleHitsWalls(x, y, 3)) return false;
            }
            return true;
        }

        /* =========================================================
           INPUT — CORRIGIDO
        ========================================================= */
        document.addEventListener('keydown', e => {
            const k = e.key.toLowerCase();
            keys[k] = true;

            if (gameState === 'menu') {
                if (confirmClear) {
                    if (k === 'enter' || k === ' ') clickButton('yes');
                    if (k === 'escape') clickButton('no');
                    return;
                }
                if (k === 'arrowup' || k === 'w') menuSelection = Math.max(0, menuSelection - 1);
                if (k === 'arrowdown' || k === 's') menuSelection = Math.min(3, menuSelection + 1);
                if (k === 'enter' || k === ' ') {
                    if (menuSelection === 0) clickButton('start');
                    else if (menuSelection === 1) clickButton('records');
                    else if (menuSelection === 2) clickButton('skins');
                    else if (menuSelection === 3) clickButton('clear');
                }
                return;
            }

            if (gameState === 'records') {
                if (k === 'escape' || k === 'enter' || k === ' ') clickButton('back');
                return;
            }

            if (gameState === 'skins') {
                if (k === 'escape') { gameState = 'menu'; return; }
                const cols = 5;
                if (k === 'arrowleft' || k === 'a') skinsSelection = Math.max(0, skinsSelection - 1);
                if (k === 'arrowright' || k === 'd') skinsSelection = Math.min(SKINS.length - 1, skinsSelection + 1);
                if (k === 'arrowup' || k === 'w') skinsSelection = Math.max(0, skinsSelection - cols);
                if (k === 'arrowdown' || k === 's') skinsSelection = Math.min(SKINS.length - 1, skinsSelection + cols);
                if (k === 'enter' || k === ' ') {
                    if (isSkinUnlocked(SKINS[skinsSelection])) { selectedSkin = skinsSelection; saveUnlocks(); }
                }
                return;
            }

            if (gameState === 'paused') {
                if (k === 'p' || k === 'escape') { clickButton('resume'); return; }
                if (k === 'arrowup' || k === 'w') pauseSelection = Math.max(0, pauseSelection - 1);
                if (k === 'arrowdown' || k === 's') pauseSelection = Math.min(2, pauseSelection + 1);
                if (k === 'enter' || k === ' ') {
                    if (pauseSelection === 0) clickButton('resume');
                    else if (pauseSelection === 1) clickButton('restart');
                    else if (pauseSelection === 2) clickButton('menu');
                }
                return;
            }

            if (gameState === 'shop') {
                const cols = 2;
                if (k === 'arrowup' || k === 'w') shopSelection = Math.max(0, shopSelection - cols);
                if (k === 'arrowdown' || k === 's') shopSelection = Math.min(shopItems.length - 1, shopSelection + cols);
                if (k === 'arrowleft' || k === 'a') shopSelection = Math.max(0, shopSelection - 1);
                if (k === 'arrowright' || k === 'd') shopSelection = Math.min(shopItems.length - 1, shopSelection + 1);
                if (k === 'enter' || k === ' ') buyItem(shopSelection);
                if (k === 'escape' || k === 'tab') clickButton('continue');
                return;
            }

            if (gameState === 'playing') {
                if (k === 'p' || k === 'escape') { gameState = 'paused'; pauseSelection = 0; return; }
                if (k === 'r' && !player.reloading && player.ammo < player.maxAmmo) startReload();
            } else if (gameState === 'gameOver' || gameState === 'victory') {
                if (k === 'r' || k === 'enter') startGame();
                if (k === 'escape') gameState = 'menu';
            } else if (gameState === 'waveComplete') {
                if (k === 'enter' || k === ' ') openShop();
            }
            if (e.key === ' ') e.preventDefault();
        });
        document.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        // ==== SISTEMA DE MOUSE CORRIGIDO ====
        function updateMousePos(e) {
            const r = canvas.getBoundingClientRect();
            mouse.x = (e.clientX - r.left) * (W / r.width);
            mouse.y = (e.clientY - r.top) * (H / r.height);
        }

        canvas.addEventListener('mousemove', updateMousePos);

        canvas.addEventListener('mousedown', e => {
            updateMousePos(e); // ← atualiza a posição ANTES de checar o clique

            if (e.button === 0) {
                mouse.down = true;

                if (gameState === 'menu') {
                    if (confirmClear) {
                        if (mouseOverButton(BUTTONS.confirmClear[0])) clickButton('yes');
                        else if (mouseOverButton(BUTTONS.confirmClear[1])) clickButton('no');
                        return;
                    }
                    for (const btn of BUTTONS.menu) {
                        if (mouseOverButton(btn)) { clickButton(btn.id); return; }
                    }
                }
                else if (gameState === 'records') {
                    for (const btn of BUTTONS.records) {
                        if (mouseOverButton(btn)) { clickButton(btn.id); return; }
                    }
                }
                else if (gameState === 'skins') {
                    for (const btn of BUTTONS.skins) {
                        if (mouseOverButton(btn)) { clickButton(btn.id); return; }
                    }
                    const cardW = 130, cardH = 130;
                    const cols = 5, gapX = 20, gapY = 40;
                    const gridW = cols * cardW + (cols - 1) * gapX;
                    const startX = W / 2 - gridW / 2;
                    const startY = 165;
                    for (let i = 0; i < SKINS.length; i++) {
                        const col = i % cols, row = Math.floor(i / cols);
                        const cx = startX + col * (cardW + gapX);
                        const cy = startY + row * (cardH + gapY);
                        if (mouse.x >= cx && mouse.x <= cx + cardW && mouse.y >= cy && mouse.y <= cy + cardH) {
                            skinsSelection = i;
                            if (isSkinUnlocked(SKINS[i])) { selectedSkin = i; saveUnlocks(); }
                            return;
                        }
                    }
                }
                else if (gameState === 'paused') {
                    for (const btn of BUTTONS.pause) {
                        if (mouseOverButton(btn)) { clickButton(btn.id); return; }
                    }
                }
                else if (gameState === 'shop') {
                    const contBtn = { x: W / 2 - 130, y: H - 60, w: 260, h: 46 };
                    if (mouseOverButton(contBtn)) { clickButton('continue'); return; }
                    for (let i = 0; i < shopItems.length; i++) {
                        const it = shopItems[i];
                        if (mouse.x >= it.x && mouse.x <= it.x + it.w &&
                            mouse.y >= it.y && mouse.y <= it.y + it.h) {
                            shopSelection = i;
                            buyItem(i);
                            return;
                        }
                    }
                }
                else if (gameState === 'waveComplete') {
                    // Qualquer clique na tela abre a loja (ou o botão específico)
                    for (const btn of BUTTONS.waveComplete) {
                        if (mouseOverButton(btn)) { openShop(); return; }
                    }
                    // Clicar em qualquer lugar também abre
                    openShop();
                }
                else if (gameState === 'playing') {
                    if (mouseOverButton(BUTTONS.pauseButton)) {
                        gameState = 'paused';
                        pauseSelection = 0;
                        return;
                    }
                }
            }
        });

        canvas.addEventListener('mouseup', e => { if (e.button === 0) mouse.down = false; });
        canvas.addEventListener('contextmenu', e => e.preventDefault());

        // Suporte a toque
        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            const touch = e.touches[0];
            updateMousePos({ clientX: touch.clientX, clientY: touch.clientY });
            mouse.down = true;

            // Mesmo comportamento do mousedown
            if (gameState === 'waveComplete') { openShop(); return; }
            if (gameState === 'playing' && mouseOverButton(BUTTONS.pauseButton)) {
                gameState = 'paused'; pauseSelection = 0; return;
            }
            if (gameState === 'paused') {
                for (const btn of BUTTONS.pause) {
                    if (mouseOverButton(btn)) { clickButton(btn.id); return; }
                }
            }
            if (gameState === 'menu') {
                for (const btn of BUTTONS.menu) {
                    if (mouseOverButton(btn)) { clickButton(btn.id); return; }
                }
            }
        }, { passive: false });

        canvas.addEventListener('touchend', e => {
            e.preventDefault();
            mouse.down = false;
        }, { passive: false });

        /* =========================================================
           INICIAR / FASES
        ========================================================= */
        function startGame() {
            score = 0; coins = 50; currentPhase = 0; recordSaved = false;
            upgrades.damage = 0; upgrades.speed = 0; upgrades.maxHp = 0;
            upgrades.reload = 0; upgrades.extraAlly = 0; upgrades.regen = 0;
            upgrades.magnet = 0; upgrades.medkitDrop = 0;
            regenAccumulator = 0;
            loadPhase();
            gameState = 'playing';
        }

        function loadPhase() {
            const phase = PHASES[currentPhase];
            buildMap(phase.map);
            spawnPlayer();

            player.maxHp = phase.playerHp + upgrades.maxHp * 25;
            player.hp = player.maxHp;
            player.speed = 5.2 + upgrades.speed * 0.5;

            const wp = WEAPONS[phase.weapon];
            player.maxAmmo = wp.ammoPerReload;
            player.ammo = player.maxAmmo;
            player.reloadTime = Math.max(20, wp.reloadTime - upgrades.reload * 10);

            bullets = []; enemies = []; enemyBullets = []; particles = [];
            bloodStains = []; casings = []; coinDrops = []; explosions = [];
            healthDrops = []; medkits = []; floatingTexts = [];
            allies = []; allyBullets = [];
            spawnTimer = 0; phaseTime = 0; killsThisPhase = 0;
            medkitTimer = 300;
            shakeTime = 0; banner = 150; bannerText = phase.name;
            allySpawnBanner = phase.allies > 0 ? 180 : 0;

            updateMaxPhase(currentPhase + 1);

            const totalAllies = phase.allies + upgrades.extraAlly;
            if (totalAllies > 0) {
                for (let i = 0; i < totalAllies; i++) {
                    const angle = (i / totalAllies) * Math.PI * 2;
                    const off = 55 + (i % 2) * 15;
                    let ax = player.x + Math.cos(angle) * off;
                    let ay = player.y + Math.sin(angle) * off;
                    if (circleHitsWalls(ax, ay, 14)) { ax = player.x + (i % 2 === 0 ? 40 : -40); ay = player.y + 40; }
                    allies.push({
                        x: ax, y: ay, r: 13, speed: 4.6,
                        hp: 30, maxHp: 30, angle: 0,
                        shootCooldown: 30 + i * 10, fireRate: 32, range: 520,
                        dmg: 1 + Math.floor(upgrades.damage / 2), bulletSpeed: 12,
                        target: null, hitFlash: 0,
                        animPhase: Math.random() * Math.PI * 2,
                        strafePhase: Math.random() * Math.PI * 2,
                        walkPhase: Math.random() * Math.PI * 2
                    });
                }
            }
        }

        function nextPhase() {
            currentPhase++;
            if (currentPhase >= PHASES.length) {
                if (!recordSaved) { records = addRecord(score, PHASES.length, coins, true); recordSaved = true; }
                updateMaxPhase(10);
                gameState = 'victory';
            } else { loadPhase(); gameState = 'playing'; }
        }

        /* =========================================================
           AÇÕES
        ========================================================= */
        function startReload() {
            if (player.reloading || player.ammo === player.maxAmmo) return;
            player.reloading = true;
            player.reloadTimer = player.reloadTime;
        }

        function shoot() {
            const wp = getWeapon();
            if (player.reloading || player.shootCooldown > 0) return;
            if (player.ammo <= 0) { startReload(); return; }

            for (let p = 0; p < wp.pellets; p++) {
                let angleOffset = 0;
                if (wp.pellets === 2 && p === 0) angleOffset = -0.06;
                if (wp.pellets === 2 && p === 1) angleOffset = 0.06;
                const spread = (Math.random() - 0.5) * wp.spread * 2 + angleOffset;
                const a = player.angle + spread;
                const mx = player.x + Math.cos(a) * (player.r + 22);
                const my = player.y + Math.sin(a) * (player.r + 22);
                bullets.push({
                    x: mx, y: my,
                    vx: Math.cos(a) * wp.bulletSpeed, vy: Math.sin(a) * wp.bulletSpeed,
                    r: wp.bulletR, life: wp.rail ? 30 : 70,
                    damage: wp.damage + upgrades.damage,
                    pierce: wp.pierce, explosive: wp.explosive, rail: wp.rail,
                    hitList: [], color: wp.color, glow: wp.glow, trail: []
                });
            }

            const a = player.angle;
            const nX = player.x - Math.cos(a) * 1.5;
            const nY = player.y - Math.sin(a) * 1.5;
            if (!circleHitsWalls(nX, player.y, player.r)) player.x = nX;
            if (!circleHitsWalls(player.x, nY, player.r)) player.y = nY;

            player.ammo--;
            player.shootCooldown = wp.fireRate;
            player.recoil = wp.pellets > 1 ? 6 : wp.damage >= 3 ? 9 : 4;
            shakeTime = wp.pellets > 1 ? 7 : wp.damage >= 3 ? 10 : 4;
            shakeAmount = wp.pellets > 1 ? 5 : wp.damage >= 3 ? 8 : 2.5;
            muzzleFlash = 4;

            const perpA = a + Math.PI / 2;
            casings.push({
                x: player.x + Math.cos(a) * 24, y: player.y + Math.sin(a) * 24,
                vx: Math.cos(perpA) * (2 + Math.random() * 2) + Math.cos(a) * -1,
                vy: Math.sin(perpA) * (2 + Math.random() * 2) + Math.sin(a) * -1,
                life: 60, maxLife: 60, angle: Math.random() * Math.PI * 2,
                spin: (Math.random() - 0.5) * 0.4
            });

            for (let i = 0; i < (wp.pellets > 1 ? 12 : 7); i++) {
                const sa = a + (Math.random() - 0.5) * 0.7;
                const sp = 3 + Math.random() * 5;
                particles.push({
                    x: player.x + Math.cos(a) * 26, y: player.y + Math.sin(a) * 26,
                    vx: Math.cos(sa) * sp, vy: Math.sin(sa) * sp,
                    life: 10 + Math.random() * 8, maxLife: 18,
                    color: wp.color, size: 2 + Math.random() * 2, glow: true
                });
            }
        }

        function healPlayer(amount) {
            const before = player.hp;
            player.hp = Math.min(player.maxHp, player.hp + amount);
            const healed = player.hp - before;
            if (healed <= 0) return;
            healFlash = 20;
            floatingTexts.push({ x: player.x, y: player.y - 30, text: '+' + healed, color: '#44ff88', life: 60, maxLife: 60, vy: -0.8 });
        }

        function dropHealth(x, y) {
            const chance = 0.15 + upgrades.medkitDrop * 0.1;
            if (Math.random() > chance) return;
            const a = Math.random() * Math.PI * 2;
            healthDrops.push({
                x, y, vx: Math.cos(a) * 3, vy: Math.sin(a) * 3, r: 9, life: 500,
                healAmount: 15 + upgrades.medkitDrop * 5, animPhase: Math.random() * Math.PI * 2
            });
        }

        function spawnEnemy() {
            const phase = PHASES[currentPhase];
            const types = phase.enemyTypes;
            let best = null, bestDist = 0;
            for (let attempt = 0; attempt < 50; attempt++) {
                const side = Math.floor(Math.random() * 4);
                let x, y;
                if (side === 0) { x = 60 + Math.random() * (W - 120); y = 60; }
                else if (side === 1) { x = W - 60; y = 60 + Math.random() * (H - 120); }
                else if (side === 2) { x = 60 + Math.random() * (W - 120); y = H - 60; }
                else { x = 60; y = 60 + Math.random() * (H - 120); }
                if (circleHitsWalls(x, y, 25)) continue;
                const d = Math.hypot(x - player.x, y - player.y);
                if (d < 220) continue;
                if (d > bestDist) { bestDist = d; best = { x, y }; }
            }
            if (!best) return;

            const type = types[Math.floor(Math.random() * types.length)];
            const stats = {
                pistol: { r: 14, speed: 1.1, hp: 3, color: '#ff5555', glow: '#ff2222', fireRate: 90, range: 480, dmg: 8, bulletSpeed: 6 },
                smg: { r: 13, speed: 1.5, hp: 2, color: '#ffaa33', glow: '#ff8800', fireRate: 16, range: 380, dmg: 5, bulletSpeed: 7 },
                shotgun: { r: 17, speed: 0.7, hp: 5, color: '#cc44ff', glow: '#aa22ff', fireRate: 120, range: 300, dmg: 7, bulletSpeed: 5.5, pellets: 3 },
                sniper: { r: 15, speed: 0.5, hp: 4, color: '#44ffaa', glow: '#00ff88', fireRate: 160, range: 900, dmg: 18, bulletSpeed: 11 }
            }[type];

            const hpBonus = Math.floor(currentPhase / 2);
            const spdBonus = currentPhase * 0.06;

            enemies.push({
                x: best.x, y: best.y,
                r: stats.r, speed: stats.speed + spdBonus,
                hp: stats.hp + hpBonus, maxHp: stats.hp + hpBonus,
                type, color: stats.color, glow: stats.glow,
                angle: 0, fireRate: stats.fireRate, range: stats.range,
                dmg: stats.dmg, bulletSpeed: stats.bulletSpeed,
                pellets: stats.pellets || 1,
                shootTimer: 40 + Math.random() * stats.fireRate,
                hitFlash: 0,
                strafeDir: Math.random() < 0.5 ? 1 : -1, strafeTimer: 0,
                spawnFade: 30, animPhase: Math.random() * Math.PI * 2
            });
        }

        function explode(x, y, color, count = 12, speed = 5) {
            for (let i = 0; i < count; i++) {
                const a = Math.random() * Math.PI * 2;
                const s = Math.random() * speed;
                particles.push({
                    x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
                    life: 20 + Math.random() * 15, maxLife: 35,
                    color, size: 2 + Math.random() * 3, glow: true
                });
            }
        }

        function plasmaExplosion(x, y, radius, damage) {
            explosions.push({ x, y, radius: 0, maxRadius: radius, life: 15, maxLife: 15 });
            explode(x, y, '#aa44ff', 30, 8);
            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                if (dist({ x, y }, e) < radius + e.r) {
                    e.hp -= damage; e.hitFlash = 8;
                    if (e.hp <= 0) {
                        explode(e.x, e.y, e.color, 25, 8);
                        const killValue = { pistol: 15, smg: 20, shotgun: 30, sniper: 40 }[e.type] || 15;
                        score += killValue; killsThisPhase++;
                        const coinAmount = { pistol: 2, smg: 2, shotgun: 4, sniper: 5 }[e.type] || 2;
                        dropCoins(e.x, e.y, coinAmount); dropHealth(e.x, e.y);
                        enemies.splice(i, 1);
                    }
                }
            }
        }

        function damagePlayer(amount) {
            if (playerInvuln > 0) return;
            player.hp -= amount;
            playerInvuln = 30;
            shakeTime = 16; shakeAmount = 10; hitStop = 3;
            if (player.hp <= 0) {
                player.hp = 0;
                if (!recordSaved) { records = addRecord(score, currentPhase + 1, coins, false); recordSaved = true; }
                updateMaxPhase(currentPhase + 1);
                gameState = 'gameOver';
            }
        }

        function unstickPlayer() {
            if (!circleHitsWalls(player.x, player.y, player.r)) return;
            for (let radius = 3; radius <= 50; radius += 3) {
                for (let i = 0; i < 24; i++) {
                    const a = (i / 24) * Math.PI * 2;
                    const nx = player.x + Math.cos(a) * radius;
                    const ny = player.y + Math.sin(a) * radius;
                    if (!circleHitsWalls(nx, ny, player.r)) { player.x = nx; player.y = ny; return; }
                }
            }
            const p = findFreeSpawn();
            player.x = p.x; player.y = p.y;
        }

        function dropCoins(x, y, amount) {
            for (let i = 0; i < amount; i++) {
                const a = Math.random() * Math.PI * 2;
                const s = 2 + Math.random() * 3;
                coinDrops.push({
                    x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, r: 5, life: 400, value: 1,
                    animPhase: Math.random() * Math.PI * 2
                });
            }
        }

        function updateAlly(a) {
            if (a.hitFlash > 0) a.hitFlash--;
            a.animPhase += 0.08; a.strafePhase += 0.03;
            a.walkPhase += 0.2;

            let best = null, bestD = a.range;
            for (const e of enemies) {
                const d = dist(a, e);
                if (d < bestD && hasLineOfSight(a, e)) { best = e; bestD = d; }
            }
            a.target = best;
            let mx = 0, my = 0;

            if (best) {
                const ddx = best.x - a.x, ddy = best.y - a.y;
                const d = Math.hypot(ddx, ddy) || 1;
                a.angle = Math.atan2(ddy, ddx);
                const idealDist = 180;
                if (d > idealDist + 40) { mx = (ddx / d) * a.speed; my = (ddy / d) * a.speed; }
                else if (d < idealDist - 60) { mx = -(ddx / d) * a.speed * 0.7; my = -(ddy / d) * a.speed * 0.7; }
                else {
                    const px = -ddy / d, py = ddx / d;
                    const s = Math.sin(a.strafePhase) > 0 ? 1 : -1;
                    mx = px * s * a.speed * 0.6; my = py * s * a.speed * 0.6;
                }
                a.shootCooldown--;
                if (a.shootCooldown <= 0) { fireAllyWeapon(a); a.shootCooldown = a.fireRate; }
            } else {
                const ddx = player.x - a.x, ddy = player.y - a.y;
                const d = Math.hypot(ddx, ddy) || 1;
                a.angle = Math.atan2(ddy, ddx);
                const followDist = 80 + (a.__index || 0) * 15;
                if (d > followDist + 20) { mx = (ddx / d) * a.speed * 0.8; my = (ddy / d) * a.speed * 0.8; }
                else if (d < followDist - 30) { mx = -(ddx / d) * a.speed * 0.4; my = -(ddy / d) * a.speed * 0.4; }
                if (a.shootCooldown > 0) a.shootCooldown--;
            }

            if (!circleHitsWalls(a.x + mx, a.y, a.r)) a.x += mx;
            if (!circleHitsWalls(a.x, a.y + my, a.r)) a.y += my;

            if (circleHitsWalls(a.x, a.y, a.r)) {
                for (let radius = 3; radius <= 40; radius += 3) {
                    for (let i = 0; i < 16; i++) {
                        const ang = (i / 16) * Math.PI * 2;
                        const nx = a.x + Math.cos(ang) * radius;
                        const ny = a.y + Math.sin(ang) * radius;
                        if (!circleHitsWalls(nx, ny, a.r)) { a.x = nx; a.y = ny; break; }
                    }
                }
            }
        }

        function fireAllyWeapon(a) {
            const spread = (Math.random() - 0.5) * 0.1;
            const ang = a.angle + spread;
            allyBullets.push({
                x: a.x + Math.cos(ang) * (a.r + 14), y: a.y + Math.sin(ang) * (a.r + 14),
                vx: Math.cos(ang) * a.bulletSpeed, vy: Math.sin(ang) * a.bulletSpeed,
                r: 3, life: 60, damage: a.dmg,
                color: '#88ffbb', glow: '#00ff88'
            });
        }

        function update() {
            if (gameState !== 'playing') return;
            if (hitStop > 0) { hitStop--; return; }

            if (shakeTime > 0) shakeTime--;
            if (muzzleFlash > 0) muzzleFlash--;
            if (playerInvuln > 0) playerInvuln--;
            if (banner > 0) banner--;
            if (allySpawnBanner > 0) allySpawnBanner--;
            if (healFlash > 0) healFlash--;
            if (player.recoil > 0) player.recoil *= 0.8;
            player.walkPhase += 0.22;

            phaseTime++;
            unstickPlayer();

            if (upgrades.regen > 0 && player.hp < player.maxHp) {
                regenAccumulator++;
                if (regenAccumulator >= Math.max(15, 60 - upgrades.regen * 15)) {
                    regenAccumulator = 0;
                    player.hp = Math.min(player.maxHp, player.hp + 1);
                }
            }

            medkitTimer--;
            if (medkitTimer <= 0) {
                medkitTimer = 400 + Math.random() * 300;
                if (player.hp < player.maxHp * 0.8) {
                    for (let attempt = 0; attempt < 20; attempt++) {
                        const x = 100 + Math.random() * (W - 200);
                        const y = 100 + Math.random() * (H - 200);
                        if (circleHitsWalls(x, y, 20)) continue;
                        medkits.push({ x, y, r: 14, life: 900, healAmount: 40, animPhase: Math.random() * Math.PI * 2 });
                        break;
                    }
                }
            }

            player.angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);

            let dx = 0, dy = 0;
            if (keys['w'] || keys['arrowup']) dy -= 1;
            if (keys['s'] || keys['arrowdown']) dy += 1;
            if (keys['a'] || keys['arrowleft']) dx -= 1;
            if (keys['d'] || keys['arrowright']) dx += 1;
            if (dx || dy) {
                const len = Math.hypot(dx, dy);
                dx = (dx / len) * player.speed; dy = (dy / len) * player.speed;
                if (!circleHitsWalls(player.x + dx, player.y, player.r)) player.x += dx;
                if (!circleHitsWalls(player.x, player.y + dy, player.r)) player.y += dy;
            }

            const wp = getWeapon();
            if (mouse.down) {
                shoot();
                if (!wp.auto && player.shootCooldown > wp.fireRate * 0.6) player.shootCooldown = wp.fireRate;
            }
            if (player.shootCooldown > 0) player.shootCooldown--;

            if (player.reloading) {
                player.reloadTimer--;
                if (player.reloadTimer <= 0) { player.reloading = false; player.ammo = player.maxAmmo; }
            }

            const phase = PHASES[currentPhase];
            spawnTimer++;
            if (spawnTimer >= phase.spawnInterval && enemies.length < phase.maxEnemies) {
                spawnTimer = 0; spawnEnemy();
            }

            allies.forEach((a, i) => { a.__index = i; updateAlly(a); });

            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.trail.push({ x: b.x, y: b.y });
                if (b.trail.length > (b.rail ? 20 : 6)) b.trail.shift();
                b.x += b.vx; b.y += b.vy; b.life--;
                if (b.life <= 0 || b.x < 0 || b.x > W || b.y < 0 || b.y > H || circleHitsWalls(b.x, b.y, b.r)) {
                    if (b.explosive) plasmaExplosion(b.x, b.y, 80, b.damage);
                    else explode(b.x, b.y, b.color, 5, 3);
                    bullets.splice(i, 1);
                }
            }

            for (let i = allyBullets.length - 1; i >= 0; i--) {
                const b = allyBullets[i];
                b.x += b.vx; b.y += b.vy; b.life--;
                if (b.life <= 0 || b.x < 0 || b.x > W || b.y < 0 || b.y > H || circleHitsWalls(b.x, b.y, b.r)) {
                    explode(b.x, b.y, '#88ffbb', 4, 3);
                    allyBullets.splice(i, 1);
                }
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                if (e.hitFlash > 0) e.hitFlash--;
                if (e.spawnFade > 0) e.spawnFade--;
                e.animPhase += 0.1;

                let target = player;
                let minAllyD = 200;
                for (const a of allies) {
                    const d = dist(e, a);
                    if (d < minAllyD) { minAllyD = d; target = a; }
                }

                const ddx = target.x - e.x, ddy = target.y - e.y;
                const d = Math.hypot(ddx, ddy) || 1;
                e.angle = Math.atan2(ddy, ddx);
                const los = hasLineOfSight(e, target);

                e.strafeTimer--;
                if (e.strafeTimer <= 0) {
                    e.strafeDir = Math.random() < 0.5 ? 1 : -1;
                    e.strafeTimer = 60 + Math.random() * 90;
                }

                let mx = 0, my = 0;
                if (!los) { mx = (ddx / d) * e.speed; my = (ddy / d) * e.speed; }
                else if (d > e.range * 0.75) { mx = (ddx / d) * e.speed; my = (ddy / d) * e.speed; }
                else if (d < e.range * 0.45) { mx = -(ddx / d) * e.speed; my = -(ddy / d) * e.speed; }
                else {
                    const px = -ddy / d, py = ddx / d;
                    mx = px * e.strafeDir * e.speed * 0.9;
                    my = py * e.strafeDir * e.speed * 0.9;
                }

                if (!circleHitsWalls(e.x + mx, e.y, e.r)) e.x += mx;
                else if (!circleHitsWalls(e.x, e.y + my, e.r)) e.y += my;
                else {
                    const ppx = -my, ppy = mx;
                    if (!circleHitsWalls(e.x + ppx, e.y, e.r)) e.x += ppx;
                    if (!circleHitsWalls(e.x, e.y + ppy, e.r)) e.y += ppy;
                }

                e.shootTimer--;
                if (e.shootTimer <= 0 && los && d < e.range && e.spawnFade <= 0) {
                    fireEnemyWeapon(e, target);
                    e.shootTimer = e.fireRate + Math.random() * e.fireRate * 0.4;
                }

                if (dist(e, player) < e.r + player.r) {
                    damagePlayer(8);
                    const dd = dist(e, player) || 1;
                    const push = 20;
                    const px = ((e.x - player.x) / dd) * push, py = ((e.y - player.y) / dd) * push;
                    if (!circleHitsWalls(e.x + px, e.y, e.r)) e.x += px;
                    if (!circleHitsWalls(e.x, e.y + py, e.r)) e.y += py;
                }

                for (const a of allies) {
                    if (dist(e, a) < e.r + a.r) {
                        a.hp -= 10; a.hitFlash = 8;
                        const dd = dist(e, a) || 1;
                        const push = 15;
                        const px = ((a.x - e.x) / dd) * push, py = ((a.y - e.y) / dd) * push;
                        if (!circleHitsWalls(a.x + px, a.y, a.r)) a.x += px;
                        if (!circleHitsWalls(a.x, a.y + py, a.r)) a.y += py;
                    }
                }
            }

            function fireEnemyWeapon(e, target) {
                const baseAngle = Math.atan2(target.y - e.y, target.x - e.x);
                function makeShot(angle, dmg, speed, r, color, glow) {
                    enemyBullets.push({
                        x: e.x + Math.cos(angle) * e.r, y: e.y + Math.sin(angle) * e.r,
                        vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
                        r, life: 150, damage: dmg, color, glow
                    });
                }
                if (e.type === 'pistol') {
                    const spread = (Math.random() - 0.5) * 0.14;
                    makeShot(baseAngle + spread, e.dmg, e.bulletSpeed, 4, '#ff8888', '#ff2222');
                } else if (e.type === 'smg') {
                    const spread = (Math.random() - 0.5) * 0.28;
                    makeShot(baseAngle + spread, e.dmg, e.bulletSpeed, 3, '#ffcc44', '#ff8800');
                } else if (e.type === 'shotgun') {
                    for (let k = -1; k <= 1; k++) {
                        const a = baseAngle + k * 0.22 + (Math.random() - 0.5) * 0.06;
                        makeShot(a, e.dmg, e.bulletSpeed, 4, '#cc66ff', '#aa22ff');
                    }
                } else if (e.type === 'sniper') {
                    makeShot(baseAngle, e.dmg, e.bulletSpeed, 5, '#66ffcc', '#00ff88');
                }
            }

            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                const b = enemyBullets[i];
                b.x += b.vx; b.y += b.vy; b.life--;
                if (b.life <= 0 || b.x < 0 || b.x > W || b.y < 0 || b.y > H || circleHitsWalls(b.x, b.y, b.r)) {
                    explode(b.x, b.y, b.color || '#ff44ff', 4, 3);
                    enemyBullets.splice(i, 1); continue;
                }
                if (dist(b, player) < b.r + player.r) {
                    damagePlayer(b.damage || 10);
                    explode(b.x, b.y, b.color || '#ff44ff', 8, 4);
                    enemyBullets.splice(i, 1); continue;
                }
                let hitAlly = false;
                for (const a of allies) {
                    if (dist(b, a) < b.r + a.r) {
                        a.hp -= (b.damage || 10); a.hitFlash = 8;
                        explode(b.x, b.y, b.color || '#ff44ff', 6, 4);
                        enemyBullets.splice(i, 1); hitAlly = true; break;
                    }
                }
                if (hitAlly) continue;
            }

            for (let i = allies.length - 1; i >= 0; i--) {
                if (allies[i].hp <= 0) {
                    explode(allies[i].x, allies[i].y, '#66ff99', 20, 6);
                    allies.splice(i, 1);
                }
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                for (let j = bullets.length - 1; j >= 0; j--) {
                    const b = bullets[j];
                    if (b.hitList && b.hitList.includes(e)) continue;
                    if (Math.hypot(b.x - e.x, b.y - e.y) < e.r + b.r) {
                        e.hp -= b.damage || 1; e.hitFlash = 5;
                        if (!b.explosive) explode(b.x, b.y, b.color, 8, 5);
                        if (b.pierce || b.rail) {
                            if (!b.hitList) b.hitList = [];
                            b.hitList.push(e);
                        } else bullets.splice(j, 1);
                        if (e.hp <= 0) {
                            explode(e.x, e.y, e.color, 25, 8);
                            for (let k = 0; k < 8; k++) {
                                const a = Math.random() * Math.PI * 2;
                                bloodStains.push({
                                    x: e.x + Math.cos(a) * (10 + Math.random() * 30),
                                    y: e.y + Math.sin(a) * (10 + Math.random() * 30),
                                    r: 3 + Math.random() * 5, alpha: 0.5 + Math.random() * 0.3
                                });
                            }
                            const killValue = { pistol: 15, smg: 20, shotgun: 30, sniper: 40 }[e.type] || 15;
                            score += killValue; killsThisPhase++;
                            const coinAmount = { pistol: 2, smg: 2, shotgun: 4, sniper: 5 }[e.type] || 2;
                            dropCoins(e.x, e.y, coinAmount); dropHealth(e.x, e.y);
                            enemies.splice(i, 1);
                            if (b.explosive) plasmaExplosion(b.x, b.y, 80, b.damage);
                        }
                        if (!(b.pierce || b.rail)) break;
                    }
                }
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                for (let j = allyBullets.length - 1; j >= 0; j--) {
                    const b = allyBullets[j];
                    if (Math.hypot(b.x - e.x, b.y - e.y) < e.r + b.r) {
                        e.hp -= b.damage || 1; e.hitFlash = 5;
                        explode(b.x, b.y, '#88ffbb', 6, 4);
                        allyBullets.splice(j, 1);
                        if (e.hp <= 0) {
                            explode(e.x, e.y, e.color, 25, 8);
                            const killValue = { pistol: 15, smg: 20, shotgun: 30, sniper: 40 }[e.type] || 15;
                            score += Math.floor(killValue * 0.6); killsThisPhase++;
                            const coinAmount = { pistol: 1, smg: 1, shotgun: 2, sniper: 3 }[e.type] || 1;
                            dropCoins(e.x, e.y, coinAmount); dropHealth(e.x, e.y);
                            enemies.splice(i, 1);
                        }
                        break;
                    }
                }
            }

            for (let i = explosions.length - 1; i >= 0; i--) {
                const ex = explosions[i];
                ex.life--;
                ex.radius = ex.maxRadius * (1 - ex.life / ex.maxLife);
                if (ex.life <= 0) explosions.splice(i, 1);
            }

            for (let i = coinDrops.length - 1; i >= 0; i--) {
                const c = coinDrops[i];
                const dd = dist(c, player) || 1;
                const ax = (player.x - c.x) / dd, ay = (player.y - c.y) / dd;
                c.vx += ax * 1.2; c.vy += ay * 1.2;
                const sp = Math.hypot(c.vx, c.vy);
                if (sp > 18) { c.vx = c.vx / sp * 18; c.vy = c.vy / sp * 18; }
                c.x += c.vx; c.y += c.vy;
                c.vx *= 0.92; c.vy *= 0.92;
                c.life--; c.animPhase += 0.1;
                if (dd < player.r + c.r + 4) { coins += c.value; coinDrops.splice(i, 1); continue; }
                if (c.life <= 0) coinDrops.splice(i, 1);
            }

            for (let i = healthDrops.length - 1; i >= 0; i--) {
                const h = healthDrops[i];
                const dd = dist(h, player) || 1;
                const ax = (player.x - h.x) / dd, ay = (player.y - h.y) / dd;
                h.vx += ax * 1.0; h.vy += ay * 1.0;
                const sp = Math.hypot(h.vx, h.vy);
                if (sp > 15) { h.vx = h.vx / sp * 15; h.vy = h.vy / sp * 15; }
                h.x += h.vx; h.y += h.vy;
                h.vx *= 0.92; h.vy *= 0.92;
                h.life--; h.animPhase += 0.08;
                if (dd < player.r + h.r + 4) { healPlayer(h.healAmount); healthDrops.splice(i, 1); continue; }
                if (h.life <= 0) healthDrops.splice(i, 1);
            }

            for (let i = medkits.length - 1; i >= 0; i--) {
                const m = medkits[i];
                m.animPhase += 0.05; m.life--;
                const dd = dist(m, player) || 1;
                if (dd > 100) {
                    const ax = (player.x - m.x) / dd, ay = (player.y - m.y) / dd;
                    m.x += ax * 4; m.y += ay * 4;
                }
                if (dd < player.r + m.r + 4) { healPlayer(m.healAmount); medkits.splice(i, 1); continue; }
                if (m.life <= 0) medkits.splice(i, 1);
            }

            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                const t = floatingTexts[i];
                t.y += t.vy; t.vy *= 0.96; t.life--;
                if (t.life <= 0) floatingTexts.splice(i, 1);
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx; p.y += p.vy;
                p.vx *= 0.94; p.vy *= 0.94;
                p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }
            for (let i = bloodStains.length - 1; i >= 0; i--) {
                bloodStains[i].alpha -= 0.0006;
                if (bloodStains[i].alpha <= 0) bloodStains.splice(i, 1);
            }
            for (let i = casings.length - 1; i >= 0; i--) {
                const c = casings[i];
                c.x += c.vx; c.y += c.vy;
                c.vx *= 0.9; c.vy *= 0.9;
                c.angle += c.spin; c.life--;
                if (c.life <= 0) casings.splice(i, 1);
            }

            if (player.ammo === 0 && !player.reloading) startReload();

            if (phase.objective === 'killCount') {
                if (killsThisPhase >= phase.goal) {
                    gameState = 'waveComplete';
                    waveCompleteTime = 0;
                }
            } else if (phase.objective === 'survive') {
                if (phaseTime / 60 >= phase.goal) {
                    gameState = 'waveComplete';
                    waveCompleteTime = 0;
                }
            }
        }

        /* =========================================================
           LOJA
        ========================================================= */
        function openShop() {
            shopItems = [
                { id: 'damage', name: '+1 DANO', desc: 'Aumenta dano', cost: 40 + upgrades.damage * 20, max: 5, current: upgrades.damage, color: '#ff4444' },
                { id: 'speed', name: '+VELOCIDADE', desc: 'Move mais rápido', cost: 35 + upgrades.speed * 15, max: 5, current: upgrades.speed, color: '#44ddff' },
                { id: 'maxHp', name: '+VIDA MÁX', desc: 'Aumenta HP máximo', cost: 50 + upgrades.maxHp * 25, max: 5, current: upgrades.maxHp, color: '#ff6688' },
                { id: 'reload', name: 'RECARGA+', desc: 'Recarrega mais rápido', cost: 45 + upgrades.reload * 20, max: 3, current: upgrades.reload, color: '#ffcc44' },
                { id: 'ally', name: '+1 ALIADO', desc: 'Aliado extra', cost: 120 + upgrades.extraAlly * 80, max: 3, current: upgrades.extraAlly, color: '#66ff99' },
                { id: 'regen', name: 'REGENERA', desc: 'Recupera vida lentamente', cost: 60 + upgrades.regen * 30, max: 3, current: upgrades.regen, color: '#ff88cc' },
                { id: 'medkit', name: 'SORTE MÉDICA', desc: '+chance de dropar corações', cost: 55 + upgrades.medkitDrop * 30, max: 4, current: upgrades.medkitDrop, color: '#44ff88' },
                { id: 'magnet', name: 'ÍMÃ', desc: 'Atrai moedas e corações', cost: 30 + upgrades.magnet * 20, max: 2, current: upgrades.magnet, color: '#ffdd00' }
            ];
            const cols = 2;
            const itemW = 380, itemH = 95;
            const startX = W / 2 - itemW - 20;
            const startY = 180;
            const gap = 15;
            shopItems.forEach((it, i) => {
                const col = i % cols, row = Math.floor(i / cols);
                it.x = startX + col * (itemW + gap);
                it.y = startY + row * (itemH + gap);
                it.w = itemW; it.h = itemH;
            });
            shopSelection = 0; shopTime = 0;
            gameState = 'shop';
        }

        function buyItem(i) {
            const it = shopItems[i];
            if (it.current >= it.max) return;
            if (coins < it.cost) return;
            coins -= it.cost;
            if (it.id === 'damage') upgrades.damage++;
            else if (it.id === 'speed') { upgrades.speed++; player.speed += 0.5; }
            else if (it.id === 'maxHp') { upgrades.maxHp++; player.maxHp += 25; player.hp += 25; }
            else if (it.id === 'reload') { upgrades.reload++; player.reloadTime = Math.max(20, player.reloadTime - 10); }
            else if (it.id === 'ally') {
                upgrades.extraAlly++;
                const angle = Math.random() * Math.PI * 2;
                let ax = player.x + Math.cos(angle) * 60;
                let ay = player.y + Math.sin(angle) * 60;
                if (circleHitsWalls(ax, ay, 14)) { ax = player.x + 40; ay = player.y + 40; }
                allies.push({
                    x: ax, y: ay, r: 13, speed: 4.6,
                    hp: 30, maxHp: 30, angle: 0,
                    shootCooldown: 30, fireRate: 32, range: 520,
                    dmg: 1 + Math.floor(upgrades.damage / 2), bulletSpeed: 12,
                    target: null, hitFlash: 0,
                    animPhase: Math.random() * Math.PI * 2,
                    strafePhase: Math.random() * Math.PI * 2,
                    walkPhase: Math.random() * Math.PI * 2
                });
            }
            else if (it.id === 'regen') upgrades.regen++;
            else if (it.id === 'medkit') upgrades.medkitDrop++;
            else if (it.id === 'magnet') upgrades.magnet++;
            it.current++;
            it.cost = it.cost + Math.floor(it.cost * 0.5);
        }

        function skipShop() { nextPhase(); }

        /* =========================================================
           DESENHO DO PERSONAGEM
        ========================================================= */
        function drawCharacterShape(shape, r) {
            ctx.beginPath();
            switch (shape) {
                case 'circle': ctx.arc(0, 0, r, 0, Math.PI * 2); break;
                case 'hexagon':
                    for (let i = 0; i < 6; i++) {
                        const a = (i / 6) * Math.PI * 2 + Math.PI / 6;
                        const px = Math.cos(a) * r, py = Math.sin(a) * r;
                        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                    }
                    ctx.closePath(); break;
                case 'arrow':
                    ctx.moveTo(r * 1.3, 0);
                    ctx.lineTo(-r * 0.2, -r * 0.9);
                    ctx.lineTo(-r * 0.6, 0);
                    ctx.lineTo(-r * 0.2, r * 0.9);
                    ctx.closePath(); break;
                case 'diamond':
                    ctx.moveTo(r, 0); ctx.lineTo(0, r); ctx.lineTo(-r, 0); ctx.lineTo(0, -r);
                    ctx.closePath(); break;
                case 'circle_rough':
                    for (let i = 0; i < 16; i++) {
                        const a = (i / 16) * Math.PI * 2;
                        let rr = r;
                        if (i === 2 || i === 3 || i === 9 || i === 10) rr = r * 0.9;
                        if (i === 6 || i === 13) rr = r * 1.05;
                        const px = Math.cos(a) * rr, py = Math.sin(a) * rr;
                        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                    }
                    ctx.closePath(); break;
                case 'square':
                    ctx.moveTo(r, -r * 0.5); ctx.lineTo(r * 0.5, r); ctx.lineTo(-r, r * 0.5); ctx.lineTo(-r * 0.5, -r);
                    ctx.closePath(); break;
                case 'octagon':
                    for (let i = 0; i < 8; i++) {
                        const a = (i / 8) * Math.PI * 2 + Math.PI / 8;
                        const px = Math.cos(a) * r, py = Math.sin(a) * r;
                        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                    }
                    ctx.closePath(); break;
                case 'robot':
                    ctx.moveTo(r, -r * 0.6); ctx.lineTo(r * 0.5, -r); ctx.lineTo(-r * 0.6, -r * 0.8);
                    ctx.lineTo(-r * 0.9, -r * 0.3); ctx.lineTo(-r * 0.9, r * 0.3); ctx.lineTo(-r * 0.6, r * 0.8);
                    ctx.lineTo(r * 0.5, r); ctx.lineTo(r, r * 0.6); ctx.closePath(); break;
                case 'ghost':
                    ctx.moveTo(0, -r);
                    ctx.bezierCurveTo(r * 1.2, -r, r * 1.1, r * 0.3, r * 0.8, r * 0.6);
                    ctx.quadraticCurveTo(r * 0.5, r * 1.1, r * 0.2, r * 0.7);
                    ctx.quadraticCurveTo(0, r * 1.1, -r * 0.2, r * 0.7);
                    ctx.quadraticCurveTo(-r * 0.5, r * 1.1, -r * 0.8, r * 0.6);
                    ctx.bezierCurveTo(-r * 1.1, r * 0.3, -r * 1.2, -r, 0, -r);
                    ctx.closePath(); break;
                case 'star':
                    for (let i = 0; i < 10; i++) {
                        const a = (i / 10) * Math.PI * 2 - Math.PI / 2;
                        const rr = i % 2 === 0 ? r * 1.15 : r * 0.55;
                        const px = Math.cos(a) * rr, py = Math.sin(a) * rr;
                        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                    }
                    ctx.closePath(); break;
                default: ctx.arc(0, 0, r, 0, Math.PI * 2);
            }
        }

        function drawVisor(visor, r) {
            ctx.save();
            switch (visor.type) {
                case 'line':
                    ctx.fillStyle = visor.color;
                    ctx.shadowBlur = 10; ctx.shadowColor = visor.color;
                    ctx.fillRect(-r * 0.5, -r * 0.1, r * 0.9, r * 0.2);
                    ctx.shadowBlur = 0; break;
                case 'goggles':
                    ctx.fillStyle = visor.color;
                    ctx.shadowBlur = 12; ctx.shadowColor = visor.color;
                    ctx.beginPath(); ctx.arc(-r * 0.2, 0, r * 0.2, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(r * 0.25, 0, r * 0.2, 0, Math.PI * 2); ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.fillRect(-r * 0.2, -r * 0.08, r * 0.45, r * 0.16); break;
                case 'scope':
                    ctx.strokeStyle = visor.color;
                    ctx.lineWidth = 2;
                    ctx.shadowBlur = 10; ctx.shadowColor = visor.color;
                    ctx.beginPath(); ctx.arc(r * 0.15, 0, r * 0.35, 0, Math.PI * 2); ctx.stroke();
                    ctx.shadowBlur = 0; break;
                case 'v_shape':
                    ctx.strokeStyle = visor.color;
                    ctx.lineWidth = 3;
                    ctx.shadowBlur = 15; ctx.shadowColor = visor.color;
                    ctx.beginPath(); ctx.moveTo(-r * 0.5, -r * 0.2); ctx.lineTo(0, r * 0.15); ctx.lineTo(r * 0.5, -r * 0.2); ctx.stroke();
                    ctx.shadowBlur = 0; break;
                case 'cracked':
                    ctx.strokeStyle = visor.color;
                    ctx.lineWidth = 2;
                    ctx.shadowBlur = 8; ctx.shadowColor = visor.color;
                    ctx.beginPath();
                    ctx.moveTo(-r * 0.5, 0); ctx.lineTo(-r * 0.1, -r * 0.15);
                    ctx.lineTo(r * 0.1, r * 0.1); ctx.lineTo(r * 0.5, 0);
                    ctx.stroke();
                    ctx.shadowBlur = 0; break;
                case 'matrix':
                    ctx.fillStyle = visor.color;
                    ctx.shadowBlur = 12; ctx.shadowColor = visor.color;
                    for (let i = 0; i < 6; i++) {
                        ctx.fillRect(-r * 0.4 + i * r * 0.16, -r * 0.15, 3, r * 0.3);
                    }
                    ctx.shadowBlur = 0; break;
                case 'heavy_mask':
                    ctx.fillStyle = visor.color;
                    ctx.shadowBlur = 10; ctx.shadowColor = visor.color;
                    ctx.fillRect(-r * 0.6, -r * 0.25, r * 1.2, r * 0.5);
                    ctx.fillStyle = '#000';
                    ctx.fillRect(-r * 0.5, -r * 0.05, r * 0.35, r * 0.1);
                    ctx.fillRect(r * 0.15, -r * 0.05, r * 0.35, r * 0.1);
                    ctx.shadowBlur = 0; break;
                case 'led_eye':
                    ctx.fillStyle = '#000';
                    ctx.beginPath(); ctx.arc(0, 0, r * 0.35, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = visor.color;
                    ctx.shadowBlur = 15; ctx.shadowColor = visor.color;
                    ctx.beginPath(); ctx.arc(0, 0, r * 0.15, 0, Math.PI * 2); ctx.fill();
                    ctx.shadowBlur = 0; break;
                case 'void':
                    ctx.fillStyle = '#000';
                    ctx.beginPath(); ctx.arc(0, 0, r * 0.4, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = visor.color;
                    ctx.shadowBlur = 8; ctx.shadowColor = visor.color;
                    ctx.beginPath(); ctx.arc(-r * 0.15, -r * 0.1, r * 0.05, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(r * 0.15, r * 0.1, r * 0.05, 0, Math.PI * 2); ctx.fill();
                    ctx.shadowBlur = 0; break;
                case 'flame':
                    ctx.fillStyle = visor.color;
                    ctx.shadowBlur = 15; ctx.shadowColor = visor.color;
                    ctx.beginPath(); ctx.arc(0, 0, r * 0.4, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.beginPath(); ctx.arc(0, 0, r * 0.2, 0, Math.PI * 2); ctx.fill();
                    ctx.shadowBlur = 0; break;
            }
            ctx.restore();
        }

        /* =========================================================
           DRAW
        ========================================================= */
        function draw() {
            timeAccumulator += 0.016;
            pauseTime++;
            waveCompleteTime++;

            if (gameState === 'menu') { drawMenu(); return; }
            if (gameState === 'records') { drawRecordsScreen(); return; }
            if (gameState === 'skins') { drawSkinsScreen(); return; }
            if (gameState === 'shop') { drawShop(); return; }
            if (gameState === 'paused') { drawPaused(); return; }

            ctx.save();
            if (shakeTime > 0) {
                ctx.translate((Math.random() - 0.5) * shakeAmount, (Math.random() - 0.5) * shakeAmount);
            }

            drawFloor();
            const theme = getTheme();

            const ambientGrad = ctx.createRadialGradient(W / 2, H / 2, 100, W / 2, H / 2, W * 0.7);
            ambientGrad.addColorStop(0, theme.ambient);
            ambientGrad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = ambientGrad;
            ctx.fillRect(0, 0, W, H);

            decals.forEach(d => {
                ctx.globalAlpha = d.alpha;
                ctx.fillStyle = d.color;
                ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); ctx.fill();
            });
            ctx.globalAlpha = 1;

            bloodStains.forEach(b => {
                ctx.globalAlpha = b.alpha;
                ctx.fillStyle = '#6a0000';
                ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
            });
            ctx.globalAlpha = 1;

            casings.forEach(c => {
                ctx.save();
                ctx.translate(c.x, c.y);
                ctx.rotate(c.angle);
                ctx.globalAlpha = Math.min(1, c.life / 20);
                ctx.fillStyle = '#d4a832';
                ctx.fillRect(-2, -1, 4, 2);
                ctx.restore();
            });
            ctx.globalAlpha = 1;

            drawWalls();

            explosions.forEach(ex => {
                const a = ex.life / ex.maxLife;
                const grad = ctx.createRadialGradient(ex.x, ex.y, 0, ex.x, ex.y, ex.radius);
                grad.addColorStop(0, `rgba(180,100,255,${a * 0.6})`);
                grad.addColorStop(1, 'rgba(100,0,255,0)');
                ctx.fillStyle = grad;
                ctx.beginPath(); ctx.arc(ex.x, ex.y, ex.radius, 0, Math.PI * 2); ctx.fill();
            });

            medkits.forEach(m => {
                ctx.fillStyle = '#0a3a1a';
                ctx.fillRect(m.x - m.r, m.y - m.r * 0.8, m.r * 2, m.r * 1.6);
                ctx.strokeStyle = '#44ff88';
                ctx.lineWidth = 2;
                ctx.strokeRect(m.x - m.r, m.y - m.r * 0.8, m.r * 2, m.r * 1.6);
                ctx.fillStyle = '#fff';
                ctx.fillRect(m.x - 2, m.y - 7, 4, 14);
                ctx.fillRect(m.x - 7, m.y - 2, 14, 4);
            });

            healthDrops.forEach(h => {
                const bob = Math.sin(h.animPhase * 0.8) * 2;
                ctx.save();
                ctx.translate(h.x, h.y + bob);
                ctx.fillStyle = '#ff3366';
                ctx.beginPath();
                const s = h.r;
                ctx.moveTo(0, s * 0.3);
                ctx.bezierCurveTo(-s * 1.2, -s * 0.6, -s * 0.5, -s * 1.2, 0, -s * 0.5);
                ctx.bezierCurveTo(s * 0.5, -s * 1.2, s * 1.2, -s * 0.6, 0, s * 0.3);
                ctx.closePath(); ctx.fill();
                ctx.restore();
            });

            coinDrops.forEach(c => {
                ctx.fillStyle = '#ffee88';
                ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2); ctx.fill();
            });

            particles.forEach(p => {
                const a = Math.max(0, p.life / p.maxLife);
                ctx.globalAlpha = a;
                if (p.glow) { ctx.shadowBlur = 12; ctx.shadowColor = p.color; }
                ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
                ctx.shadowBlur = 0;
            });
            ctx.globalAlpha = 1;

            bullets.forEach(b => {
                ctx.fillStyle = b.color;
                ctx.shadowBlur = 20; ctx.shadowColor = b.glow;
                ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
                ctx.shadowBlur = 0;
            });

            allyBullets.forEach(b => {
                ctx.fillStyle = b.color;
                ctx.shadowBlur = 14; ctx.shadowColor = b.glow;
                ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
                ctx.shadowBlur = 0;
            });

            enemyBullets.forEach(b => {
                ctx.fillStyle = b.color;
                ctx.shadowBlur = 15; ctx.shadowColor = b.glow || b.color;
                ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
                ctx.shadowBlur = 0;
            });

            enemies.forEach(e => drawEnemy(e));
            allies.forEach(a => drawAlly(a));
            drawPlayer();

            floatingTexts.forEach(t => {
                const alpha = Math.min(1, t.life / 20);
                ctx.globalAlpha = alpha;
                ctx.fillStyle = t.color;
                ctx.font = 'bold 20px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(t.text, t.x, t.y);
                ctx.globalAlpha = 1;
            });

            drawLighting();
            drawCrosshair();
            ctx.restore();

            drawScreenFX();
            drawHUD();
            drawOverlays();
            drawPauseButton();
        }

        function drawFloor() { ctx.drawImage(floorCanvas, 0, 0); }

        function drawWalls() {
            const theme = getTheme();
            walls.forEach(w => {
                const isPillar = w.type === 'pillar';
                const isBorder = w.type === 'border';

                let playerBehind = false;
                if (!isBorder) {
                    const overlap = 24;
                    if (player.x + player.r + overlap > w.x &&
                        player.x - player.r - overlap < w.x + w.w &&
                        player.y + player.r + overlap > w.y &&
                        player.y - player.r - overlap < w.y + w.h) playerBehind = true;
                }
                const alpha = playerBehind ? 0.35 : 1;
                ctx.save();
                ctx.globalAlpha = alpha;

                ctx.fillStyle = 'rgba(0,0,0,0.55)';
                ctx.fillRect(w.x + 5, w.y + 5, w.w, w.h);

                if (isBorder) ctx.fillStyle = theme.border;
                else if (isPillar) ctx.fillStyle = theme.pillarSide;
                else ctx.fillStyle = theme.wallSide;
                ctx.fillRect(w.x, w.y, w.w, w.h);

                const bodyGrad = ctx.createLinearGradient(w.x, w.y, w.x, w.y + w.h);
                bodyGrad.addColorStop(0, 'rgba(255,255,255,0.15)');
                bodyGrad.addColorStop(1, 'rgba(0,0,0,0.3)');
                ctx.fillStyle = bodyGrad;
                ctx.fillRect(w.x, w.y, w.w, w.h);

                ctx.fillStyle = isBorder ? theme.borderTop : isPillar ? theme.pillarTop : theme.wallTop;
                ctx.fillRect(w.x, w.y, w.w, 8);
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.fillRect(w.x, w.y, w.w, 2);

                if (!isBorder) {
                    ctx.strokeStyle = isPillar ? theme.pillarEdge : theme.wallEdge;
                    ctx.lineWidth = 2;
                    ctx.shadowBlur = 12; ctx.shadowColor = theme.accent;
                    ctx.strokeRect(w.x + 1, w.y + 1, w.w - 2, w.h - 2);
                    ctx.shadowBlur = 0;
                }
                ctx.restore();
            });

            if (player.x >= 0) {
                const skin = getCurrentSkin();
                ctx.save();
                ctx.globalAlpha = 0.9;
                ctx.strokeStyle = skin.colors.accent;
                ctx.lineWidth = 2.5;
                ctx.shadowBlur = 15; ctx.shadowColor = skin.colors.accent;
                ctx.beginPath(); ctx.arc(player.x, player.y, player.r + 3, 0, Math.PI * 2); ctx.stroke();
                ctx.shadowBlur = 0;
                ctx.restore();
            }
        }

        function drawEnemy(e) {
            ctx.save();
            ctx.translate(e.x, e.y);
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.beginPath(); ctx.ellipse(3, 5, e.r + 3, e.r * 0.7, 0, 0, Math.PI * 2); ctx.fill();

            ctx.strokeStyle = e.glow;
            ctx.lineWidth = 2;
            ctx.shadowBlur = 20; ctx.shadowColor = e.glow;
            ctx.beginPath(); ctx.arc(0, 0, e.r + 4, 0, Math.PI * 2); ctx.stroke();
            ctx.shadowBlur = 0;

            ctx.rotate(e.angle);
            ctx.shadowBlur = e.hitFlash > 0 ? 25 : 15;
            ctx.shadowColor = e.glow;
            ctx.fillStyle = e.hitFlash > 0 ? '#fff' : e.color;
            ctx.beginPath();
            if (e.type === 'shotgun') {
                for (let k = 0; k < 6; k++) {
                    const a = (k / 6) * Math.PI * 2 + Math.PI / 6;
                    const px = Math.cos(a) * e.r, py = Math.sin(a) * e.r;
                    if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                }
                ctx.closePath(); ctx.fill();
            } else if (e.type === 'sniper') {
                ctx.moveTo(e.r, 0); ctx.lineTo(0, e.r); ctx.lineTo(-e.r, 0); ctx.lineTo(0, -e.r);
                ctx.closePath(); ctx.fill();
            } else {
                ctx.arc(0, 0, e.r, 0, Math.PI * 2); ctx.fill();
            }
            ctx.shadowBlur = 0;

            ctx.fillStyle = '#000';
            ctx.beginPath(); ctx.arc(0, 0, e.r * 0.4, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#ff2200';
            ctx.beginPath(); ctx.arc(e.r * 0.15, 0, e.r * 0.18, 0, Math.PI * 2); ctx.fill();

            ctx.restore();
        }

        function drawAlly(a) {
            ctx.save();
            ctx.translate(a.x, a.y);
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.beginPath(); ctx.ellipse(3, 4, a.r + 3, a.r * 0.7, 0, 0, Math.PI * 2); ctx.fill();

            ctx.strokeStyle = '#00ff88';
            ctx.lineWidth = 2;
            ctx.shadowBlur = 18; ctx.shadowColor = '#00ff88';
            ctx.beginPath(); ctx.arc(0, 0, a.r + 3, 0, Math.PI * 2); ctx.stroke();
            ctx.shadowBlur = 0;

            ctx.rotate(a.angle);
            ctx.fillStyle = a.hitFlash > 0 ? '#fff' : '#66ff99';
            ctx.beginPath(); ctx.arc(0, 0, a.r, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = '#0a3a1a';
            ctx.beginPath(); ctx.arc(0, 0, a.r * 0.4, 0, Math.PI * 2); ctx.fill();

            ctx.restore();

            const w = a.r * 2;
            ctx.fillStyle = 'rgba(0,0,0,0.75)';
            ctx.fillRect(a.x - a.r, a.y - a.r - 14, w, 5);
            ctx.fillStyle = '#00ff88';
            ctx.fillRect(a.x - a.r, a.y - a.r - 14, w * (a.hp / a.maxHp), 5);
        }

        function drawPlayer() {
            const px = player.x, py = player.y;
            const r = player.r;
            const wp = getWeapon();
            const rec = player.recoil;
            const walkBob = Math.sin(player.walkPhase) * 1.5;
            const skin = getCurrentSkin();
            const colors = skin.colors;

            if (healFlash > 0) {
                const a = healFlash / 20;
                const healGrad = ctx.createRadialGradient(px, py, r * 0.5, px, py, r + 45);
                healGrad.addColorStop(0, `rgba(68,255,136,${a * 0.6})`);
                healGrad.addColorStop(1, 'rgba(68,255,136,0)');
                ctx.fillStyle = healGrad;
                ctx.beginPath(); ctx.arc(px, py, r + 45, 0, Math.PI * 2); ctx.fill();
            }

            ctx.fillStyle = 'rgba(0,0,0,0.55)';
            ctx.beginPath();
            ctx.ellipse(px + 5, py + 6, r + 6, r * 0.75, 0, 0, Math.PI * 2);
            ctx.fill();

            const auraGrad = ctx.createRadialGradient(px, py, r * 0.5, px, py, r + 25);
            auraGrad.addColorStop(0, `${colors.accent}66`);
            auraGrad.addColorStop(1, `${colors.accent}00`);
            ctx.fillStyle = auraGrad;
            ctx.beginPath(); ctx.arc(px, py, r + 25, 0, Math.PI * 2); ctx.fill();

            ctx.save();
            ctx.translate(px, py);

            if (playerInvuln > 0 && Math.floor(playerInvuln / 4) % 2 === 0) ctx.globalAlpha = 0.45;

            if (playerInvuln > 0) {
                ctx.strokeStyle = `${colors.accent}99`;
                ctx.lineWidth = 2.5;
                ctx.beginPath(); ctx.arc(0, 0, r + 6, 0, Math.PI * 2); ctx.stroke();
            }

            ctx.rotate(player.angle);

            // ARMA
            ctx.save();
            ctx.translate(-rec * 0.8, walkBob * 0.3);
            if (wp.name === 'ESCOPETA') {
                ctx.fillStyle = '#1a1a1a'; ctx.fillRect(r - 2, -6, 30, 5); ctx.fillRect(r - 2, 1, 30, 5);
                ctx.fillStyle = wp.color; ctx.shadowBlur = 12; ctx.shadowColor = wp.glow;
                ctx.fillRect(r + 26, -5, 4, 3); ctx.fillRect(r + 26, 2, 4, 3);
                ctx.shadowBlur = 0;
            } else if (wp.name === 'RIFLE' || wp.name === 'RAILGUN') {
                ctx.fillStyle = '#1a1a1a'; ctx.fillRect(r - 2, -4, 34, 8);
                ctx.fillStyle = wp.color; ctx.shadowBlur = 15; ctx.shadowColor = wp.glow;
                ctx.beginPath(); ctx.arc(r + 34, 0, 3, 0, Math.PI * 2); ctx.fill();
                ctx.shadowBlur = 0;
            } else if (wp.name === 'LASER' || wp.name === 'PLASMA') {
                ctx.fillStyle = '#1a1a1a'; ctx.fillRect(r - 2, -5, 28, 10);
                ctx.fillStyle = wp.color; ctx.shadowBlur = 25; ctx.shadowColor = wp.glow;
                ctx.beginPath(); ctx.arc(r + 18, 0, 6, 0, Math.PI * 2); ctx.fill();
                ctx.shadowBlur = 0;
            } else if (wp.name === 'SMG' || wp.name === 'MINIGUN') {
                ctx.fillStyle = '#1a1a1a'; ctx.fillRect(r - 2, -4, wp.name === 'MINIGUN' ? 32 : 24, 8);
                ctx.fillStyle = wp.color; ctx.shadowBlur = 12; ctx.shadowColor = wp.glow;
                ctx.fillRect(r + (wp.name === 'MINIGUN' ? 28 : 20), -3, 6, 6);
                ctx.shadowBlur = 0;
            } else if (wp.name === 'DUAL PISTOLS') {
                ctx.fillStyle = '#1a1a1a'; ctx.fillRect(r - 2, -10, 22, 6); ctx.fillRect(r - 2, 4, 22, 6);
                ctx.fillStyle = wp.color; ctx.shadowBlur = 12; ctx.shadowColor = wp.glow;
                ctx.fillRect(r + 18, -9, 6, 4); ctx.fillRect(r + 18, 5, 6, 4);
                ctx.shadowBlur = 0;
            } else if (wp.name === 'CANHÃO') {
                ctx.fillStyle = '#1a1a1a'; ctx.fillRect(r - 4, -9, 34, 18);
                ctx.fillStyle = wp.color; ctx.shadowBlur = 18; ctx.shadowColor = wp.glow;
                ctx.beginPath(); ctx.arc(r + 34, 0, 4, 0, Math.PI * 2); ctx.fill();
                ctx.shadowBlur = 0;
            } else {
                ctx.fillStyle = '#1a1a1a'; ctx.fillRect(r - 2, -4, 22, 8);
                ctx.fillStyle = wp.color; ctx.shadowBlur = 10; ctx.shadowColor = wp.glow;
                ctx.fillRect(r + 22, -2, 4, 4);
                ctx.shadowBlur = 0;
            }
            ctx.restore();

            // Braços
            ctx.fillStyle = colors.dark;
            ctx.beginPath(); ctx.arc(r * 0.5, 5, 5, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 1.5; ctx.stroke();
            ctx.fillStyle = colors.dark;
            ctx.beginPath(); ctx.arc(r * 0.5, -5, 5, 0, Math.PI * 2); ctx.fill();
            ctx.stroke();

            // Corpo com shape da skin
            const bodyGrad = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
            bodyGrad.addColorStop(0, colors.light);
            bodyGrad.addColorStop(0.5, colors.mid);
            bodyGrad.addColorStop(1, colors.dark);

            ctx.shadowBlur = 22;
            ctx.shadowColor = colors.accent;
            ctx.fillStyle = bodyGrad;
            drawCharacterShape(skin.shape, r);
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.strokeStyle = colors.dark;
            ctx.lineWidth = 2;
            drawCharacterShape(skin.shape, r);
            ctx.stroke();

            // Visor
            drawVisor(skin.visor, r);

            // Detalhes
            skin.details.forEach(detail => {
                ctx.save();
                switch (detail) {
                    case 'helmet_strap':
                        ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = 2;
