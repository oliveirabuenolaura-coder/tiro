                        ctx.beginPath(); ctx.moveTo(-r * 0.6, -r * 0.6); ctx.lineTo(r * 0.6, r * 0.6); ctx.stroke();
                        break;
                    case 'shoulder_pads':
                        ctx.fillStyle = colors.dark;
                        ctx.beginPath(); ctx.arc(-r * 0.7, -r * 0.5, r * 0.25, 0, Math.PI * 2); ctx.fill();
                        ctx.beginPath(); ctx.arc(r * 0.7, -r * 0.5, r * 0.25, 0, Math.PI * 2); ctx.fill();
                        break;
                    case 'camo_spots':
                        ctx.fillStyle = 'rgba(0,0,0,0.3)';
                        ctx.beginPath(); ctx.arc(-r * 0.4, r * 0.3, r * 0.15, 0, Math.PI * 2); ctx.fill();
                        ctx.beginPath(); ctx.arc(r * 0.3, -r * 0.4, r * 0.12, 0, Math.PI * 2); ctx.fill();
                        break;
                    case 'bandolier':
                        ctx.fillStyle = '#553311';
                        ctx.fillRect(-r * 0.8, -r * 0.15, r * 1.6, r * 0.3);
                        ctx.fillStyle = '#ffcc44';
                        for (let i = 0; i < 4; i++) ctx.fillRect(-r * 0.6 + i * r * 0.35, -r * 0.1, r * 0.1, r * 0.2);
                        break;
                    case 'crown_marks':
                        ctx.fillStyle = colors.light;
                        ctx.beginPath();
                        ctx.moveTo(-r * 0.4, -r * 0.85); ctx.lineTo(-r * 0.2, -r * 1.05);
                        ctx.lineTo(0, -r * 0.85); ctx.lineTo(r * 0.2, -r * 1.05);
                        ctx.lineTo(r * 0.4, -r * 0.85); ctx.lineTo(r * 0.3, -r * 0.7);
                        ctx.lineTo(-r * 0.3, -r * 0.7); ctx.closePath(); ctx.fill();
                        break;
                    case 'cape_edges':
                        ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 3;
                        ctx.beginPath(); ctx.arc(0, 0, r * 1.15, Math.PI * 0.6, Math.PI * 1.4); ctx.stroke();
                        break;
                    case 'scratches':
                        ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(-r * 0.5, -r * 0.3); ctx.lineTo(-r * 0.2, -r * 0.5);
                        ctx.moveTo(r * 0.3, r * 0.2); ctx.lineTo(r * 0.6, r * 0.4); ctx.stroke();
                        break;
                    case 'bandage':
                        ctx.strokeStyle = '#eeeecc'; ctx.lineWidth = 4;
                        ctx.beginPath();
                        ctx.moveTo(-r * 0.7, -r * 0.3); ctx.lineTo(r * 0.7, r * 0.3);
                        ctx.moveTo(-r * 0.7, r * 0.3); ctx.lineTo(r * 0.7, -r * 0.3); ctx.stroke();
                        break;
                    case 'circuit_lines':
                        ctx.strokeStyle = colors.core1; ctx.lineWidth = 1.5;
                        ctx.shadowBlur = 8; ctx.shadowColor = colors.core1;
                        ctx.beginPath();
                        ctx.moveTo(-r * 0.6, 0); ctx.lineTo(-r * 0.3, 0); ctx.lineTo(-r * 0.3, -r * 0.4);
                        ctx.moveTo(r * 0.6, 0); ctx.lineTo(r * 0.3, 0); ctx.lineTo(r * 0.3, r * 0.4);
                        ctx.stroke();
                        ctx.shadowBlur = 0;
                        break;
                    case 'antenna':
                        ctx.strokeStyle = colors.core1; ctx.lineWidth = 2;
                        ctx.beginPath(); ctx.moveTo(0, -r); ctx.lineTo(0, -r * 1.4); ctx.stroke();
                        ctx.fillStyle = colors.core1;
                        ctx.shadowBlur = 12; ctx.shadowColor = colors.core1;
                        ctx.beginPath(); ctx.arc(0, -r * 1.5, r * 0.15, 0, Math.PI * 2); ctx.fill();
                        ctx.shadowBlur = 0;
                        break;
                    case 'armor_plates':
                        ctx.fillStyle = 'rgba(0,0,0,0.4)';
                        ctx.fillRect(-r * 0.7, -r * 0.5, r * 1.4, r * 0.25);
                        ctx.fillRect(-r * 0.7, r * 0.3, r * 1.4, r * 0.25);
                        break;
                    case 'rivets':
                        ctx.fillStyle = colors.light;
                        for (let i = 0; i < 6; i++) {
                            const a = (i / 6) * Math.PI * 2;
                            ctx.beginPath();
                            ctx.arc(Math.cos(a) * r * 0.7, Math.sin(a) * r * 0.7, 2, 0, Math.PI * 2);
                            ctx.fill();
                        }
                        break;
                    case 'bolts':
                        ctx.fillStyle = '#333';
                        for (let i = 0; i < 4; i++) {
                            const a = (i / 4) * Math.PI * 2 + Math.PI / 4;
                            ctx.beginPath();
                            ctx.arc(Math.cos(a) * r * 0.6, Math.sin(a) * r * 0.6, 2.5, 0, Math.PI * 2);
                            ctx.fill();
                        }
                        break;
                    case 'panel_lines':
                        ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(-r * 0.8, -r * 0.2); ctx.lineTo(r * 0.8, -r * 0.2);
                        ctx.moveTo(-r * 0.8, r * 0.2); ctx.lineTo(r * 0.8, r * 0.2);
                        ctx.stroke();
                        break;
                    case 'wispy_trail':
                        ctx.strokeStyle = `${colors.light}66`; ctx.lineWidth = 2;
                        ctx.setLineDash([3, 5]);
                        ctx.beginPath(); ctx.arc(0, 0, r * 1.3, 0, Math.PI * 2); ctx.stroke();
                        ctx.setLineDash([]);
                        break;
                    case 'spikes':
                        ctx.fillStyle = colors.core1;
                        ctx.shadowBlur = 8; ctx.shadowColor = colors.core1;
                        for (let i = 0; i < 8; i++) {
                            const a = (i / 8) * Math.PI * 2;
                            ctx.beginPath();
                            ctx.arc(Math.cos(a) * r * 1.2, Math.sin(a) * r * 1.2, 3, 0, Math.PI * 2);
                            ctx.fill();
                        }
                        ctx.shadowBlur = 0;
                        break;
                    case 'glow_orbs':
                        for (let i = 0; i < 4; i++) {
                            const a = (i / 4) * Math.PI * 2 + Math.PI / 4;
                            ctx.fillStyle = colors.core1;
                            ctx.shadowBlur = 10; ctx.shadowColor = colors.core1;
                            ctx.beginPath();
                            ctx.arc(Math.cos(a) * r * 0.9, Math.sin(a) * r * 0.9, 2, 0, Math.PI * 2);
                            ctx.fill();
                        }
                        ctx.shadowBlur = 0;
                        break;
                }
                ctx.restore();
            });

            if (muzzleFlash > 0) {
                const flashDist = r + 30;
                const size = 12 + (muzzleFlash * 2.5);
                const grad = ctx.createRadialGradient(flashDist, 0, 0, flashDist, 0, size);
                grad.addColorStop(0, 'rgba(255,255,220,0.98)');
                grad.addColorStop(0.3, wp.color);
                grad.addColorStop(0.7, 'rgba(255,150,0,0.5)');
                grad.addColorStop(1, 'rgba(255,100,0,0)');
                ctx.fillStyle = grad;
                ctx.beginPath(); ctx.arc(flashDist, 0, size, 0, Math.PI * 2); ctx.fill();
            }

            ctx.restore();
            ctx.globalAlpha = 1;
        }

        function drawLighting() {
            lctx.globalCompositeOperation = 'source-over';
            lctx.fillStyle = `rgba(0,0,0,${DARKNESS})`;
            lctx.fillRect(0, 0, W, H);
            lctx.globalCompositeOperation = 'destination-out';

            const pl = lctx.createRadialGradient(player.x, player.y, 30, player.x, player.y, PLAYER_LIGHT_R);
            pl.addColorStop(0, 'rgba(0,0,0,1)');
            pl.addColorStop(1, 'rgba(0,0,0,0)');
            lctx.fillStyle = pl;
            lctx.beginPath(); lctx.arc(player.x, player.y, PLAYER_LIGHT_R, 0, Math.PI * 2); lctx.fill();

            ctx.drawImage(lightCanvas, 0, 0);
        }

        function drawCrosshair() {
            const mx = mouse.x, my = mouse.y;
            ctx.save();
            ctx.translate(mx, my);
            ctx.strokeStyle = '#ff3333';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(0, 0, 11, 0, Math.PI * 2); ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(-18, 0); ctx.lineTo(-6, 0);
            ctx.moveTo(6, 0); ctx.lineTo(18, 0);
            ctx.moveTo(0, -18); ctx.lineTo(0, -6);
            ctx.moveTo(0, 6); ctx.lineTo(0, 18);
            ctx.stroke();
            ctx.restore();
        }

        function drawScreenFX() {
            const vig = ctx.createRadialGradient(W / 2, H / 2, H * 0.4, W / 2, H / 2, H * 0.95);
            vig.addColorStop(0, 'rgba(0,0,0,0)');
            vig.addColorStop(1, 'rgba(0,0,0,0.5)');
            ctx.fillStyle = vig;
            ctx.fillRect(0, 0, W, H);
        }

        function drawHUD() {
            const phase = PHASES[currentPhase];
            const wp = getWeapon();
            const theme = getTheme();

            const barW = 260, barH = 22;

        function drawSkinsScreen() {
            skinsTime++;

            const bgGrad = ctx.createLinearGradient(0, 0, W, H);

            const cols = 5;

            const gapX = 20, gapY = 40;

            const startX = W / 2 - gridW / 2;
            const startY = 165;

            for (let i = 0; i < SKINS.length; i++) {
                const skin = SKINS[i];
                const col = i % cols, row = Math.floor(i / cols);
                const cx = startX + col * (cardW + gapX);
                const cy = startY + row * (cardH + gapY);

                const unlocked = isSkinUnlocked(skin);
                const selected = selectedSkin === i;
                const hovered = mouse.x >= cx && mouse.x <= cx + cardW && mouse.y >= cy && mouse.y <= cy + cardH;
                const isActive = selected || hovered || skinsSelection === i;

                if (unlocked) {
                    if (isActive) { ctx.shadowBlur = 25; ctx.shadowColor = skin.colors.accent; }
                    ctx.fillStyle = isActive ? `${skin.colors.accent}33` : 'rgba(30,20,40,0.8)';
                    ctx.fillRect(cx, cy, cardW, cardH);
                    ctx.shadowBlur = 0;

                    ctx.strokeStyle = selected ? '#ffffff' : (isActive ? skin.colors.accent : `${skin.colors.accent}88`);
                    ctx.lineWidth = selected ? 4 : (isActive ? 3 : 2);

                    drawFullSkinPreview(cx + cardW / 2, cy + 60, 22, skin);

                    ctx.fillStyle = isActive ? '#fff' : '#aaa';
                    ctx.font = 'bold 12px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(skin.name, cx + cardW / 2, cy + 105);

                    if (selected) {
                        ctx.fillStyle = '#00ff88';
                        ctx.font = 'bold 10px Arial';
                        ctx.fillText('✓ SELECIONADA', cx + cardW / 2, cy + 120);
                    } else {
                        ctx.fillStyle = '#666';
                        ctx.font = '10px Arial';
                        ctx.fillText(skin.desc, cx + cardW / 2, cy + 120);
                    }
                } else {
                    ctx.fillStyle = 'rgba(20,20,20,0.85)';
                    ctx.fillRect(cx, cy, cardW, cardH);
                    ctx.strokeStyle = isActive ? '#ff4444' : 'rgba(80,80,80,0.6)';
                    ctx.lineWidth = isActive ? 3 : 1.5;
                    ctx.strokeRect(cx, cy, cardW, cardH);

                    ctx.fillStyle = 'rgba(120,120,120,0.5)';
                    ctx.font = '40px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('🔒', cx + cardW / 2, cy + 65);

                    ctx.fillStyle = '#666';
                    ctx.font = 'bold 12px Arial';
                    ctx.fillText('???', cx + cardW / 2, cy + 95);

                    ctx.fillStyle = '#ff5555';
                    ctx.font = 'bold 11px Arial';
                    ctx.fillText('FASE ' + skin.unlockPhase, cx + cardW / 2, cy + 115);
                }
            }

            const btn = BUTTONS.skins[0];
            const hoverBack = mouseOverButton(btn);

            ctx.fillStyle = hoverBack ? 'rgba(255,100,200,0.35)' : 'rgba(40,20,40,0.85)';
            ctx.fillRect(btn.x, btn.y, btn.w, btn.h);
            ctx.strokeStyle = hoverBack ? '#ff66cc' : '#664455';
            ctx.lineWidth = hoverBack ? 4 : 2;
            ctx.strokeRect(btn.x, btn.y, btn.w, btn.h);

            ctx.fillStyle = hoverBack ? '#ffaaee' : '#cc88bb';
            ctx.font = 'bold 22px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('← VOLTAR', btn.x + btn.w / 2, btn.y + btn.h / 2 + 1);
            ctx.textBaseline = 'alphabetic';

        function drawFullSkinPreview(px, py, r, skin) {
            ctx.save();
            ctx.translate(px, py);

            const auraGrad = ctx.createRadialGradient(0, 0, r * 0.5, 0, 0, r + 15);
            auraGrad.addColorStop(0, `${skin.colors.accent}66`);
            auraGrad.addColorStop(1, `${skin.colors.accent}00`);
            ctx.fillStyle = auraGrad;
            ctx.beginPath(); ctx.arc(0, 0, r + 15, 0, Math.PI * 2); ctx.fill();

            const bodyGrad = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
            bodyGrad.addColorStop(0, skin.colors.light);
            bodyGrad.addColorStop(0.5, skin.colors.mid);
            bodyGrad.addColorStop(1, skin.colors.dark);

            ctx.shadowBlur = 15;
            ctx.shadowColor = skin.colors.accent;
            ctx.fillStyle = bodyGrad;
            drawCharacterShape(skin.shape, r);
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.strokeStyle = skin.colors.dark;
            ctx.lineWidth = 2;
            drawCharacterShape(skin.shape, r);
            ctx.stroke();

            drawVisor(skin.visor, r);
            ctx.restore();
        }

            ctx.save();

            const theme = getTheme();
            const ambientGrad = ctx.createRadialGradient(W / 2, H / 2, 100, W / 2, H / 2, W * 0.7);
            ambientGrad.addColorStop(0, theme.ambient);

            ctx.fillStyle = ambientGrad;
            ctx.fillRect(0, 0, W, H);

            decals.forEach(d => {
                ctx.globalAlpha = d.alpha;
                ctx.fillStyle = d.color;
                ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); ctx.fill();
            });
            ctx.globalAlpha = 1;

            drawWalls();
            enemies.forEach(e => drawEnemy(e));
            allies.forEach(a => drawAlly(a));
            drawPlayer();

            ctx.fillStyle = hoverBack ? 'rgba(255,170,0,0.35)' : 'rgba(40,40,40,0.85)';
            ctx.fillRect(btn.x, btn.y, btn.w, btn.h);
            ctx.strokeStyle = hoverBack ? '#ffaa00' : '#666';
            ctx.lineWidth = hoverBack ? 4 : 2;
            ctx.strokeRect(btn.x, btn.y, btn.w, btn.h);

            ctx.fillStyle = hoverBack ? '#ffdd44' : '#aaa';
            ctx.font = 'bold 22px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('← VOLTAR', btn.x + btn.w / 2, btn.y + btn.h / 2 + 1);
            ctx.textBaseline = 'alphabetic';
        }

        function drawMenu() {
            menuTime++;

            const bgGrad = ctx.createLinearGradient(0, 0, W, H);
            bgGrad.addColorStop(0, '#05050f');
            bgGrad.addColorStop(0.5, '#0a0518');
            bgGrad.addColorStop(1, '#100510');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, W, H);

            const vig = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.9);
            vig.addColorStop(0, 'rgba(0,0,0,0)');
            vig.addColorStop(1, 'rgba(0,0,0,0.9)');
            ctx.fillStyle = vig;
            ctx.fillRect(0, 0, W, H);

            const titleY = 100;
            const pulse = Math.sin(menuTime * 0.04) * 4;

            ctx.textAlign = 'center';

            ctx.fillStyle = 'rgba(80,40,200,0.7)';
            ctx.font = 'bold 78px Arial';
            ctx.fillText('NIGHTFALL', W / 2, titleY + pulse + 5);

            const titleGrad = ctx.createLinearGradient(0, titleY - 60, 0, titleY + 20);
            titleGrad.addColorStop(0, '#e0c8ff');
            titleGrad.addColorStop(0.4, '#a855f7');
            titleGrad.addColorStop(0.7, '#7c3aed');
            titleGrad.addColorStop(1, '#3b0764');
            ctx.fillStyle = titleGrad;
            ctx.font = 'bold 78px Arial';
            ctx.fillText('NIGHTFALL', W / 2, titleY + pulse);

            ctx.strokeStyle = 'rgba(220,190,255,0.85)';
            ctx.lineWidth = 1.5;
            ctx.strokeText('NIGHTFALL', W / 2, titleY + pulse);

            ctx.fillStyle = '#a855f7';
            ctx.font = 'bold 14px Arial';
            ctx.fillText('T Á T I C A L   A R E N A', W / 2, titleY + 28);

            const skin = getCurrentSkin();
            drawFullSkinPreview(80, 80, 20, skin);
            ctx.fillStyle = skin.colors.accent;
            ctx.font = 'bold 10px Arial';
            ctx.fillText(skin.name, 80, 115);

            BUTTONS.menu.forEach((btn, i) => {
                const isHover = menuSelection === i;
                drawMenuButton(btn.x, btn.y, btn.w, btn.h, btn.label, isHover, btn.color);
            });

            ctx.fillStyle = '#555';
            ctx.font = '11px Arial';
            ctx.fillText('WASD mover  •  MOUSE mirar  •  CLIQUE atirar  •  P pausar', W / 2, H - 30);

            if (confirmClear) {
                ctx.fillStyle = 'rgba(0,0,0,0.85)';
                ctx.fillRect(0, 0, W, H);
                ctx.fillStyle = '#ff4444';
                ctx.font = 'bold 48px Arial';
                ctx.fillText('LIMPAR RECORDES?', W / 2, H / 2 - 40);
                ctx.fillStyle = '#aaa';
                ctx.font = '18px Arial';
                ctx.fillText('Essa ação não pode ser desfeita!', W / 2, H / 2 - 5);

                BUTTONS.confirmClear.forEach((btn) => {
                    const hovered = mouseOverButton(btn);
                    ctx.fillStyle = hovered ? 'rgba(255,68,68,0.4)' : 'rgba(255,68,68,0.15)';
                    if (btn.id === 'no') ctx.fillStyle = hovered ? 'rgba(120,120,120,0.4)' : 'rgba(80,80,80,0.2)';
                    ctx.fillRect(btn.x, btn.y, btn.w, btn.h);
                    ctx.strokeStyle = btn.id === 'yes' ? '#ff4444' : '#888';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(btn.x, btn.y, btn.w, btn.h);
                    ctx.fillStyle = btn.id === 'yes' ? '#ff6666' : '#ccc';
                    ctx.font = 'bold 22px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(btn.label, btn.x + btn.w / 2, btn.y + 33);
                });
            }

            const mx = mouse.x, my = mouse.y;
            if (!confirmClear) {
                BUTTONS.menu.forEach((btn, i) => {
                    if (mouseOverButton(btn)) menuSelection = i;
                });
            }

            ctx.save();
            ctx.translate(mx, my);
            ctx.strokeStyle = '#c084fc';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI * 2); ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(-16, 0); ctx.lineTo(-6, 0);
            ctx.moveTo(6, 0); ctx.lineTo(16, 0);
            ctx.moveTo(0, -16); ctx.lineTo(0, -6);
            ctx.moveTo(0, 6); ctx.lineTo(0, 16);
            ctx.stroke();
            ctx.restore();
        }

        function drawMenuButton(x, y, w, h, label, selected, accentColor) {
            const isHover = selected;
            accentColor = accentColor || '#a855f7';

            if (isHover) { ctx.shadowBlur = 25; ctx.shadowColor = accentColor; }

            ctx.fillStyle = isHover ? 'rgba(255,255,255,0.15)' : 'rgba(25,20,40,0.85)';
            ctx.fillRect(x, y, w, h);
            ctx.shadowBlur = 0;

            ctx.strokeStyle = isHover ? accentColor : 'rgba(80,60,120,0.6)';
            ctx.lineWidth = isHover ? 2.5 : 1.5;
            ctx.strokeRect(x, y, w, h);

            ctx.fillStyle = isHover ? '#fff' : '#999';
            ctx.font = 'bold 20px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(label, x + w / 2, y + h / 2 + 2);
            ctx.textBaseline = 'alphabetic';
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>

</html>
