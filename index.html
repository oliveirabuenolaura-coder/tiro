                ctx.font = '22px Arial';
                ctx.fillText('ENTER para reiniciar', W / 2, H / 2 + 140);
                ctx.fillStyle = '#888';
                ctx.font = '16px Arial';
                ctx.fillText('ESC para o menu', W / 2, H / 2 + 172);
            }

            if (gameState === 'victory') {
                ctx.fillStyle = 'rgba(0,30,15,0.88)';
                ctx.fillRect(0, 0, W, H);
                ctx.fillStyle = '#00ff88';
                ctx.font = 'bold 76px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('VITÓRIA!', W / 2, H / 2 - 60);
                ctx.fillStyle = '#fff';
                ctx.font = '26px Arial';
                ctx.fillText('Você completou as 10 fases!', W / 2, H / 2 + 10);
                ctx.fillStyle = '#ffa500';
                ctx.font = '32px Arial';
                ctx.fillText('Score final: ' + score, W / 2, H / 2 + 60);
                ctx.fillStyle = '#aaa';
                ctx.font = '18px Arial';
                ctx.fillText('ENTER para jogar de novo  •  ESC para o menu', W / 2, H / 2 + 130);
            }
        }

        function drawShop() {
            shopTime++;
            ctx.fillStyle = '#0a0510';
            ctx.fillRect(0, 0, W, H);

            const offset = (shopTime * 0.3) % 60;
            ctx.strokeStyle = 'rgba(0,255,136,0.05)';
            for (let x = -60; x < W + 60; x += 60) {
                ctx.beginPath(); ctx.moveTo(x + offset, 0); ctx.lineTo(x + offset, H); ctx.stroke();
            }
            for (let y = -60; y < H + 60; y += 60) {
                ctx.beginPath(); ctx.moveTo(0, y + offset); ctx.lineTo(W, y + offset); ctx.stroke();
            }

            ctx.textAlign = 'center';
            ctx.fillStyle = '#00ff88';
            ctx.font = 'bold 52px Arial';
            ctx.fillText('LOJA', W / 2, 60);
            ctx.fillStyle = '#888';
            ctx.font = '14px Arial';
            ctx.fillText('Gaste suas moedas para ficar mais forte', W / 2, 85);
            ctx.fillStyle = '#ffdd00';
            ctx.font = 'bold 30px Arial';
            ctx.fillText('$ ' + coins, W / 2, 122);

            shopItems.forEach((it, i) => {
                const selected = i === shopSelection;
                const maxed = it.current >= it.max;
                const canAfford = coins >= it.cost && !maxed;
                const hovered = mouse.x >= it.x && mouse.x <= it.x + it.w &&
                    mouse.y >= it.y && mouse.y <= it.y + it.h;
                if (hovered) shopSelection = i;
                const isActive = selected || hovered;

                if (maxed) ctx.fillStyle = 'rgba(20,40,20,0.85)';
                else if (canAfford) ctx.fillStyle = isActive ? 'rgba(0,255,136,0.2)' : 'rgba(20,40,30,0.75)';
                else ctx.fillStyle = isActive ? 'rgba(60,20,20,0.6)' : 'rgba(30,20,20,0.6)';
                ctx.fillRect(it.x, it.y, it.w, it.h);

                ctx.strokeStyle = maxed ? 'rgba(0,255,136,0.3)'
                    : canAfford ? (isActive ? '#00ff88' : 'rgba(0,255,136,0.5)')
                        : (isActive ? '#ff4444' : 'rgba(255,68,68,0.3)');
                ctx.lineWidth = isActive ? 3 : 2;
                ctx.strokeRect(it.x, it.y, it.w, it.h);

                ctx.fillStyle = maxed ? '#00ff88' : canAfford ? it.color : '#666';
                ctx.beginPath();
                ctx.arc(it.x + 38, it.y + it.h / 2, 20, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#000';
                ctx.font = 'bold 16px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(it.current + '/' + it.max, it.x + 38, it.y + it.h / 2 + 1);
                ctx.textBaseline = 'alphabetic';

                ctx.textAlign = 'left';
                ctx.fillStyle = maxed ? '#00ff88' : canAfford ? '#fff' : '#888';
                ctx.font = 'bold 20px Arial';
                ctx.fillText(it.name, it.x + 75, it.y + 28);

                ctx.fillStyle = '#999';
                ctx.font = '12px Arial';
                ctx.fillText(it.desc, it.x + 75, it.y + 48);

                if (maxed) {
                    ctx.fillStyle = '#00ff88';
                    ctx.font = 'bold 15px Arial';
                    ctx.fillText('MAXIMIZADO', it.x + 75, it.y + 76);
                } else {
                    ctx.fillStyle = canAfford ? '#ffdd00' : '#ff5555';
                    ctx.font = 'bold 17px Arial';
                    ctx.fillText('$ ' + it.cost, it.x + 75, it.y + 76);
                }
            });

            const bx = W / 2 - 130, by = H - 60, bw = 260, bh = 46;
            const hoverCont = mouse.x >= bx && mouse.x <= bx + bw && mouse.y >= by && mouse.y <= by + bh;
            ctx.fillStyle = hoverCont ? 'rgba(255,170,0,0.3)' : 'rgba(40,40,40,0.85)';
            ctx.fillRect(bx, by, bw, bh);
            ctx.strokeStyle = hoverCont ? '#ffaa00' : '#666';
            ctx.lineWidth = 2;
            ctx.strokeRect(bx, by, bw, bh);

            ctx.fillStyle = hoverCont ? '#ffdd44' : '#aaa';
            ctx.font = 'bold 20px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('CONTINUAR  →', W / 2, by + bh / 2 + 1);
            ctx.textBaseline = 'alphabetic';

            ctx.fillStyle = '#555';
            ctx.font = '12px Arial';
            ctx.fillText('ENTER para comprar  •  ESC para pular a loja', W / 2, H - 8);
        }

        function drawMenu() {
            menuTime++;

            const bgGrad = ctx.createLinearGradient(0, 0, W, H);
            bgGrad.addColorStop(0, '#0a0010');
            bgGrad.addColorStop(0.5, '#050510');
            bgGrad.addColorStop(1, '#100008');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, W, H);

            ctx.save();
            ctx.translate(W / 2, H * 0.75);
            ctx.strokeStyle = 'rgba(255,80,0,0.15)';
            ctx.lineWidth = 1;
            for (let i = -20; i <= 20; i++) {
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(i * 60, -H * 0.75);
                ctx.stroke();
            }
            const scrollOffset = (menuTime * 2) % 60;
            for (let y = -H * 0.75; y < 200; y += 60) {
                const depth = y + scrollOffset;
                const scale = 1 + depth / 200;
                ctx.globalAlpha = Math.max(0, 1 - Math.abs(depth) / (H * 0.5));
                ctx.beginPath();
                ctx.moveTo(-W * 1.5 * scale, y + scrollOffset);
                ctx.lineTo(W * 1.5 * scale, y + scrollOffset);
                ctx.stroke();
            }
            ctx.globalAlpha = 1;
            ctx.restore();

            const vig = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.9);
            vig.addColorStop(0, 'rgba(0,0,0,0)');
            vig.addColorStop(1, 'rgba(0,0,0,0.9)');
            ctx.fillStyle = vig;
            ctx.fillRect(0, 0, W, H);

            for (let i = 0; i < 60; i++) {
                const seed = i * 137;
                const speed = 0.2 + (i % 5) * 0.08;
                const x = (seed * 7919 + menuTime * speed) % (W + 100) - 50;
                const y = (seed * 104729 + menuTime * 0.3) % (H + 100) - 50;
                const size = 0.5 + (i % 3) * 0.5;
                const alpha = 0.2 + Math.sin(menuTime * 0.03 + i) * 0.15;
                ctx.fillStyle = i % 3 === 0
                    ? `rgba(0,220,255,${alpha})`
                    : `rgba(255,150,50,${alpha})`;
                ctx.beginPath();
                ctx.arc(x, H - y, size, 0, Math.PI * 2);
                ctx.fill();
            }

            const titleY = 170;
            const pulse = Math.sin(menuTime * 0.04) * 4;

            const glowGrad = ctx.createRadialGradient(W / 2, titleY, 0, W / 2, titleY, 400);
            glowGrad.addColorStop(0, 'rgba(255,100,0,0.25)');
            glowGrad.addColorStop(0.5, 'rgba(255,50,0,0.08)');
            glowGrad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = glowGrad;
            ctx.fillRect(0, titleY - 250, W, 500);

            ctx.textAlign = 'center';

            ctx.fillStyle = 'rgba(255,40,0,0.6)';
            ctx.font = 'bold 108px Arial';
            ctx.fillText('SHOOTER', W / 2, titleY + pulse + 6);

            const titleGrad = ctx.createLinearGradient(0, titleY - 80, 0, titleY + 30);
            titleGrad.addColorStop(0, '#ffdd44');
            titleGrad.addColorStop(0.5, '#ff8800');
            titleGrad.addColorStop(1, '#ff3300');
            ctx.fillStyle = titleGrad;
            ctx.font = 'bold 108px Arial';
            ctx.fillText('SHOOTER', W / 2, titleY + pulse);

            ctx.strokeStyle = 'rgba(255,240,150,0.8)';
            ctx.lineWidth = 1.5;
            ctx.strokeText('SHOOTER', W / 2, titleY + pulse);

            ctx.fillStyle = '#ffcc00';
            ctx.font = 'bold 20px Arial';
            ctx.fillText('T Á T I C A L   A R E N A', W / 2, titleY + 45);

            ctx.strokeStyle = 'rgba(255,150,50,0.8)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(W / 2 - 200, titleY + 45);
            ctx.lineTo(W / 2 - 60, titleY + 45);
            ctx.moveTo(W / 2 + 60, titleY + 45);
            ctx.lineTo(W / 2 + 200, titleY + 45);
            ctx.stroke();

            const btnW = 320, btnH = 64;
            const btn1Y = 330;
            const btn2Y = 410;

            drawMenuButton(W / 2 - btnW / 2, btn1Y, btnW, btnH, 'INICIAR', menuSelection === 0, '#00ff88');
            drawMenuButton(W / 2 - btnW / 2, btn2Y, btnW, btnH, 'SAIR', menuSelection === 1, '#ff4444');

            const infoY = H - 130;
            const infoBoxW = 800;
            const infoBoxX = W / 2 - infoBoxW / 2;

            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(infoBoxX, infoY, infoBoxW, 60);
            ctx.strokeStyle = 'rgba(255,170,0,0.3)';
            ctx.lineWidth = 1;
            ctx.strokeRect(infoBoxX, infoY, infoBoxW, 60);

            ctx.textAlign = 'center';
            ctx.fillStyle = '#ffa500';
            ctx.font = 'bold 13px Arial';
            ctx.fillText('10', W / 2 - 300, infoY + 24);
            ctx.fillStyle = '#666';
            ctx.font = '10px Arial';
            ctx.fillText('FASES', W / 2 - 300, infoY + 40);

            ctx.fillStyle = '#44ddff';
            ctx.font = 'bold 13px Arial';
            ctx.fillText('10', W / 2 - 150, infoY + 24);
            ctx.fillStyle = '#666';
            ctx.font = '10px Arial';
            ctx.fillText('ARMAS', W / 2 - 150, infoY + 40);

            ctx.fillStyle = '#66ff99';
            ctx.font = 'bold 13px Arial';
            ctx.fillText('ALIADOS', W / 2, infoY + 24);
            ctx.fillStyle = '#666';
            ctx.font = '10px Arial';
            ctx.fillText('ATÉ 9', W / 2, infoY + 40);

            ctx.fillStyle = '#ffdd00';
            ctx.font = 'bold 13px Arial';
            ctx.fillText('LOJA', W / 2 + 150, infoY + 24);
            ctx.fillStyle = '#666';
            ctx.font = '10px Arial';
            ctx.fillText('MELHORIAS', W / 2 + 150, infoY + 40);

            ctx.fillStyle = '#ff6688';
            ctx.font = 'bold 13px Arial';
            ctx.fillText('AUTO', W / 2 + 300, infoY + 24);
            ctx.fillStyle = '#666';
            ctx.font = '10px Arial';
            ctx.fillText('COLETA', W / 2 + 300, infoY + 40);

            ctx.fillStyle = '#555';
            ctx.font = '11px Arial';
            ctx.fillText('WASD mover   MOUSE mirar   CLIQUE atirar   R recarregar   P pausar', W / 2, H - 35);

            ctx.save();
            ctx.translate(W / 2, 600);
            ctx.rotate(Math.sin(menuTime * 0.02) * 0.3);
            ctx.shadowBlur = 25;
            ctx.shadowColor = '#00aaff';
            ctx.fillStyle = '#44ddff';
            ctx.beginPath();
            ctx.arc(0, 0, 16, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#0066aa';
            ctx.beginPath();
            ctx.arc(0, 0, 7, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(10, -3, 22, 6);
            ctx.fillStyle = '#666';
            ctx.fillRect(28, -2, 6, 4);
            ctx.restore();

            const mx = mouse.x, my = mouse.y;
            if (mx >= W / 2 - btnW / 2 && mx <= W / 2 + btnW / 2) {
                if (my >= btn1Y && my <= btn1Y + btnH) menuSelection = 0;
                if (my >= btn2Y && my <= btn2Y + btnH) menuSelection = 1;
            }

            ctx.save();
            ctx.translate(mx, my);
            ctx.strokeStyle = 'rgba(255,80,80,0.9)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(0, 0, 10, 0, Math.PI * 2);
            ctx.stroke();
            ctx.strokeStyle = '#ff3333';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-16, 0); ctx.lineTo(-6, 0);
            ctx.moveTo(6, 0); ctx.lineTo(16, 0);
            ctx.moveTo(0, -16); ctx.lineTo(0, -6);
            ctx.moveTo(0, 6); ctx.lineTo(0, 16);
            ctx.stroke();
            ctx.restore();
        }

        function drawMenuButton(x, y, w, h, label, selected, accentColor) {
            const isHover = selected;
            accentColor = accentColor || '#ffaa00';

            if (isHover) {
                ctx.shadowBlur = 30;
                ctx.shadowColor = accentColor;
            }

            const bgGrad = ctx.createLinearGradient(x, y, x + w, y + h);
            if (isHover) {
                bgGrad.addColorStop(0, 'rgba(255,140,0,0.35)');
                bgGrad.addColorStop(1, 'rgba(255,60,0,0.25)');
            } else {
                bgGrad.addColorStop(0, 'rgba(30,30,40,0.85)');
                bgGrad.addColorStop(1, 'rgba(15,15,25,0.9)');
            }
            ctx.fillStyle = bgGrad;
            ctx.fillRect(x, y, w, h);
            ctx.shadowBlur = 0;

            ctx.strokeStyle = isHover ? accentColor : 'rgba(80,80,90,0.6)';
            ctx.lineWidth = isHover ? 2.5 : 1.5;
            ctx.strokeRect(x, y, w, h);

            ctx.fillStyle = isHover ? '#ffee88' : '#999';
            ctx.font = 'bold 28px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(label, x + w / 2, y + h / 2 + 2);
            ctx.textBaseline = 'alphabetic';
        }

        /* =========================================================
           LOOP
        ========================================================= */
        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>

</html>
