        function findFreeSpawn() {
            const candidates = [
                { x: W / 2, y: H / 2 },
                { x: W / 2, y: H / 2 + 200 }, { x: W / 2, y: H / 2 - 200 },
                { x: 300, y: 300 }, { x: W - 300, y: 300 },
                { x: 300, y: H - 300 }, { x: W - 300, y: H - 300 },
                { x: W / 2, y: 400 }, { x: W / 2, y: H - 400 },
                { x: 400, y: H / 2 }, { x: W - 400, y: H / 2 }
            ];
            for (const c of candidates) if (!circleHitsWalls(c.x, c.y, player.r + 8)) return c;
            return { x: W / 2, y: H / 2 };
        }

        function spawnPlayer() {
            const p = findFreeSpawn();
            player.x = p.x; player.y = p.y;
            player.hp = player.maxHp;

        /* =========================================================
           COLISÃO
        ========================================================= */
        function circleHitsRect(cx, cy, r, rect) {
            const closestX = Math.max(rect.x, Math.min(cx, rect.x + rect.w));
            const closestY = Math.max(rect.y, Math.min(cy, rect.y + rect.h));
            const dx = cx - closestX, dy = cy - closestY;
            return dx * dx + dy * dy < r * r;
        }
        function circleHitsWalls(x, y, r) {
            for (const w of walls) if (circleHitsRect(x, y, r, w)) return true;
            return false;
        }
        function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
        function hasLineOfSight(a, b) {
            const steps = 14;
            for (let i = 1; i < steps; i++) {
                const t = i / steps;
                const x = a.x + (b.x - a.x) * t;
                const y = a.y + (b.y - a.y) * t;
                if (circleHitsWalls(x, y, 3)) return false;
            }
            return true;
        }

        /* =========================================================
           INPUT
        ========================================================= */
        document.addEventListener('keydown', e => {
            const k = e.key.toLowerCase();
            keys[k] = true;

            if (gameState === 'menu') {
                if (k === 'arrowup' || k === 'w') menuSelection = Math.max(0, menuSelection - 1);
                if (k === 'arrowdown' || k === 's') menuSelection = Math.min(1, menuSelection + 1);
                if (k === 'enter' || k === ' ') { if (menuSelection === 0) startGame(); }
                return;
            }

            if (gameState === 'shop') {
                const cols = 2;
                if (k === 'arrowup' || k === 'w') shopSelection = Math.max(0, shopSelection - cols);
                if (k === 'arrowdown' || k === 's') shopSelection = Math.min(shopItems.length - 1, shopSelection + cols);
                if (k === 'arrowleft' || k === 'a') shopSelection = Math.max(0, shopSelection - 1);
                if (k === 'arrowright' || k === 'd') shopSelection = Math.min(shopItems.length - 1, shopSelection + 1);
                if (k === 'enter' || k === ' ') buyItem(shopSelection);
                if (k === 'escape' || k === 'tab') skipShop();
                return;
            }

            if (gameState === 'playing') {
                if (k === 'p') gameState = 'paused';
                if (k === 'escape') gameState = 'menu';
                if (k === 'r' && !player.reloading && player.ammo < player.maxAmmo) startReload();
            } else if (gameState === 'paused') {
                if (k === 'p' || k === 'escape') gameState = 'playing';
            } else if (gameState === 'gameOver' || gameState === 'victory') {
                if (k === 'r' || k === 'enter') startGame();
                if (k === 'escape') gameState = 'menu';
            } else if (gameState === 'waveComplete') {
                if (k === 'enter' || k === ' ') openShop();
            }
            if (e.key === ' ') e.preventDefault();
        });

            mouse.x = (e.clientX - r.left) * (W / r.width);
            mouse.y = (e.clientY - r.top) * (H / r.height);

            if (e.button === 0) {

                if (gameState === 'menu') { if (menuSelection === 0) startGame(); }
                else if (gameState === 'shop') {
                    for (let i = 0; i < shopItems.length; i++) {
                        const it = shopItems[i];
                        if (mouse.x >= it.x && mouse.x <= it.x + it.w &&
                            mouse.y >= it.y && mouse.y <= it.y + it.h) {
                            shopSelection = i;
                            buyItem(i);
                            break;
                        }
                    }
                    const bx = W / 2 - 130, by = H - 60, bw = 260, bh = 46;
                    if (mouse.x >= bx && mouse.x <= bx + bw && mouse.y >= by && mouse.y <= by + bh) {
                        skipShop();
                    }
                }
            }
        });
        canvas.addEventListener('mouseup', e => { if (e.button === 0) mouse.down = false; });
        canvas.addEventListener('contextmenu', e => e.preventDefault());

        /* =========================================================
           INICIAR / FASES
        ========================================================= */
        function startGame() {
            score = 0;
            coins = 50;
            currentPhase = 0;
            upgrades.damage = 0; upgrades.speed = 0; upgrades.maxHp = 0;
            upgrades.reload = 0; upgrades.extraAlly = 0; upgrades.regen = 0;
            upgrades.magnet = 0; upgrades.medkitDrop = 0;
            regenAccumulator = 0;
            loadPhase();
            gameState = 'playing';
        }

        function loadPhase() {
            const phase = PHASES[currentPhase];
            buildMap(phase.map);
            spawnPlayer();

            player.maxHp = phase.playerHp + upgrades.maxHp * 25;
            player.hp = player.maxHp;
            player.speed = 5.2 + upgrades.speed * 0.5;

            const wp = WEAPONS[phase.weapon];
            player.maxAmmo = wp.ammoPerReload;
            player.ammo = player.maxAmmo;
            player.reloadTime = Math.max(20, wp.reloadTime - upgrades.reload * 10);

            bullets = []; enemies = []; enemyBullets = []; particles = [];
            bloodStains = []; casings = []; coinDrops = []; explosions = [];
            healthDrops = []; medkits = []; floatingTexts = [];
            allies = []; allyBullets = [];
            spawnTimer = 0; phaseTime = 0; killsThisPhase = 0;
            medkitTimer = 300;
            shakeTime = 0; banner = 150; bannerText = phase.name;
            allySpawnBanner = phase.allies > 0 ? 180 : 0;

            const totalAllies = phase.allies + upgrades.extraAlly;
            if (totalAllies > 0) {
                for (let i = 0; i < totalAllies; i++) {
                    const angle = (i / totalAllies) * Math.PI * 2;
                    const off = 55 + (i % 2) * 15;
                    let ax = player.x + Math.cos(angle) * off;
                    let ay = player.y + Math.sin(angle) * off;
                    if (circleHitsWalls(ax, ay, 14)) {
                        ax = player.x + (i % 2 === 0 ? 40 : -40);
                        ay = player.y + 40;
                    }
                    allies.push({
                        x: ax, y: ay, r: 13, speed: 4.6,
                        hp: 30, maxHp: 30, angle: 0,
                        shootCooldown: 30 + i * 10, fireRate: 32, range: 520,
                        dmg: 1 + Math.floor(upgrades.damage / 2), bulletSpeed: 12,
                        target: null, hitFlash: 0,
                        animPhase: Math.random() * Math.PI * 2,
                        color: '#66ff99', glow: '#00ff88',
                        strafePhase: Math.random() * Math.PI * 2
                    });
                }
            }
        }

        function nextPhase() {
            currentPhase++;
            if (currentPhase >= PHASES.length) gameState = 'victory';
            else { loadPhase(); gameState = 'playing'; }
        }

        /* =========================================================
           AÇÕES
        ========================================================= */
        function startReload() {
            if (player.reloading || player.ammo === player.maxAmmo) return;
            player.reloading = true;
            player.reloadTimer = player.reloadTime;
        }

        function shoot() {
            const wp = getWeapon();
            if (player.reloading || player.shootCooldown > 0) return;
            if (player.ammo <= 0) { startReload(); return; }

            for (let p = 0; p < wp.pellets; p++) {
                let angleOffset = 0;
                if (wp.pellets === 2 && p === 0) angleOffset = -0.06;
                if (wp.pellets === 2 && p === 1) angleOffset = 0.06;

                const spread = (Math.random() - 0.5) * wp.spread * 2 + angleOffset;
                const a = player.angle + spread;
                const mx = player.x + Math.cos(a) * (player.r + 16);
                const my = player.y + Math.sin(a) * (player.r + 16);

                bullets.push({
                    x: mx, y: my,
                    vx: Math.cos(a) * wp.bulletSpeed,
                    vy: Math.sin(a) * wp.bulletSpeed,
                    r: wp.bulletR,
                    life: wp.rail ? 30 : 70,
                    damage: wp.damage + upgrades.damage,
                    pierce: wp.pierce, explosive: wp.explosive, rail: wp.rail,
                    hitList: [], color: wp.color, glow: wp.glow, trail: []
                });
            }

            const a = player.angle;
            const nX = player.x - Math.cos(a) * 1.5;
            const nY = player.y - Math.sin(a) * 1.5;
            if (!circleHitsWalls(nX, player.y, player.r)) player.x = nX;
            if (!circleHitsWalls(player.x, nY, player.r)) player.y = nY;

            player.ammo--;
            player.shootCooldown = wp.fireRate;
            player.recoil = wp.pellets > 1 ? 5 : wp.damage >= 3 ? 8 : 3;
            shakeTime = wp.pellets > 1 ? 7 : wp.damage >= 3 ? 10 : 4;
            shakeAmount = wp.pellets > 1 ? 5 : wp.damage >= 3 ? 8 : 2.5;
            muzzleFlash = 4;

            const perpA = a + Math.PI / 2;
            casings.push({
                x: player.x + Math.cos(a) * 20,
                y: player.y + Math.sin(a) * 20,
                vx: Math.cos(perpA) * (2 + Math.random() * 2) + Math.cos(a) * -1,
                vy: Math.sin(perpA) * (2 + Math.random() * 2) + Math.sin(a) * -1,
                life: 60, maxLife: 60,
                angle: Math.random() * Math.PI * 2,
                spin: (Math.random() - 0.5) * 0.4
            });

            for (let i = 0; i < (wp.pellets > 1 ? 10 : 6); i++) {
                const sa = a + (Math.random() - 0.5) * 0.7;
                const sp = 3 + Math.random() * 5;
                particles.push({
                    x: player.x + Math.cos(a) * 22,
                    y: player.y + Math.sin(a) * 22,
                    vx: Math.cos(sa) * sp, vy: Math.sin(sa) * sp,
                    life: 10 + Math.random() * 8, maxLife: 18,
                    color: wp.color, size: 2 + Math.random() * 2, glow: true
                });
            }
        }

        /* =========================================================
           CURA
        ========================================================= */
        function healPlayer(amount, sourceX, sourceY) {
            const before = player.hp;
            player.hp = Math.min(player.maxHp, player.hp + amount);
            const healed = player.hp - before;
            if (healed <= 0) return;

            healFlash = 20;
            floatingTexts.push({
                x: player.x, y: player.y - 30,
                text: '+' + healed, color: '#44ff88',
                life: 60, maxLife: 60, vy: -0.8
            });

            for (let i = 0; i < 15; i++) {
                const a = Math.random() * Math.PI * 2;
                particles.push({
                    x: player.x + Math.cos(a) * 15,
                    y: player.y + Math.sin(a) * 15,
                    vx: Math.cos(a) * 1.5, vy: -1 - Math.random() * 2,
                    life: 30 + Math.random() * 20, maxLife: 50,
                    color: '#44ff88', size: 2 + Math.random() * 2, glow: true
                });
            }
        }

        function dropHealth(x, y) {
            const chance = 0.15 + upgrades.medkitDrop * 0.1;
            if (Math.random() > chance) return;
            const a = Math.random() * Math.PI * 2;
            healthDrops.push({
                x, y,
                vx: Math.cos(a) * 3, vy: Math.sin(a) * 3,
                r: 9, life: 500,
                healAmount: 15 + upgrades.medkitDrop * 5,
                animPhase: Math.random() * Math.PI * 2
            });
        }

        /* =========================================================
           INIMIGOS
        ========================================================= */
        function spawnEnemy() {
            const phase = PHASES[currentPhase];
            const types = phase.enemyTypes;
            let best = null, bestDist = 0;
            for (let attempt = 0; attempt < 50; attempt++) {
                const side = Math.floor(Math.random() * 4);
                let x, y;
                if (side === 0) { x = 60 + Math.random() * (W - 120); y = 60; }
                else if (side === 1) { x = W - 60; y = 60 + Math.random() * (H - 120); }
                else if (side === 2) { x = 60 + Math.random() * (W - 120); y = H - 60; }
                else { x = 60; y = 60 + Math.random() * (H - 120); }

                if (circleHitsWalls(x, y, 25)) continue;
                const d = Math.hypot(x - player.x, y - player.y);
                if (d < 220) continue;
                if (d > bestDist) { bestDist = d; best = { x, y }; }
            }
            if (!best) return;

            const type = types[Math.floor(Math.random() * types.length)];
            const stats = {
                pistol: { r: 14, speed: 1.1, hp: 3, color: '#ff5555', glow: '#ff2222', fireRate: 90, range: 480, dmg: 8, bulletSpeed: 6 },
                smg: { r: 13, speed: 1.5, hp: 2, color: '#ffaa33', glow: '#ff8800', fireRate: 16, range: 380, dmg: 5, bulletSpeed: 7 },
                shotgun: { r: 17, speed: 0.7, hp: 5, color: '#cc44ff', glow: '#aa22ff', fireRate: 120, range: 300, dmg: 7, bulletSpeed: 5.5, pellets: 3 },
                sniper: { r: 15, speed: 0.5, hp: 4, color: '#44ffaa', glow: '#00ff88', fireRate: 160, range: 900, dmg: 18, bulletSpeed: 11 }
            }[type];

            const hpBonus = Math.floor(currentPhase / 2);
            const spdBonus = currentPhase * 0.06;

            enemies.push({
                x: best.x, y: best.y,
                r: stats.r, speed: stats.speed + spdBonus,
                hp: stats.hp + hpBonus, maxHp: stats.hp + hpBonus,
                type, color: stats.color, glow: stats.glow,
                angle: 0, fireRate: stats.fireRate, range: stats.range,
                dmg: stats.dmg, bulletSpeed: stats.bulletSpeed,
                pellets: stats.pellets || 1,
                shootTimer: 40 + Math.random() * stats.fireRate,
                hitFlash: 0,
                strafeDir: Math.random() < 0.5 ? 1 : -1, strafeTimer: 0,
                spawnFade: 30, animPhase: Math.random() * Math.PI * 2
            });
        }

        /* =========================================================
           EFEITOS
        ========================================================= */
        function explode(x, y, color, count = 12, speed = 5) {
            for (let i = 0; i < count; i++) {
                const a = Math.random() * Math.PI * 2;
                const s = Math.random() * speed;
                particles.push({
                    x, y,
                    vx: Math.cos(a) * s, vy: Math.sin(a) * s,
                    life: 20 + Math.random() * 15, maxLife: 35,
                    color, size: 2 + Math.random() * 3, glow: true
                });
            }
        }

        function plasmaExplosion(x, y, radius, damage) {
            explosions.push({ x, y, radius: 0, maxRadius: radius, life: 15, maxLife: 15 });
            explode(x, y, '#aa44ff', 30, 8);
            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                if (dist({ x, y }, e) < radius + e.r) {
                    e.hp -= damage;
                    e.hitFlash = 8;
                    if (e.hp <= 0) {
                        explode(e.x, e.y, e.color, 25, 8);
                        const killValue = { pistol: 15, smg: 20, shotgun: 30, sniper: 40 }[e.type] || 15;
                        score += killValue;
                        killsThisPhase++;
                        const coinAmount = { pistol: 2, smg: 2, shotgun: 4, sniper: 5 }[e.type] || 2;
                        dropCoins(e.x, e.y, coinAmount);
                        dropHealth(e.x, e.y);
                        enemies.splice(i, 1);
                    }
                }
            }
        }

        function damagePlayer(amount) {
            if (playerInvuln > 0) return;
            player.hp -= amount;
            playerInvuln = 30;
            shakeTime = 16; shakeAmount = 10;
            hitStop = 3;
            if (player.hp <= 0) { player.hp = 0; gameState = 'gameOver'; }
        }

        function unstickPlayer() {
            if (!circleHitsWalls(player.x, player.y, player.r)) return;
            for (let radius = 3; radius <= 50; radius += 3) {
                for (let i = 0; i < 24; i++) {
                    const a = (i / 24) * Math.PI * 2;
                    const nx = player.x + Math.cos(a) * radius;
                    const ny = player.y + Math.sin(a) * radius;
                    if (!circleHitsWalls(nx, ny, player.r)) { player.x = nx; player.y = ny; return; }
                }
            }
            const p = findFreeSpawn();
            player.x = p.x; player.y = p.y;
        }

        function dropCoins(x, y, amount) {
            for (let i = 0; i < amount; i++) {
                const a = Math.random() * Math.PI * 2;
                const s = 2 + Math.random() * 3;
                coinDrops.push({
                    x, y,
                    vx: Math.cos(a) * s, vy: Math.sin(a) * s,
                    r: 5, life: 400, value: 1,
                    animPhase: Math.random() * Math.PI * 2
                });
            }
        }

        /* =========================================================
           IA DOS ALIADOS
        ========================================================= */
        function updateAlly(a) {
            if (a.hitFlash > 0) a.hitFlash--;
            a.animPhase += 0.08;
            a.strafePhase += 0.03;

            let best = null, bestD = a.range;
            for (const e of enemies) {
                const d = dist(a, e);
                if (d < bestD && hasLineOfSight(a, e)) { best = e; bestD = d; }
            }
            a.target = best;

            let mx = 0, my = 0;

            if (best) {
                const ddx = best.x - a.x, ddy = best.y - a.y;
                const d = Math.hypot(ddx, ddy) || 1;
                a.angle = Math.atan2(ddy, ddx);
                const idealDist = 180;
                if (d > idealDist + 40) { mx = (ddx / d) * a.speed; my = (ddy / d) * a.speed; }
                else if (d < idealDist - 60) { mx = -(ddx / d) * a.speed * 0.7; my = -(ddy / d) * a.speed * 0.7; }
                else {
                    const px = -ddy / d, py = ddx / d;
                    const s = Math.sin(a.strafePhase) > 0 ? 1 : -1;
                    mx = px * s * a.speed * 0.6;
                    my = py * s * a.speed * 0.6;
                }
                a.shootCooldown--;
                if (a.shootCooldown <= 0) { fireAllyWeapon(a); a.shootCooldown = a.fireRate; }
            } else {
                const ddx = player.x - a.x, ddy = player.y - a.y;
                const d = Math.hypot(ddx, ddy) || 1;
                a.angle = Math.atan2(ddy, ddx);
                const followDist = 80 + (a.__index || 0) * 15;
                if (d > followDist + 20) { mx = (ddx / d) * a.speed * 0.8; my = (ddy / d) * a.speed * 0.8; }
                else if (d < followDist - 30) { mx = -(ddx / d) * a.speed * 0.4; my = -(ddy / d) * a.speed * 0.4; }
                if (a.shootCooldown > 0) a.shootCooldown--;
            }

            if (!circleHitsWalls(a.x + mx, a.y, a.r)) a.x += mx;
            if (!circleHitsWalls(a.x, a.y + my, a.r)) a.y += my;

            if (circleHitsWalls(a.x, a.y, a.r)) {
                for (let radius = 3; radius <= 40; radius += 3) {
                    for (let i = 0; i < 16; i++) {
                        const ang = (i / 16) * Math.PI * 2;
                        const nx = a.x + Math.cos(ang) * radius;
                        const ny = a.y + Math.sin(ang) * radius;
                        if (!circleHitsWalls(nx, ny, a.r)) { a.x = nx; a.y = ny; break; }
                    }
                }
            }

            if (!best && a.hp < a.maxHp && Math.random() < 0.005) {
                a.hp = Math.min(a.maxHp, a.hp + 1);
            }
        }

        function fireAllyWeapon(a) {
            const spread = (Math.random() - 0.5) * 0.1;
            const ang = a.angle + spread;
            allyBullets.push({
                x: a.x + Math.cos(ang) * (a.r + 8),
                y: a.y + Math.sin(ang) * (a.r + 8),
                vx: Math.cos(ang) * a.bulletSpeed,
                vy: Math.sin(ang) * a.bulletSpeed,
                r: 3, life: 60, damage: a.dmg,
                color: '#88ffbb', glow: '#00ff88'
            });
            for (let i = 0; i < 3; i++) {
                const sa = ang + (Math.random() - 0.5) * 0.6;
                const sp = 2 + Math.random() * 3;
                particles.push({
                    x: a.x + Math.cos(ang) * (a.r + 8),
                    y: a.y + Math.sin(ang) * (a.r + 8),
                    vx: Math.cos(sa) * sp, vy: Math.sin(sa) * sp,
                    life: 8 + Math.random() * 6, maxLife: 14,
                    color: '#aaffcc', size: 1.5 + Math.random() * 1.5, glow: true
                });
            }
        }

        /* =========================================================
           UPDATE
        ========================================================= */
        function update() {
            if (gameState !== 'playing') return;
            if (hitStop > 0) { hitStop--; return; }

            if (shakeTime > 0) shakeTime--;
            if (muzzleFlash > 0) muzzleFlash--;
            if (playerInvuln > 0) playerInvuln--;
            if (banner > 0) banner--;
            if (allySpawnBanner > 0) allySpawnBanner--;
            if (healFlash > 0) healFlash--;
            if (player.recoil > 0) player.recoil *= 0.8;

            phaseTime++;
            unstickPlayer();

            if (upgrades.regen > 0 && player.hp < player.maxHp) {
                regenAccumulator++;
                if (regenAccumulator >= Math.max(15, 60 - upgrades.regen * 15)) {
                    regenAccumulator = 0;
                    player.hp = Math.min(player.maxHp, player.hp + 1);
                }
            }

            medkitTimer--;
            if (medkitTimer <= 0) {
                medkitTimer = 400 + Math.random() * 300;
                if (player.hp < player.maxHp * 0.8) {
                    for (let attempt = 0; attempt < 20; attempt++) {
                        const x = 100 + Math.random() * (W - 200);
                        const y = 100 + Math.random() * (H - 200);
                        if (circleHitsWalls(x, y, 20)) continue;
                        const d = Math.hypot(x - player.x, y - player.y);
                        if (d < 200) continue;
                        medkits.push({ x, y, r: 14, life: 900, healAmount: 40, animPhase: Math.random() * Math.PI * 2 });
                        break;
                    }
                }
            }

            player.angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);

            let dx = 0, dy = 0;
            if (keys['w'] || keys['arrowup']) dy -= 1;
            if (keys['s'] || keys['arrowdown']) dy += 1;
            if (keys['a'] || keys['arrowleft']) dx -= 1;
            if (keys['d'] || keys['arrowright']) dx += 1;
            if (dx || dy) {
                const len = Math.hypot(dx, dy);
                dx = (dx / len) * player.speed;
                dy = (dy / len) * player.speed;
                if (!circleHitsWalls(player.x + dx, player.y, player.r)) player.x += dx;
                if (!circleHitsWalls(player.x, player.y + dy, player.r)) player.y += dy;
            }

            const wp = getWeapon();
            if (mouse.down) {
                shoot();
                if (!wp.auto && player.shootCooldown > wp.fireRate * 0.6) player.shootCooldown = wp.fireRate;
            }
            if (player.shootCooldown > 0) player.shootCooldown--;

            if (player.reloading) {
                player.reloadTimer--;
                if (player.reloadTimer <= 0) {
                    player.reloading = false;
                    player.ammo = player.maxAmmo;
                }
            }

            const phase = PHASES[currentPhase];
            spawnTimer++;
            if (spawnTimer >= phase.spawnInterval && enemies.length < phase.maxEnemies) {
                spawnTimer = 0;
                spawnEnemy();
            }

            allies.forEach((a, i) => { a.__index = i; updateAlly(a); });

            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.trail.push({ x: b.x, y: b.y });
                if (b.trail.length > (b.rail ? 20 : 6)) b.trail.shift();
                b.x += b.vx; b.y += b.vy; b.life--;
                if (b.life <= 0 || b.x < 0 || b.x > W || b.y < 0 || b.y > H ||
                    circleHitsWalls(b.x, b.y, b.r)) {
                    if (b.explosive) plasmaExplosion(b.x, b.y, 80, b.damage);
                    else explode(b.x, b.y, b.color, 5, 3);
                    bullets.splice(i, 1);
                }
            }

            for (let i = allyBullets.length - 1; i >= 0; i--) {
                const b = allyBullets[i];
                b.x += b.vx; b.y += b.vy; b.life--;
                if (b.life <= 0 || b.x < 0 || b.x > W || b.y < 0 || b.y > H ||
                    circleHitsWalls(b.x, b.y, b.r)) {
                    explode(b.x, b.y, '#88ffbb', 4, 3);
                    allyBullets.splice(i, 1);
                }
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                if (e.hitFlash > 0) e.hitFlash--;
                if (e.spawnFade > 0) e.spawnFade--;
                e.animPhase += 0.1;

                let target = player;
                let minAllyD = 200;
                for (const a of allies) {
                    const d = dist(e, a);
                    if (d < minAllyD) { minAllyD = d; target = a; }
                }

                const ddx = target.x - e.x, ddy = target.y - e.y;
                const d = Math.hypot(ddx, ddy) || 1;
                e.angle = Math.atan2(ddy, ddx);
                const los = hasLineOfSight(e, target);

                e.strafeTimer--;
                if (e.strafeTimer <= 0) {
                    e.strafeDir = Math.random() < 0.5 ? 1 : -1;
                    e.strafeTimer = 60 + Math.random() * 90;
                }

                let mx = 0, my = 0;
                if (!los) { mx = (ddx / d) * e.speed; my = (ddy / d) * e.speed; }
                else if (d > e.range * 0.75) { mx = (ddx / d) * e.speed; my = (ddy / d) * e.speed; }
                else if (d < e.range * 0.45) { mx = -(ddx / d) * e.speed; my = -(ddy / d) * e.speed; }
                else {
                    const px = -ddy / d, py = ddx / d;
                    mx = px * e.strafeDir * e.speed * 0.9;
                    my = py * e.strafeDir * e.speed * 0.9;
                }

                if (!circleHitsWalls(e.x + mx, e.y, e.r)) e.x += mx;
                else if (!circleHitsWalls(e.x, e.y + my, e.r)) e.y += my;
                else {
                    const ppx = -my, ppy = mx;
                    if (!circleHitsWalls(e.x + ppx, e.y, e.r)) e.x += ppx;
                    if (!circleHitsWalls(e.x, e.y + ppy, e.r)) e.y += ppy;
                }

                e.shootTimer--;
                if (e.shootTimer <= 0 && los && d < e.range && e.spawnFade <= 0) {
                    fireEnemyWeapon(e, target);
                    e.shootTimer = e.fireRate + Math.random() * e.fireRate * 0.4;
                }

                if (dist(e, player) < e.r + player.r) {
                    damagePlayer(8);
                    const dd = dist(e, player) || 1;
                    const push = 20;
                    const px = ((e.x - player.x) / dd) * push, py = ((e.y - player.y) / dd) * push;
                    if (!circleHitsWalls(e.x + px, e.y, e.r)) e.x += px;
                    if (!circleHitsWalls(e.x, e.y + py, e.r)) e.y += py;
                }

                for (const a of allies) {
                    if (dist(e, a) < e.r + a.r) {
                        a.hp -= 10;
                        a.hitFlash = 8;
                        const dd = dist(e, a) || 1;
                        const push = 15;
                        const px = ((a.x - e.x) / dd) * push, py = ((a.y - e.y) / dd) * push;
                        if (!circleHitsWalls(a.x + px, a.y, a.r)) a.x += px;
                        if (!circleHitsWalls(a.x, a.y + py, a.r)) a.y += py;
                    }
                }
            }

            function fireEnemyWeapon(e, target) {
                const baseAngle = Math.atan2(target.y - e.y, target.x - e.x);
                function makeShot(angle, dmg, speed, r, color, glow) {
                    enemyBullets.push({
                        x: e.x + Math.cos(angle) * e.r,
                        y: e.y + Math.sin(angle) * e.r,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        r, life: 150, damage: dmg, color, glow
                    });
                }
                if (e.type === 'pistol') {
                    const spread = (Math.random() - 0.5) * 0.14;
                    makeShot(baseAngle + spread, e.dmg, e.bulletSpeed, 4, '#ff8888', '#ff2222');
                } else if (e.type === 'smg') {
                    const spread = (Math.random() - 0.5) * 0.28;
                    makeShot(baseAngle + spread, e.dmg, e.bulletSpeed, 3, '#ffcc44', '#ff8800');
                } else if (e.type === 'shotgun') {
                    for (let k = -1; k <= 1; k++) {
                        const a = baseAngle + k * 0.22 + (Math.random() - 0.5) * 0.06;
                        makeShot(a, e.dmg, e.bulletSpeed, 4, '#cc66ff', '#aa22ff');
                    }
                } else if (e.type === 'sniper') {
                    makeShot(baseAngle, e.dmg, e.bulletSpeed, 5, '#66ffcc', '#00ff88');
                    for (let k = 0; k < 8; k++) {
                        particles.push({
                            x: e.x + Math.cos(baseAngle) * (e.r + k * 8),
                            y: e.y + Math.sin(baseAngle) * (e.r + k * 8),
                            vx: 0, vy: 0, life: 10, maxLife: 10,
                            color: '#66ffcc', size: 2, glow: true
                        });
                    }
                }
            }

            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                const b = enemyBullets[i];
                b.x += b.vx; b.y += b.vy; b.life--;
                if (b.life <= 0 || b.x < 0 || b.x > W || b.y < 0 || b.y > H ||
                    circleHitsWalls(b.x, b.y, b.r)) {
                    explode(b.x, b.y, b.color || '#ff44ff', 4, 3);
                    enemyBullets.splice(i, 1);
                    continue;
                }
                if (dist(b, player) < b.r + player.r) {
                    damagePlayer(b.damage || 10);
                    explode(b.x, b.y, b.color || '#ff44ff', 8, 4);
                    enemyBullets.splice(i, 1);
                    continue;
                }
                let hitAlly = false;
                for (const a of allies) {
                    if (dist(b, a) < b.r + a.r) {
                        a.hp -= (b.damage || 10);
                        a.hitFlash = 8;
                        explode(b.x, b.y, b.color || '#ff44ff', 6, 4);
                        enemyBullets.splice(i, 1);
                        hitAlly = true;
                        break;
                    }
                }
                if (hitAlly) continue;
            }

            for (let i = allies.length - 1; i >= 0; i--) {
                if (allies[i].hp <= 0) {
                    explode(allies[i].x, allies[i].y, '#66ff99', 20, 6);
                    allies.splice(i, 1);
                }
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                for (let j = bullets.length - 1; j >= 0; j--) {
                    const b = bullets[j];
                    if (b.hitList && b.hitList.includes(e)) continue;
                    if (Math.hypot(b.x - e.x, b.y - e.y) < e.r + b.r) {
                        e.hp -= b.damage || 1;
                        e.hitFlash = 5;
                        if (!b.explosive) explode(b.x, b.y, b.color, 8, 5);
                        if (b.pierce || b.rail) {
                            if (!b.hitList) b.hitList = [];
                            b.hitList.push(e);
                        } else {
                            bullets.splice(j, 1);
                        }
                        if (e.hp <= 0) {
                            explode(e.x, e.y, e.color, 25, 8);
                            for (let k = 0; k < 8; k++) {
                                const a = Math.random() * Math.PI * 2;
                                bloodStains.push({
                                    x: e.x + Math.cos(a) * (10 + Math.random() * 30),
                                    y: e.y + Math.sin(a) * (10 + Math.random() * 30),
                                    r: 3 + Math.random() * 5,
                                    alpha: 0.5 + Math.random() * 0.3
                                });
                            }
                            const killValue = { pistol: 15, smg: 20, shotgun: 30, sniper: 40 }[e.type] || 15;
                            score += killValue;
                            killsThisPhase++;
                            const coinAmount = { pistol: 2, smg: 2, shotgun: 4, sniper: 5 }[e.type] || 2;
                            dropCoins(e.x, e.y, coinAmount);
                            dropHealth(e.x, e.y);
                            enemies.splice(i, 1);
                            if (b.explosive) plasmaExplosion(b.x, b.y, 80, b.damage);
                        }
                        if (!(b.pierce || b.rail)) break;
                    }
                }
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                for (let j = allyBullets.length - 1; j >= 0; j--) {
                    const b = allyBullets[j];
                    if (Math.hypot(b.x - e.x, b.y - e.y) < e.r + b.r) {
                        e.hp -= b.damage || 1;
                        e.hitFlash = 5;
                        explode(b.x, b.y, '#88ffbb', 6, 4);
                        allyBullets.splice(j, 1);
                        if (e.hp <= 0) {
                            explode(e.x, e.y, e.color, 25, 8);
                            const killValue = { pistol: 15, smg: 20, shotgun: 30, sniper: 40 }[e.type] || 15;
                            score += Math.floor(killValue * 0.6);
                            killsThisPhase++;
                            const coinAmount = { pistol: 1, smg: 1, shotgun: 2, sniper: 3 }[e.type] || 1;
                            dropCoins(e.x, e.y, coinAmount);
                            dropHealth(e.x, e.y);
                            enemies.splice(i, 1);
                        }
                        break;
                    }
                }
            }

            for (let i = explosions.length - 1; i >= 0; i--) {
                const ex = explosions[i];
                ex.life--;
                ex.radius = ex.maxRadius * (1 - ex.life / ex.maxLife);
                if (ex.life <= 0) explosions.splice(i, 1);
            }

            // ==================== AUTO-COLETA DE MOEDAS ====================
            // Todas as moedas voam direto pro jogador (não importa a distância)
            for (let i = coinDrops.length - 1; i >= 0; i--) {
                const c = coinDrops[i];
                const dd = dist(c, player) || 1;
                // Força sempre forte na direção do player
                const ax = (player.x - c.x) / dd;
                const ay = (player.y - c.y) / dd;
                const force = 1.2; // força de atração sempre alta
                c.vx += ax * force;
                c.vy += ay * force;
                // Limita a velocidade pra ficar controlado
                const sp = Math.hypot(c.vx, c.vy);
                if (sp > 18) { c.vx = c.vx / sp * 18; c.vy = c.vy / sp * 18; }

                c.x += c.vx; c.y += c.vy;
                c.vx *= 0.92; c.vy *= 0.92;
                c.life--;
                c.animPhase += 0.1;

                if (dd < player.r + c.r + 4) {
                    coins += c.value;
                    // Efeitinho
                    for (let k = 0; k < 4; k++) {
                        const a = Math.random() * Math.PI * 2;
                        particles.push({
                            x: c.x, y: c.y,
                            vx: Math.cos(a) * 2, vy: Math.sin(a) * 2 - 1,
                            life: 12, maxLife: 12,
                            color: '#ffdd00', size: 2, glow: true
                        });
                    }
                    coinDrops.splice(i, 1);
                    continue;
                }
                if (c.life <= 0) coinDrops.splice(i, 1);
            }

            // ==================== AUTO-COLETA DE CORAÇÕES ====================
            for (let i = healthDrops.length - 1; i >= 0; i--) {
                const h = healthDrops[i];
                const dd = dist(h, player) || 1;
                const ax = (player.x - h.x) / dd;
                const ay = (player.y - h.y) / dd;
                const force = 1.0;
                h.vx += ax * force;
                h.vy += ay * force;
                const sp = Math.hypot(h.vx, h.vy);
                if (sp > 15) { h.vx = h.vx / sp * 15; h.vy = h.vy / sp * 15; }

                h.x += h.vx; h.y += h.vy;
                h.vx *= 0.92; h.vy *= 0.92;
                h.life--; h.animPhase += 0.08;

                if (dd < player.r + h.r + 4) {
                    healPlayer(h.healAmount, h.x, h.y);
                    healthDrops.splice(i, 1);
                    continue;
                }
                if (h.life <= 0) healthDrops.splice(i, 1);
            }

            // ==================== AUTO-COLETA DE KITS MÉDICOS ====================
            // Kits médicos também voam pro player
            for (let i = medkits.length - 1; i >= 0; i--) {
                const m = medkits[i];
                m.animPhase += 0.05;
                m.life--;
                const dd = dist(m, player) || 1;

                // Atrai o kit para o player
                if (dd > 100) {
                    const ax = (player.x - m.x) / dd;
                    const ay = (player.y - m.y) / dd;
                    m.x += ax * 4;
                    m.y += ay * 4;
                }

                if (dd < player.r + m.r + 4) {
                    healPlayer(m.healAmount, m.x, m.y);
                    medkits.splice(i, 1);
                    continue;
                }
                if (m.life <= 0) medkits.splice(i, 1);
            }

            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                const t = floatingTexts[i];
                t.y += t.vy;
                t.vy *= 0.96;
                t.life--;
                if (t.life <= 0) floatingTexts.splice(i, 1);
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx; p.y += p.vy;
                p.vx *= 0.94; p.vy *= 0.94;
                p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }
            for (let i = bloodStains.length - 1; i >= 0; i--) {
                bloodStains[i].alpha -= 0.0006;
                if (bloodStains[i].alpha <= 0) bloodStains.splice(i, 1);
            }
            for (let i = casings.length - 1; i >= 0; i--) {
                const c = casings[i];
                c.x += c.vx; c.y += c.vy;
                c.vx *= 0.9; c.vy *= 0.9;
                c.angle += c.spin;
                c.life--;
                if (c.life <= 0) casings.splice(i, 1);
            }

            if (player.ammo === 0 && !player.reloading) startReload();

            if (phase.objective === 'killCount') {
                if (killsThisPhase >= phase.goal) gameState = 'waveComplete';
            } else if (phase.objective === 'survive') {
                if (phaseTime / 60 >= phase.goal) gameState = 'waveComplete';
            }
        }

        /* =========================================================
           LOJA
        ========================================================= */
        function openShop() {
            shopItems = [
                { id: 'damage', name: '+1 DANO', desc: 'Aumenta dano de todas as armas', cost: 40 + upgrades.damage * 20, max: 5, current: upgrades.damage, color: '#ff4444' },
                { id: 'speed', name: '+VELOCIDADE', desc: 'Move mais rápido', cost: 35 + upgrades.speed * 15, max: 5, current: upgrades.speed, color: '#44ddff' },
                { id: 'maxHp', name: '+VIDA MÁX', desc: 'Aumenta HP máximo (+25)', cost: 50 + upgrades.maxHp * 25, max: 5, current: upgrades.maxHp, color: '#ff6688' },
                { id: 'reload', name: 'RECARGA+', desc: 'Recarrega mais rápido', cost: 45 + upgrades.reload * 20, max: 3, current: upgrades.reload, color: '#ffcc44' },
                { id: 'ally', name: '+1 ALIADO', desc: 'Um aliado permanente extra', cost: 120 + upgrades.extraAlly * 80, max: 3, current: upgrades.extraAlly, color: '#66ff99' },
                { id: 'regen', name: 'REGENERA', desc: 'Recupera vida lentamente', cost: 60 + upgrades.regen * 30, max: 3, current: upgrades.regen, color: '#ff88cc' },
                { id: 'medkit', name: 'SORTE MÉDICA', desc: '+chance de dropar corações', cost: 55 + upgrades.medkitDrop * 30, max: 4, current: upgrades.medkitDrop, color: '#44ff88' },
                { id: 'magnet', name: 'ÍMÃ', desc: 'Atrai moedas e corações', cost: 30 + upgrades.magnet * 20, max: 2, current: upgrades.magnet, color: '#ffdd00' }
            ];
            const cols = 2;
            const itemW = 380, itemH = 95;
            const startX = W / 2 - itemW - 20;
            const startY = 180;
            const gap = 15;
            shopItems.forEach((it, i) => {
                const col = i % cols;
                const row = Math.floor(i / cols);
                it.x = startX + col * (itemW + gap);
                it.y = startY + row * (itemH + gap);
                it.w = itemW;
                it.h = itemH;
            });
            shopSelection = 0;
            shopTime = 0;
            gameState = 'shop';
        }

        function buyItem(i) {
            const it = shopItems[i];
            if (it.current >= it.max) return;
            if (coins < it.cost) return;

            coins -= it.cost;
            if (it.id === 'damage') upgrades.damage++;
            else if (it.id === 'speed') { upgrades.speed++; player.speed += 0.5; }
            else if (it.id === 'maxHp') { upgrades.maxHp++; player.maxHp += 25; player.hp += 25; }
            else if (it.id === 'reload') { upgrades.reload++; player.reloadTime = Math.max(20, player.reloadTime - 10); }
            else if (it.id === 'ally') {
                upgrades.extraAlly++;
                const angle = Math.random() * Math.PI * 2;
                let ax = player.x + Math.cos(angle) * 60;
                let ay = player.y + Math.sin(angle) * 60;
                if (circleHitsWalls(ax, ay, 14)) { ax = player.x + 40; ay = player.y + 40; }
                allies.push({
                    x: ax, y: ay, r: 13, speed: 4.6,
                    hp: 30, maxHp: 30, angle: 0,
                    shootCooldown: 30, fireRate: 32, range: 520,
                    dmg: 1 + Math.floor(upgrades.damage / 2), bulletSpeed: 12,
                    target: null, hitFlash: 0,
                    animPhase: Math.random() * Math.PI * 2,
                    color: '#66ff99', glow: '#00ff88',
                    strafePhase: Math.random() * Math.PI * 2
                });
            }
            else if (it.id === 'regen') upgrades.regen++;
            else if (it.id === 'medkit') upgrades.medkitDrop++;
            else if (it.id === 'magnet') upgrades.magnet++;

            it.current++;
            it.cost = it.cost + Math.floor(it.cost * 0.5);

            for (let k = 0; k < 20; k++) {
                const a = Math.random() * Math.PI * 2;
                const s = 3 + Math.random() * 6;
                particles.push({
                    x: it.x + it.w / 2, y: it.y + it.h / 2,
                    vx: Math.cos(a) * s, vy: Math.sin(a) * s,
                    life: 25, maxLife: 25,
                    color: '#00ff88', size: 3, glow: true
                });
            }
        }

        function skipShop() { nextPhase(); }

        /* =========================================================
           DRAW
        ========================================================= */
        function draw() {
            timeAccumulator += 0.016;

            if (gameState === 'menu') { drawMenu(); return; }
            if (gameState === 'shop') { drawShop(); return; }

            ctx.save();
            if (shakeTime > 0) {
                ctx.translate(
                    (Math.random() - 0.5) * shakeAmount,
                    (Math.random() - 0.5) * shakeAmount
                );
            }

            drawFloor();

            decals.forEach(d => {
                ctx.globalAlpha = d.alpha;
                ctx.fillStyle = d.hue === 'orange' ? '#ff8844' : '#44ffff';
                ctx.beginPath();
                ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;

            bloodStains.forEach(b => {
                ctx.globalAlpha = b.alpha;
                ctx.fillStyle = '#6a0000';
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;

            casings.forEach(c => {
                ctx.save();
                ctx.translate(c.x, c.y);
                ctx.rotate(c.angle);
                ctx.globalAlpha = Math.min(1, c.life / 20);
                ctx.fillStyle = '#d4a832';
                ctx.fillRect(-2, -1, 4, 2);
                ctx.restore();
            });
            ctx.globalAlpha = 1;

            drawWalls();

            explosions.forEach(ex => {
                const a = ex.life / ex.maxLife;
                const grad = ctx.createRadialGradient(ex.x, ex.y, 0, ex.x, ex.y, ex.radius);
                grad.addColorStop(0, `rgba(180,100,255,${a * 0.6})`);
                grad.addColorStop(0.6, `rgba(120,50,255,${a * 0.3})`);
                grad.addColorStop(1, 'rgba(100,0,255,0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(ex.x, ex.y, ex.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            medkits.forEach(m => {
                const pulse = Math.sin(m.animPhase) * 0.5 + 0.5;
                const fade = m.life < 60 ? (Math.floor(m.life / 5) % 2 === 0 ? 0.4 : 1) : 1;
                ctx.globalAlpha = fade;
                const auraGrad = ctx.createRadialGradient(m.x, m.y, 5, m.x, m.y, m.r + 20 + pulse * 8);
                auraGrad.addColorStop(0, 'rgba(68,255,136,0.6)');
                auraGrad.addColorStop(1, 'rgba(68,255,136,0)');
                ctx.fillStyle = auraGrad;
                ctx.beginPath();
                ctx.arc(m.x, m.y, m.r + 20 + pulse * 8, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#0a3a1a';
                ctx.fillRect(m.x - m.r, m.y - m.r * 0.8, m.r * 2, m.r * 1.6);
                ctx.strokeStyle = '#44ff88';
                ctx.lineWidth = 2;
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#44ff88';
                ctx.strokeRect(m.x - m.r, m.y - m.r * 0.8, m.r * 2, m.r * 1.6);
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(m.x - 2, m.y - 7, 4, 14);
                ctx.fillRect(m.x - 7, m.y - 2, 14, 4);
                ctx.globalAlpha = 1;
            });

            healthDrops.forEach(h => {
                const pulse = Math.sin(h.animPhase) * 0.5 + 0.5;
                const bob = Math.sin(h.animPhase * 0.8) * 2;
                const auraGrad = ctx.createRadialGradient(h.x, h.y + bob, 3, h.x, h.y + bob, h.r + 12);
                auraGrad.addColorStop(0, 'rgba(255,80,120,0.7)');
                auraGrad.addColorStop(1, 'rgba(255,80,120,0)');
                ctx.fillStyle = auraGrad;
                ctx.beginPath();
                ctx.arc(h.x, h.y + bob, h.r + 12 + pulse * 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.save();
                ctx.translate(h.x, h.y + bob);
                ctx.scale(1 + pulse * 0.1, 1 + pulse * 0.1);
                ctx.fillStyle = '#ff3366';
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#ff3366';
                ctx.beginPath();
                const s = h.r;
                ctx.moveTo(0, s * 0.3);
                ctx.bezierCurveTo(-s * 1.2, -s * 0.6, -s * 0.5, -s * 1.2, 0, -s * 0.5);
                ctx.bezierCurveTo(s * 0.5, -s * 1.2, s * 1.2, -s * 0.6, 0, s * 0.3);
                ctx.closePath();
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.restore();
            });

            coinDrops.forEach(c => {
                const pulse = Math.sin(c.animPhase) * 0.5 + 0.5;
                // Rastro de brilho
                ctx.fillStyle = `rgba(255,220,0,${0.3 + pulse * 0.3})`;
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#ffdd00';
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.r + 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = `rgba(255,220,0,${0.7 + pulse * 0.3})`;
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#ffee88';
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.r * 0.6, 0, Math.PI * 2);
                ctx.fill();
            });

            particles.forEach(p => {
                const a = Math.max(0, p.life / p.maxLife);
                ctx.globalAlpha = a;
                if (p.glow) { ctx.shadowBlur = 12; ctx.shadowColor = p.color; }
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            });
            ctx.globalAlpha = 1;

            bullets.forEach(b => {
                b.trail.forEach((t, i) => {
                    ctx.globalAlpha = (i / b.trail.length) * (b.rail ? 0.7 : 0.4);
                    ctx.fillStyle = b.color;
                    ctx.beginPath();
                    ctx.arc(t.x, t.y, b.r * (b.rail ? 1 : 0.7), 0, Math.PI * 2);
                    ctx.fill();
                });
                ctx.globalAlpha = 1;
                ctx.fillStyle = b.color;
                ctx.shadowBlur = 20;
                ctx.shadowColor = b.glow;
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.r * 0.4, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            });

            allyBullets.forEach(b => {
                ctx.fillStyle = b.color;
                ctx.shadowBlur = 14;
                ctx.shadowColor = b.glow;
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            });

            enemyBullets.forEach(b => {
                ctx.fillStyle = b.color;
                ctx.shadowBlur = 15;
                ctx.shadowColor = b.glow || b.color;
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.r * 0.4, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            });

            enemies.forEach(e => drawEnemy(e));
            allies.forEach(a => drawAlly(a));
            drawPlayer();

            floatingTexts.forEach(t => {
                const alpha = Math.min(1, t.life / 20);
                ctx.globalAlpha = alpha;
                ctx.fillStyle = t.color;
                ctx.font = 'bold 20px Arial';
                ctx.textAlign = 'center';
                ctx.shadowBlur = 12;
                ctx.shadowColor = t.color;
                ctx.fillText(t.text, t.x, t.y);
                ctx.shadowBlur = 0;
                ctx.globalAlpha = 1;
            });

            drawLighting();
            drawCrosshair();
            ctx.restore();

            drawScreenFX();
            drawHUD();
            drawOverlays();
        }

        function drawFloor() {
            ctx.fillStyle = '#141414';
            ctx.fillRect(0, 0, W, H);
            ctx.strokeStyle = 'rgba(255,255,255,0.025)';
            ctx.lineWidth = 1;
            for (let x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
            for (let y = 0; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
        }

        function drawWalls() {
            walls.forEach(w => {
                const isPillar = w.type === 'pillar';
                const isBorder = w.type === 'border';
                ctx.fillStyle = 'rgba(0,0,0,0.65)';
                ctx.fillRect(w.x + 6, w.y + 6, w.w, w.h);
                if (isBorder) ctx.fillStyle = '#0e0e0e';
                else if (isPillar) ctx.fillStyle = '#3a2a1c';
                else ctx.fillStyle = '#2a2a2e';
                ctx.fillRect(w.x, w.y, w.w, w.h);
                ctx.fillStyle = isBorder ? '#1a1a1e' : isPillar ? '#5a4030' : '#3d3d44';
                ctx.fillRect(w.x, w.y, w.w, 4);
                ctx.fillStyle = isBorder ? '#050505' : isPillar ? '#2a1e12' : '#1e1e22';
                ctx.fillRect(w.x + w.w - 3, w.y, 3, w.h);
                if (!isBorder) {
                    ctx.strokeStyle = isPillar ? 'rgba(255,140,0,0.35)' : 'rgba(120,180,255,0.25)';
                    ctx.lineWidth = 1.5;
                    ctx.strokeRect(w.x + 0.5, w.y + 0.5, w.w - 1, w.h - 1);
                }
            });
        }

        function drawEnemy(e) {
            ctx.save();
            ctx.translate(e.x, e.y);
            const pulse = Math.sin(e.animPhase * 0.5) * 0.3 + 0.7;
            const auraR = e.r + 10 + pulse * 6;
            const auraGrad = ctx.createRadialGradient(0, 0, e.r * 0.5, 0, 0, auraR);
            auraGrad.addColorStop(0, `${e.glow}cc`);
            auraGrad.addColorStop(0.6, `${e.glow}44`);
            auraGrad.addColorStop(1, `${e.glow}00`);
            ctx.fillStyle = auraGrad;
            ctx.beginPath();
            ctx.arc(0, 0, auraR, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = e.glow;
            ctx.lineWidth = 2;
            ctx.shadowBlur = 20;
            ctx.shadowColor = e.glow;
            ctx.beginPath();
            ctx.arc(0, 0, e.r + 4, 0, Math.PI * 2);
            ctx.stroke();
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(0,0,0,0.55)';
            ctx.beginPath();
            ctx.ellipse(3, 4, e.r + 3, e.r * 0.75, 0, 0, Math.PI * 2);
            ctx.fill();
            if (e.spawnFade > 0) ctx.globalAlpha = 1 - e.spawnFade / 30;
            ctx.rotate(e.angle);
            const isHit = e.hitFlash > 0;
            const color = isHit ? '#ffffff' : e.color;
            ctx.shadowBlur = isHit ? 25 : 15;
            ctx.shadowColor = e.glow;
            ctx.fillStyle = color;
            ctx.beginPath();
            if (e.type === 'shotgun') {
                for (let k = 0; k < 6; k++) {
                    const a = (k / 6) * Math.PI * 2 + Math.PI / 6;
                    const px = Math.cos(a) * e.r, py = Math.sin(a) * e.r;
                    if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                }
                ctx.closePath(); ctx.fill();
            } else if (e.type === 'sniper') {
                ctx.moveTo(e.r, 0); ctx.lineTo(0, e.r); ctx.lineTo(-e.r, 0); ctx.lineTo(0, -e.r);
                ctx.closePath(); ctx.fill();
            } else {
                ctx.arc(0, 0, e.r, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.shadowBlur = 0;
            ctx.strokeStyle = 'rgba(0,0,0,0.5)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 0, e.r * 0.75, 0, Math.PI * 2);
            ctx.stroke();
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(e.r - 3, -3, 16, 6);
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(0, 0, e.r * 0.4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ff2200';
            ctx.beginPath();
            ctx.arc(e.r * 0.15, 0, e.r * 0.15, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            if (e.hp < e.maxHp) {
                const w = e.r * 2;
                ctx.fillStyle = 'rgba(0,0,0,0.75)';
                ctx.fillRect(e.x - e.r, e.y - e.r - 12, w, 5);
                const hpr = e.hp / e.maxHp;
                const grad = ctx.createLinearGradient(e.x - e.r, 0, e.x + e.r, 0);
                grad.addColorStop(0, hpr > 0.5 ? '#44ff88' : hpr > 0.25 ? '#ffaa00' : '#ff2222');
                grad.addColorStop(1, hpr > 0.5 ? '#88ffaa' : hpr > 0.25 ? '#ffcc44' : '#ff6666');
                ctx.fillStyle = grad;
                ctx.fillRect(e.x - e.r, e.y - e.r - 12, w * hpr, 5);
            }
        }

        function drawAlly(a) {
            ctx.save();
            ctx.translate(a.x, a.y);
            const pulse = Math.sin(a.animPhase * 0.6) * 0.3 + 0.7;
            const auraR = a.r + 12 + pulse * 6;
            const auraGrad = ctx.createRadialGradient(0, 0, a.r * 0.5, 0, 0, auraR);
            auraGrad.addColorStop(0, 'rgba(102,255,153,0.6)');
            auraGrad.addColorStop(1, 'rgba(0,255,136,0)');
            ctx.fillStyle = auraGrad;
            ctx.beginPath();
            ctx.arc(0, 0, auraR, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#00ff88';
            ctx.lineWidth = 2;
            ctx.shadowBlur = 18;
            ctx.shadowColor = '#00ff88';
            ctx.beginPath();
            ctx.arc(0, 0, a.r + 3, 0, Math.PI * 2);
            ctx.stroke();
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(0,0,0,0.55)';
            ctx.beginPath();
            ctx.ellipse(3, 4, a.r + 3, a.r * 0.75, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.rotate(a.angle);
            const isHit = a.hitFlash > 0;
            ctx.shadowBlur = isHit ? 25 : 15;
            ctx.shadowColor = '#00ff88';
            ctx.fillStyle = isHit ? '#ffffff' : '#66ff99';
            ctx.beginPath();
            ctx.arc(0, 0, a.r, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = 'rgba(0,60,30,0.7)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 0, a.r * 0.75, 0, Math.PI * 2);
            ctx.stroke();
            ctx.fillStyle = '#0a1a10';
            ctx.fillRect(a.r - 3, -3, 14, 6);
            ctx.fillStyle = '#0a3a1a';
            ctx.beginPath();
            ctx.arc(0, 0, a.r * 0.4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#aaffcc';
            ctx.beginPath();
            ctx.moveTo(a.r * 0.4, 0);
            ctx.lineTo(-a.r * 0.2, -a.r * 0.3);
            ctx.lineTo(-a.r * 0.2, a.r * 0.3);
            ctx.closePath();
            ctx.fill();
            ctx.restore();

            const w = a.r * 2;
            ctx.fillStyle = 'rgba(0,0,0,0.75)';
            ctx.fillRect(a.x - a.r, a.y - a.r - 12, w, 5);
            const hpr = a.hp / a.maxHp;
            const grad = ctx.createLinearGradient(a.x - a.r, 0, a.x + a.r, 0);
            grad.addColorStop(0, '#00ff88');
            grad.addColorStop(1, '#88ffcc');
            ctx.fillStyle = grad;
            ctx.fillRect(a.x - a.r, a.y - a.r - 12, w * hpr, 5);
        }

        function drawPlayer() {
            const px = player.x, py = player.y;
            const r = player.r;
            const wp = getWeapon();

            if (healFlash > 0) {
                const a = healFlash / 20;
                const healGrad = ctx.createRadialGradient(px, py, r * 0.5, px, py, r + 40);
                healGrad.addColorStop(0, `rgba(68,255,136,${a * 0.6})`);
                healGrad.addColorStop(1, 'rgba(68,255,136,0)');
                ctx.fillStyle = healGrad;
                ctx.beginPath();
                ctx.arc(px, py, r + 40, 0, Math.PI * 2);
                ctx.fill();
            }

            const auraGrad = ctx.createRadialGradient(px, py, r * 0.5, px, py, r + 18);
            auraGrad.addColorStop(0, 'rgba(68,221,255,0.5)');
            auraGrad.addColorStop(1, 'rgba(68,221,255,0)');
            ctx.fillStyle = auraGrad;
            ctx.beginPath();
            ctx.arc(px, py, r + 18, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = 'rgba(0,0,0,0.55)';
            ctx.beginPath();
            ctx.ellipse(px + 4, py + 5, r + 4, r * 0.75, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.save();
            ctx.translate(px, py);
            if (playerInvuln > 0 && Math.floor(playerInvuln / 4) % 2 === 0) ctx.globalAlpha = 0.4;
            if (playerInvuln > 0) {
                ctx.strokeStyle = 'rgba(68,221,255,0.6)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(0, 0, r + 4, 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.rotate(player.angle);
            const rec = player.recoil;

            ctx.fillStyle = '#1a1a1a';
            if (wp.name === 'ESCOPETA') {
                ctx.fillRect(r - 3 - rec, -5, 24, 10);
                ctx.fillStyle = wp.color;
                ctx.fillRect(r + 16 - rec, -4, 6, 8);
            } else if (wp.name === 'RIFLE' || wp.name === 'RAILGUN') {
                ctx.fillRect(r - 3 - rec, -3, wp.name === 'RAILGUN' ? 32 : 26, 6);
                ctx.fillStyle = '#444';
                ctx.fillRect(r + 8 - rec, -5, 8, 10);
                ctx.fillStyle = wp.color;
                ctx.fillRect(r + 22 - rec, -2, 6, 4);
            } else if (wp.name === 'LASER' || wp.name === 'PLASMA') {
                ctx.fillRect(r - 3 - rec, -5, 24, 10);
                ctx.fillStyle = wp.color;
                ctx.shadowBlur = 20;
                ctx.shadowColor = wp.glow;
                ctx.fillRect(r + 16 - rec, -4, 10, 8);
                ctx.shadowBlur = 0;
            } else if (wp.name === 'SMG' || wp.name === 'MINIGUN') {
                ctx.fillRect(r - 3 - rec, -4, wp.name === 'MINIGUN' ? 26 : 20, 8);
                ctx.fillStyle = '#333';
                ctx.fillRect(r + 8 - rec, 2, 6, 8);
                ctx.fillStyle = wp.color;
                ctx.fillRect(r + 14 - rec, -3, 8, 6);
            } else if (wp.name === 'DUAL PISTOLS') {
                ctx.fillRect(r - 3 - rec, -8, 20, 5);
                ctx.fillRect(r - 3 - rec, 3, 20, 5);
                ctx.fillStyle = wp.color;
                ctx.fillRect(r + 14 - rec, -7, 5, 4);
                ctx.fillRect(r + 14 - rec, 4, 5, 4);
            } else if (wp.name === 'CANHÃO') {
                ctx.fillRect(r - 3 - rec, -8, 28, 16);
                ctx.fillStyle = '#2a2a2a';
                ctx.fillRect(r + 22 - rec, -7, 8, 14);
                ctx.fillStyle = wp.color;
                ctx.fillRect(r + 28 - rec, -6, 4, 12);
            } else {
                ctx.fillRect(r - 3 - rec, -4, 22, 8);
                ctx.fillStyle = '#4a4a4a';
                ctx.fillRect(r + 13 - rec, -3, 8, 6);
            }

            ctx.shadowBlur = 20;
            ctx.shadowColor = '#00aaff';
            ctx.fillStyle = '#44ddff';
            ctx.beginPath();
            ctx.arc(-rec * 0.5, 0, r, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.strokeStyle = 'rgba(0,40,80,0.7)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(-rec * 0.5, 0, r * 0.75, 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = '#0066aa';
            ctx.beginPath();
            ctx.arc(-rec * 0.5, 0, r * 0.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#aaffff';
            ctx.beginPath();
            ctx.moveTo(r * 0.4 - rec * 0.5, 0);
            ctx.lineTo(-r * 0.2 - rec * 0.5, -r * 0.3);
            ctx.lineTo(-r * 0.2 - rec * 0.5, r * 0.3);
            ctx.closePath();
            ctx.fill();

            if (muzzleFlash > 0) {
                const size = (wp.pellets > 1 ? 14 : wp.damage >= 4 ? 16 : 10) + (muzzleFlash * 2);
                const grad = ctx.createRadialGradient(r + 18 - rec, 0, 0, r + 18 - rec, 0, size);
                grad.addColorStop(0, 'rgba(255,255,200,0.95)');
                grad.addColorStop(0.5, wp.color);
                grad.addColorStop(1, 'rgba(255,100,0,0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(r + 18 - rec, 0, size, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
            ctx.globalAlpha = 1;
        }

        function drawLighting() {
            lctx.globalCompositeOperation = 'source-over';
            lctx.fillStyle = `rgba(0,0,0,${DARKNESS})`;
            lctx.fillRect(0, 0, W, H);
            lctx.globalCompositeOperation = 'destination-out';

            const pl = lctx.createRadialGradient(player.x, player.y, 30, player.x, player.y, PLAYER_LIGHT_R);
            pl.addColorStop(0, 'rgba(0,0,0,1)');
            pl.addColorStop(0.5, 'rgba(0,0,0,0.75)');
            pl.addColorStop(1, 'rgba(0,0,0,0)');
            lctx.fillStyle = pl;
            lctx.beginPath();
            lctx.arc(player.x, player.y, PLAYER_LIGHT_R, 0, Math.PI * 2);
            lctx.fill();

            enemies.forEach(e => {
                const el = lctx.createRadialGradient(e.x, e.y, 10, e.x, e.y, ENEMY_LIGHT_R);
                el.addColorStop(0, 'rgba(0,0,0,1)');
                el.addColorStop(0.6, 'rgba(0,0,0,0.7)');
                el.addColorStop(1, 'rgba(0,0,0,0)');
                lctx.fillStyle = el;
                lctx.beginPath();
                lctx.arc(e.x, e.y, ENEMY_LIGHT_R, 0, Math.PI * 2);
                lctx.fill();
            });

            allies.forEach(a => {
                const al = lctx.createRadialGradient(a.x, a.y, 10, a.x, a.y, ALLY_LIGHT_R);
                al.addColorStop(0, 'rgba(0,0,0,1)');
                al.addColorStop(0.6, 'rgba(0,0,0,0.7)');
                al.addColorStop(1, 'rgba(0,0,0,0)');
                lctx.fillStyle = al;
                lctx.beginPath();
                lctx.arc(a.x, a.y, ALLY_LIGHT_R, 0, Math.PI * 2);
                lctx.fill();
            });

            ctx.drawImage(lightCanvas, 0, 0);
        }

        function drawCrosshair() {
            const mx = mouse.x, my = mouse.y;
            const pulse = Math.sin(timeAccumulator * 6) * 0.5 + 0.5;
            ctx.save();
            ctx.translate(mx, my);
            ctx.strokeStyle = 'rgba(255,50,50,0.9)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(0, 0, 11, 0, Math.PI * 2);
            ctx.stroke();
            ctx.strokeStyle = `rgba(255,80,80,${0.4 + pulse * 0.4})`;
            ctx.beginPath();
            ctx.arc(0, 0, 15 + pulse * 2, 0, Math.PI * 2);
            ctx.stroke();
            ctx.strokeStyle = '#ff3333';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-18, 0); ctx.lineTo(-6, 0);
            ctx.moveTo(6, 0); ctx.lineTo(18, 0);
            ctx.moveTo(0, -18); ctx.lineTo(0, -6);
            ctx.moveTo(0, 6); ctx.lineTo(0, 18);
            ctx.stroke();
            ctx.restore();
        }

        function drawScreenFX() {
            const vig = ctx.createRadialGradient(W / 2, H / 2, H * 0.4, W / 2, H / 2, H * 0.95);
            vig.addColorStop(0, 'rgba(0,0,0,0)');
            vig.addColorStop(1, 'rgba(0,0,0,0.5)');
            ctx.fillStyle = vig;
            ctx.fillRect(0, 0, W, H);

            scanlineOffset = (scanlineOffset + 0.5) % 4;
            ctx.globalAlpha = 0.04;
            ctx.fillStyle = '#000';
            for (let y = -4; y < H; y += 4) ctx.fillRect(0, y + scanlineOffset, W, 1);
            ctx.globalAlpha = 1;

            if (playerInvuln > 25) {
                const a = (playerInvuln - 25) / 5 * 0.25;
                ctx.fillStyle = `rgba(255,0,0,${a})`;
                ctx.fillRect(0, 0, W, H);
            }

            if (healFlash > 0) {
                const a = (healFlash / 20) * 0.2;
                ctx.fillStyle = `rgba(68,255,136,${a})`;
                ctx.fillRect(0, 0, W, H);
            }
        }

        function drawHUD() {
            const phase = PHASES[currentPhase];
            const wp = getWeapon();

            const barW = 260, barH = 22;
            const barX = 40, barY = H - 55;

            ctx.fillStyle = 'rgba(0,0,0,0.75)';
            ctx.fillRect(barX - 6, barY - 6, barW + 12, barH + 12);
            ctx.strokeStyle = 'rgba(255,80,80,0.4)';
            ctx.strokeRect(barX - 6.5, barY - 6.5, barW + 13, barH + 13);
            ctx.fillStyle = '#2a0000';
            ctx.fillRect(barX, barY, barW, barH);
            const hp = Math.max(0, player.hp) / player.maxHp;
            const grad = ctx.createLinearGradient(barX, 0, barX + barW, 0);
            grad.addColorStop(0, '#ff1111');
            grad.addColorStop(1, '#ff6666');
            ctx.fillStyle = grad;
            ctx.shadowBlur = 12;
            ctx.shadowColor = '#ff0000';
            ctx.fillRect(barX, barY, barW * hp, barH);
            ctx.shadowBlur = 0;
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.strokeRect(barX, barY, barW, barH);

            ctx.fillStyle = '#fff';
            ctx.font = 'bold 13px Arial';
            ctx.textAlign = 'left';
            ctx.fillText('VIDA  ' + Math.ceil(player.hp) + ' / ' + player.maxHp, barX + 10, barY + 16);

            const ammoY = barY - 34;
            ctx.fillStyle = 'rgba(0,0,0,0.75)';
            ctx.fillRect(barX - 6, ammoY - 6, barW + 12, 24);
            ctx.strokeStyle = wp.color;
            ctx.strokeRect(barX - 6.5, ammoY - 6.5, barW + 13, 25);

            if (player.reloading) {
                ctx.fillStyle = '#3a2200';
                ctx.fillRect(barX, ammoY, barW, 14);
                const t = 1 - player.reloadTimer / player.reloadTime;
                ctx.fillStyle = '#ffaa00';
                ctx.fillRect(barX, ammoY, barW * t, 14);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 11px Arial';
                ctx.fillText('RECARREGANDO...', barX + 8, ammoY + 11);
            } else {
                ctx.fillStyle = '#1a1a1a';
                ctx.fillRect(barX, ammoY, barW, 14);
                const a = player.ammo / player.maxAmmo;
                ctx.fillStyle = a > 0.3 ? wp.color : '#ff5500';
                ctx.fillRect(barX, ammoY, barW * a, 14);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 11px Arial';
                ctx.fillText(player.ammo + ' / ' + player.maxAmmo, barX + 8, ammoY + 11);
            }

            const wX = barX + barW + 20;
            const wY = H - 55;
            ctx.fillStyle = 'rgba(0,0,0,0.75)';
            ctx.fillRect(wX - 4, wY - 6, 200, 52);
            ctx.strokeStyle = wp.color;
            ctx.lineWidth = 1;
            ctx.strokeRect(wX - 4.5, wY - 6.5, 201, 53);

            ctx.fillStyle = wp.color;
            ctx.font = 'bold 16px Arial';
            ctx.fillText(wp.name, wX, wY + 12);
            ctx.fillStyle = '#999';
            ctx.font = '11px Arial';
            ctx.fillText(wp.desc, wX, wY + 30);

            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(28, 28, 340, 80);
            ctx.strokeStyle = 'rgba(255,170,0,0.4)';
            ctx.lineWidth = 1;
            ctx.strokeRect(28.5, 28.5, 339, 79);

            ctx.fillStyle = '#ffa500';
            ctx.font = 'bold 18px Arial';
            ctx.fillText(phase.name, 40, 52);

            ctx.fillStyle = '#999';
            ctx.font = '12px Arial';
            ctx.fillText(phase.desc, 40, 72);

            const progW = 316, progH = 14;
            const progX = 40, progY = 82;
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(progX, progY, progW, progH);

            let progRatio, progText;
            if (phase.objective === 'killCount') {
                progRatio = Math.min(1, killsThisPhase / phase.goal);
                progText = killsThisPhase + ' / ' + phase.goal + ' abates';
            } else {
                progRatio = Math.min(1, (phaseTime / 60) / phase.goal);
                progText = Math.floor(phaseTime / 60) + 's / ' + phase.goal + 's';
            }

            ctx.fillStyle = '#00cc44';
            ctx.fillRect(progX, progY, progW * progRatio, progH);
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 11px Arial';
            ctx.fillText(progText, progX + 8, progY + 11);

            ctx.textAlign = 'right';
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(W - 260, 28, 232, 110);
            ctx.strokeStyle = 'rgba(255,170,0,0.4)';
            ctx.strokeRect(W - 260.5, 28.5, 231, 109);

            ctx.fillStyle = '#ffa500';
            ctx.font = 'bold 28px Arial';
            ctx.fillText('SCORE ' + score, W - 40, 58);

            ctx.fillStyle = '#ffdd00';
            ctx.font = 'bold 22px Arial';
            ctx.fillText('$ ' + coins, W - 40, 90);

            ctx.fillStyle = '#ffcc00';
            ctx.font = 'bold 13px Arial';
            ctx.fillText('FASE ' + (currentPhase + 1) + ' / ' + PHASES.length, W - 40, 112);

            ctx.fillStyle = 'rgba(255,110,110,0.9)';
            ctx.font = '12px Arial';
            ctx.fillText('Inimigos: ' + enemies.length, W - 40, 130);

            if (allies.length > 0) {
                const aX = W - 200;
                const aY = H - 55;
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(aX - 6, aY - 6, 172, 42);
                ctx.strokeStyle = 'rgba(0,255,136,0.5)';
                ctx.strokeRect(aX - 6.5, aY - 6.5, 173, 43);
                ctx.textAlign = 'left';
                ctx.fillStyle = '#00ff88';
                ctx.font = 'bold 13px Arial';
                ctx.fillText('ALIADOS', aX + 2, aY + 12);
                for (let i = 0; i < allies.length; i++) {
                    ctx.fillStyle = '#66ff99';
                    ctx.beginPath();
                    ctx.arc(aX + 8 + i * 22, aY + 25, 6, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        function drawOverlays() {
            if (banner > 0) {
                const alpha = Math.min(1, banner / 40);
                ctx.globalAlpha = alpha;
                const grad = ctx.createLinearGradient(0, H / 2 - 90, 0, H / 2 + 50);
                grad.addColorStop(0, 'rgba(0,0,0,0)');
                grad.addColorStop(0.5, 'rgba(0,0,0,0.85)');
                grad.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = grad;
                ctx.fillRect(0, H / 2 - 90, W, 140);
                ctx.fillStyle = '#ffa500';
                ctx.font = 'bold 62px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(bannerText, W / 2, H / 2 + 18);
                ctx.globalAlpha = 1;
            }

            if (gameState === 'waveComplete') {
                ctx.fillStyle = 'rgba(0,10,5,0.85)';
                ctx.fillRect(0, 0, W, H);
                ctx.fillStyle = '#00ff88';
                ctx.font = 'bold 64px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('FASE COMPLETA!', W / 2, H / 2 - 90);
                ctx.fillStyle = '#fff';
                ctx.font = '26px Arial';
                ctx.fillText('Score: ' + score, W / 2, H / 2 - 30);
                ctx.fillStyle = '#ffdd00';
                ctx.font = 'bold 28px Arial';
                ctx.fillText('$ ' + coins, W / 2, H / 2 + 10);

                const next = PHASES[currentPhase + 1];
                if (next) {
                    ctx.fillStyle = '#ffa500';
                    ctx.font = '20px Arial';
                    ctx.fillText('Próxima: ' + next.name, W / 2, H / 2 + 60);
                    ctx.fillStyle = '#aaa';
                    ctx.font = '20px Arial';
                    ctx.fillText('ENTER para abrir a LOJA', W / 2, H / 2 + 130);
                } else {
                    ctx.fillStyle = '#ffa500';
                    ctx.font = '22px Arial';
                    ctx.fillText('ENTER para finalizar', W / 2, H / 2 + 100);
                }
            }

            if (gameState === 'paused') {
                ctx.fillStyle = 'rgba(0,0,0,0.8)';
                ctx.fillRect(0, 0, W, H);
                ctx.fillStyle = '#ffa500';
                ctx.font = 'bold 60px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('PAUSADO', W / 2, H / 2);
                ctx.fillStyle = '#aaa';
                ctx.font = '18px Arial';
                ctx.fillText('P ou ESC para continuar', W / 2, H / 2 + 44);
            }

            if (gameState === 'gameOver') {
                ctx.fillStyle = 'rgba(40,0,0,0.85)';
                ctx.fillRect(0, 0, W, H);
                ctx.fillStyle = '#ff2222';
                ctx.font = 'bold 72px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('VOCÊ MORREU', W / 2, H / 2 - 40);
                ctx.fillStyle = '#fff';
                ctx.font = '28px Arial';
                ctx.fillText('Score: ' + score, W / 2, H / 2 + 45);
                ctx.fillText('Fase alcançada: ' + (currentPhase + 1) + ' / ' + PHASES.length, W / 2, H / 2 + 85);
                ctx.fillStyle = '#ffa500';
