            if (wp.name === 'ESCOPETA') {
                ctx.fillStyle = '#1a1a1a';
                ctx.fillRect(r - 2, -6, 30, 5);
                ctx.fillRect(r - 2, 1, 30, 5);
                ctx.fillStyle = '#2a2a2a';
                ctx.fillRect(r - 4, -7, 6, 14);
                ctx.fillStyle = wp.color;
                ctx.shadowBlur = 12;
                ctx.shadowColor = wp.glow;
                ctx.fillRect(r + 26, -5, 4, 3);
                ctx.fillRect(r + 26, 2, 4, 3);
                ctx.shadowBlur = 0;
            } else if (wp.name === 'RIFLE' || wp.name === 'RAILGUN') {
                ctx.fillStyle = '#1a1a1a';
                ctx.fillRect(r - 2, -4, 34, 8);
                ctx.fillStyle = '#2a2a2a';
                ctx.fillRect(r + 4, -7, 12, 14);
                ctx.fillStyle = '#0a0a0a';
                ctx.fillRect(r + 24, -3, 12, 6);
                ctx.fillStyle = '#444';
                ctx.fillRect(r + 8, -9, 8, 3);
                ctx.fillRect(r + 8, 6, 8, 3);
                ctx.fillStyle = wp.color;
                ctx.shadowBlur = 15;
                ctx.shadowColor = wp.glow;
                ctx.beginPath();
                ctx.arc(r + 34, 0, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#2a2a2a';
                ctx.fillRect(r + 4, 5, 6, 10);
            } else if (wp.name === 'LASER' || wp.name === 'PLASMA') {
                ctx.fillStyle = '#1a1a1a';
                ctx.fillRect(r - 2, -5, 28, 10);
                ctx.fillStyle = '#2a2a2a';
                ctx.fillRect(r + 4, -7, 10, 14);
                ctx.fillStyle = wp.color;
                ctx.shadowBlur = 25;
                ctx.shadowColor = wp.glow;
                ctx.beginPath();
                ctx.arc(r + 18, 0, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(r + 18, 0, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#1a1a1a';
                ctx.fillRect(r + 22, -4, 8, 8);
            } else if (wp.name === 'SMG' || wp.name === 'MINIGUN') {
                ctx.fillStyle = '#1a1a1a';
                ctx.fillRect(r - 2, -4, wp.name === 'MINIGUN' ? 32 : 24, 8);
                ctx.fillStyle = '#2a2a2a';
                ctx.fillRect(r + 6, 2, 8, 10);
                ctx.fillStyle = '#333';
                ctx.fillRect(r + 12, -6, 8, 12);
                ctx.fillStyle = wp.color;
                ctx.shadowBlur = 12;
                ctx.shadowColor = wp.glow;
                ctx.fillRect(r + (wp.name === 'MINIGUN' ? 28 : 20), -3, 6, 6);
                ctx.shadowBlur = 0;
            } else if (wp.name === 'DUAL PISTOLS') {
                ctx.fillStyle = '#1a1a1a';
                ctx.fillRect(r - 2, -10, 22, 6);
                ctx.fillRect(r - 2, 4, 22, 6);
                ctx.fillStyle = wp.color;
                ctx.shadowBlur = 12;
                ctx.shadowColor = wp.glow;
                ctx.fillRect(r + 18, -9, 6, 4);
                ctx.fillRect(r + 18, 5, 6, 4);
                ctx.shadowBlur = 0;
            } else if (wp.name === 'CANHÃO') {
                ctx.fillStyle = '#1a1a1a';
                ctx.fillRect(r - 4, -9, 34, 18);
                ctx.fillStyle = '#0a0a0a';
                ctx.fillRect(r + 26, -8, 10, 16);
                ctx.fillStyle = '#2a2a2a';
                ctx.fillRect(r + 6, -11, 8, 22);
                ctx.fillStyle = wp.color;
                ctx.shadowBlur = 18;
                ctx.shadowColor = wp.glow;
                ctx.beginPath();
                ctx.arc(r + 34, 0, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            } else {
                ctx.fillStyle = '#1a1a1a';
                ctx.fillRect(r - 2, -4, 22, 8);
                ctx.fillStyle = '#2a2a2a';
                ctx.fillRect(r + 4, -5, 8, 10);
                ctx.fillStyle = '#4a4a4a';
                ctx.fillRect(r + 18, -3, 8, 6);
                ctx.fillStyle = wp.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = wp.glow;
                ctx.fillRect(r + 22, -2, 4, 4);
                ctx.shadowBlur = 0;
            }

            ctx.restore();

            // Braços
            ctx.fillStyle = '#1e5f88';
            ctx.beginPath(); ctx.arc(r * 0.5, 5, 5, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#0a3555'; ctx.lineWidth = 1.5; ctx.stroke();
            ctx.fillStyle = '#1e5f88';
            ctx.beginPath(); ctx.arc(r * 0.5, -5, 5, 0, Math.PI * 2); ctx.fill();
            ctx.stroke();

            // Corpo
            const bodyGrad = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
            bodyGrad.addColorStop(0, '#7fe8ff');
            bodyGrad.addColorStop(0.5, '#44ddff');
            bodyGrad.addColorStop(1, '#1a88aa');

            ctx.shadowBlur = 22;
            ctx.shadowColor = '#00aaff';
            ctx.fillStyle = bodyGrad;
            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.strokeStyle = '#003a5a';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.stroke();

            ctx.strokeStyle = 'rgba(0,40,80,0.6)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(0, 0, r * 0.75, 0, Math.PI * 2);
            ctx.stroke();

            const coreGrad = ctx.createRadialGradient(-r * 0.15, -r * 0.15, 0, 0, 0, r * 0.5);
            coreGrad.addColorStop(0, '#aaffff');
            coreGrad.addColorStop(0.5, '#0088cc');
            coreGrad.addColorStop(1, '#004466');
            ctx.fillStyle = coreGrad;
            ctx.beginPath();
            ctx.arc(0, 0, r * 0.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#aaffff';
            ctx.beginPath();
            ctx.moveTo(r * 0.4, 0);
            ctx.lineTo(-r * 0.15, -r * 0.28);
            ctx.lineTo(-r * 0.28, 0);
            ctx.lineTo(-r * 0.15, r * 0.28);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            ctx.beginPath();
            ctx.arc(-r * 0.3, -r * 0.3, r * 0.2, 0, Math.PI * 2);
            ctx.fill();

            if (muzzleFlash > 0) {
                const flashDist = r + 30;
                const size = (wp.pellets > 1 ? 18 : wp.damage >= 4 ? 20 : 12) + (muzzleFlash * 2.5);
                const grad = ctx.createRadialGradient(flashDist, 0, 0, flashDist, 0, size);
                grad.addColorStop(0, 'rgba(255,255,220,0.98)');
                grad.addColorStop(0.3, wp.color);
                grad.addColorStop(0.7, 'rgba(255,150,0,0.5)');
                grad.addColorStop(1, 'rgba(255,100,0,0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(flashDist, 0, size, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = 'rgba(255,240,150,0.9)';
                ctx.beginPath();
                for (let i = 0; i < 8; i++) {
                    const a = (i / 8) * Math.PI * 2;
                    const len = i % 2 === 0 ? size * 1.4 : size * 0.6;
                    const fx = flashDist + Math.cos(a) * len;
                    const fy = Math.sin(a) * len;
                    if (i === 0) ctx.moveTo(fx, fy); else ctx.lineTo(fx, fy);
                }
                ctx.closePath();
                ctx.fill();
            }

            ctx.restore();
            ctx.globalAlpha = 1;
        }

        function drawLighting() {
            lctx.globalCompositeOperation = 'source-over';
            lctx.fillStyle = `rgba(0,0,0,${DARKNESS})`;
            lctx.fillRect(0, 0, W, H);
            lctx.globalCompositeOperation = 'destination-out';

            const pl = lctx.createRadialGradient(player.x, player.y, 30, player.x, player.y, PLAYER_LIGHT_R);
            pl.addColorStop(0, 'rgba(0,0,0,1)');
            pl.addColorStop(0.5, 'rgba(0,0,0,0.75)');
            pl.addColorStop(1, 'rgba(0,0,0,0)');
            lctx.fillStyle = pl;
            lctx.beginPath();
            lctx.arc(player.x, player.y, PLAYER_LIGHT_R, 0, Math.PI * 2);
            lctx.fill();

            enemies.forEach(e => {
                const el = lctx.createRadialGradient(e.x, e.y, 10, e.x, e.y, ENEMY_LIGHT_R);
                el.addColorStop(0, 'rgba(0,0,0,1)');
                el.addColorStop(0.6, 'rgba(0,0,0,0.7)');
                el.addColorStop(1, 'rgba(0,0,0,0)');
                lctx.fillStyle = el;
                lctx.beginPath();
                lctx.arc(e.x, e.y, ENEMY_LIGHT_R, 0, Math.PI * 2);
                lctx.fill();
            });

            ctx.drawImage(lightCanvas, 0, 0);
        }

        function drawCrosshair() {
            const mx = mouse.x, my = mouse.y;
            ctx.save();
            ctx.translate(mx, my);
            ctx.strokeStyle = '#ff3333';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 0, 11, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(-18, 0); ctx.lineTo(-6, 0);
            ctx.moveTo(6, 0); ctx.lineTo(18, 0);
            ctx.moveTo(0, -18); ctx.lineTo(0, -6);
            ctx.moveTo(0, 6); ctx.lineTo(0, 18);
            ctx.stroke();
            ctx.restore();
        }

        function drawScreenFX() {
            const vig = ctx.createRadialGradient(W / 2, H / 2, H * 0.4, W / 2, H / 2, H * 0.95);
            vig.addColorStop(0, 'rgba(0,0,0,0)');
            vig.addColorStop(1, 'rgba(0,0,0,0.5)');
            ctx.fillStyle = vig;
            ctx.fillRect(0, 0, W, H);

            if (playerInvuln > 25) {
                const a = (playerInvuln - 25) / 5 * 0.25;
                ctx.fillStyle = `rgba(255,0,0,${a})`;
                ctx.fillRect(0, 0, W, H);
            }
        }

        function drawHUD() {
            const phase = PHASES[currentPhase];
            const wp = getWeapon();
            const theme = getTheme();

            const barW = 260, barH = 22;
            const barX = 40, barY = H - 55;

            ctx.fillStyle = 'rgba(0,0,0,0.75)';
            ctx.fillRect(barX - 6, barY - 6, barW + 12, barH + 12);
            ctx.strokeStyle = 'rgba(255,80,80,0.4)';
            ctx.strokeRect(barX - 6.5, barY - 6.5, barW + 13, barH + 13);
            ctx.fillStyle = '#2a0000';
            ctx.fillRect(barX, barY, barW, barH);
            const hp = Math.max(0, player.hp) / player.maxHp;
            ctx.fillStyle = '#ff4444';
            ctx.fillRect(barX, barY, barW * hp, barH);

            ctx.fillStyle = '#fff';
            ctx.font = 'bold 13px Arial';
            ctx.textAlign = 'left';
            ctx.fillText('VIDA ' + Math.ceil(player.hp) + '/' + player.maxHp, barX + 10, barY + 16);

            const ammoY = barY - 34;
            ctx.fillStyle = 'rgba(0,0,0,0.75)';
            ctx.fillRect(barX - 6, ammoY - 6, barW + 12, 24);
            ctx.strokeStyle = wp.color;
            ctx.strokeRect(barX - 6.5, ammoY - 6.5, barW + 13, 25);

            if (player.reloading) {
                ctx.fillStyle = '#3a2200';
                ctx.fillRect(barX, ammoY, barW, 14);
                const t = 1 - player.reloadTimer / player.reloadTime;
                ctx.fillStyle = '#ffaa00';
                ctx.fillRect(barX, ammoY, barW * t, 14);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 11px Arial';
                ctx.fillText('RECARREGANDO...', barX + 8, ammoY + 11);
            } else {
                ctx.fillStyle = '#1a1a1a';
                ctx.fillRect(barX, ammoY, barW, 14);
                const a = player.ammo / player.maxAmmo;
                ctx.fillStyle = wp.color;
                ctx.fillRect(barX, ammoY, barW * a, 14);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 11px Arial';
                ctx.fillText(player.ammo + '/' + player.maxAmmo, barX + 8, ammoY + 11);
            }

            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(28, 28, 340, 80);
            ctx.strokeStyle = theme.accent;
            ctx.globalAlpha = 0.5;
            ctx.strokeRect(28.5, 28.5, 339, 79);
            ctx.globalAlpha = 1;

            ctx.fillStyle = theme.accent;
            ctx.font = 'bold 18px Arial';
            ctx.fillText(phase.name, 40, 52);

            ctx.fillStyle = '#999';
            ctx.font = '12px Arial';
            ctx.fillText(phase.desc, 40, 72);

            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(40, 82, 316, 14);
            const progRatio = Math.min(1, killsThisPhase / phase.goal);
            ctx.fillStyle = theme.accent;
            ctx.fillRect(40, 82, 316 * progRatio, 14);
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 11px Arial';
            ctx.fillText(killsThisPhase + '/' + phase.goal, 48, 93);

            ctx.textAlign = 'right';
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(W - 260, 28, 232, 110);
            ctx.strokeStyle = theme.accent;
            ctx.globalAlpha = 0.5;
            ctx.strokeRect(W - 260.5, 28.5, 231, 109);
            ctx.globalAlpha = 1;

            ctx.fillStyle = '#ffa500';
            ctx.font = 'bold 28px Arial';
            ctx.fillText('SCORE ' + score, W - 40, 58);

            ctx.fillStyle = '#ffdd00';
            ctx.font = 'bold 22px Arial';
            ctx.fillText('$ ' + coins, W - 40, 90);

            ctx.fillStyle = '#ffcc00';
            ctx.font = 'bold 13px Arial';
            ctx.fillText('FASE ' + (currentPhase + 1) + '/' + PHASES.length, W - 40, 112);

            ctx.fillStyle = 'rgba(255,110,110,0.9)';
            ctx.font = '12px Arial';
            ctx.fillText('Inimigos: ' + enemies.length, W - 40, 130);
        }

        function drawOverlays() {
            if (banner > 0) {
                const alpha = Math.min(1, banner / 40);
                ctx.globalAlpha = alpha;
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, H / 2 - 60, W, 100);
                ctx.fillStyle = '#ffa500';
                ctx.font = 'bold 62px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(bannerText, W / 2, H / 2 + 18);
                ctx.globalAlpha = 1;
            }

            if (gameState === 'waveComplete') {
                ctx.fillStyle = 'rgba(0,10,5,0.85)';
                ctx.fillRect(0, 0, W, H);
                ctx.fillStyle = '#00ff88';
                ctx.font = 'bold 64px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('FASE COMPLETA!', W / 2, H / 2 - 90);
                ctx.fillStyle = '#fff';
                ctx.font = '26px Arial';
                ctx.fillText('Score: ' + score, W / 2, H / 2 - 30);
                ctx.fillStyle = '#ffdd00';
                ctx.font = 'bold 28px Arial';
                ctx.fillText('$ ' + coins, W / 2, H / 2 + 10);

                const next = PHASES[currentPhase + 1];
                if (next) {
                    ctx.fillStyle = '#ffa500';
                    ctx.font = '20px Arial';
                    ctx.fillText('Próxima: ' + next.name, W / 2, H / 2 + 60);
                    ctx.fillStyle = '#aaa';
                    ctx.fillText('ENTER ou CLIQUE para abrir a LOJA', W / 2, H / 2 + 130);
                } else {
                    ctx.fillStyle = '#ffa500';
                    ctx.font = '22px Arial';
                    ctx.fillText('ENTER para finalizar', W / 2, H / 2 + 100);
                }
            }

            if (gameState === 'paused') {
                ctx.fillStyle = 'rgba(0,0,0,0.8)';
                ctx.fillRect(0, 0, W, H);
                ctx.fillStyle = '#ffa500';
                ctx.font = 'bold 60px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('PAUSADO', W / 2, H / 2);
                ctx.fillStyle = '#aaa';
                ctx.font = '18px Arial';
                ctx.fillText('P ou ESC para continuar', W / 2, H / 2 + 44);
            }

            if (gameState === 'gameOver') {
                ctx.fillStyle = 'rgba(40,0,0,0.85)';
                ctx.fillRect(0, 0, W, H);
                ctx.fillStyle = '#ff2222';
                ctx.font = 'bold 72px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('VOCÊ MORREU', W / 2, H / 2 - 90);
                ctx.fillStyle = '#fff';
                ctx.font = '28px Arial';
                ctx.fillText('Score: ' + score, W / 2, H / 2 - 20);
                ctx.fillText('Fase: ' + (currentPhase + 1) + '/' + PHASES.length, W / 2, H / 2 + 20);
                ctx.fillStyle = '#ffdd00';
                ctx.font = 'bold 18px Arial';
                ctx.fillText('✓ Recorde salvo!', W / 2, H / 2 + 70);
                ctx.fillStyle = '#ffa500';
                ctx.font = '22px Arial';
                ctx.fillText('ENTER para reiniciar', W / 2, H / 2 + 130);
                ctx.fillStyle = '#888';
                ctx.font = '16px Arial';
                ctx.fillText('ESC para o menu', W / 2, H / 2 + 162);
            }

            if (gameState === 'victory') {
                ctx.fillStyle = 'rgba(0,30,15,0.88)';
                ctx.fillRect(0, 0, W, H);
                ctx.fillStyle = '#00ff88';
                ctx.font = 'bold 76px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('VITÓRIA!', W / 2, H / 2 - 90);
                ctx.fillStyle = '#fff';
                ctx.font = '26px Arial';
                ctx.fillText('Você completou as 10 fases!', W / 2, H / 2 - 20);
                ctx.fillStyle = '#ffa500';
                ctx.font = '32px Arial';
                ctx.fillText('Score final: ' + score, W / 2, H / 2 + 30);
                ctx.fillStyle = '#ffdd00';
                ctx.font = 'bold 18px Arial';
                ctx.fillText('✓ Recorde salvo!', W / 2, H / 2 + 80);
                ctx.fillStyle = '#aaa';
                ctx.font = '18px Arial';
                ctx.fillText('ENTER para jogar de novo  •  ESC para o menu', W / 2, H / 2 + 130);
            }
        }

        function drawShop() {
            ctx.fillStyle = '#0a0510';
            ctx.fillRect(0, 0, W, H);

            ctx.textAlign = 'center';
            ctx.fillStyle = '#00ff88';
            ctx.font = 'bold 52px Arial';
            ctx.fillText('LOJA', W / 2, 60);
            ctx.fillStyle = '#888';
            ctx.font = '14px Arial';
            ctx.fillText('Clique nos itens para comprar  •  ENTER para pular a loja', W / 2, 85);
            ctx.fillStyle = '#ffdd00';
            ctx.font = 'bold 30px Arial';
            ctx.fillText('$ ' + coins, W / 2, 122);

            shopItems.forEach((it, i) => {
                const canAfford = coins >= it.cost && it.current < it.max;
                const hovered = mouse.x >= it.x && mouse.x <= it.x + it.w &&
                    mouse.y >= it.y && mouse.y <= it.y + it.h;
                if (hovered) shopSelection = i;
                const isActive = i === shopSelection || hovered;

                ctx.fillStyle = isActive ? 'rgba(0,255,136,0.15)' : 'rgba(30,30,40,0.8)';
                ctx.fillRect(it.x, it.y, it.w, it.h);
                ctx.strokeStyle = isActive ? '#00ff88' : 'rgba(80,80,90,0.6)';
                ctx.lineWidth = isActive ? 3 : 2;
                ctx.strokeRect(it.x, it.y, it.w, it.h);

                ctx.textAlign = 'left';
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 20px Arial';
                ctx.fillText(it.name, it.x + 20, it.y + 34);

                ctx.fillStyle = '#999';
                ctx.font = '13px Arial';
                ctx.fillText(it.desc, it.x + 20, it.y + 56);

                ctx.fillStyle = '#666';
                ctx.font = '12px Arial';
                ctx.fillText('Nível ' + it.current + '/' + it.max, it.x + 20, it.y + 78);

                ctx.textAlign = 'right';
                ctx.fillStyle = canAfford ? '#ffdd00' : '#ff5555';
                ctx.font = 'bold 22px Arial';
                ctx.fillText('$ ' + it.cost, it.x + it.w - 20, it.y + 40);
            });

            // Botão CONTINUAR — mais visível
            const bx = W / 2 - 130, by = H - 60, bw = 260, bh = 46;
            const contBtn = { x: bx, y: by, w: bw, h: bh };
            const hoverCont = mouseOverButton(contBtn);

            ctx.fillStyle = hoverCont ? 'rgba(0,255,136,0.4)' : 'rgba(0,255,136,0.15)';
            ctx.fillRect(bx, by, bw, bh);
            ctx.strokeStyle = '#00ff88';
            ctx.lineWidth = hoverCont ? 4 : 3;
            ctx.strokeRect(bx, by, bw, bh);

            ctx.fillStyle = '#00ff88';
            ctx.font = 'bold 22px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('▶  CONTINUAR', W / 2, by + bh / 2 + 1);
            ctx.textBaseline = 'alphabetic';

            ctx.fillStyle = '#555';
            ctx.font = '12px Arial';
            ctx.fillText('ESC ou ENTER para continuar', W / 2, H - 8);
        }

        function drawRecordsScreen() {
            recordsTime++;

            const bgGrad = ctx.createLinearGradient(0, 0, W, H);
            bgGrad.addColorStop(0, '#0a0510');
            bgGrad.addColorStop(0.5, '#050508');
            bgGrad.addColorStop(1, '#100510');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, W, H);

            ctx.strokeStyle = 'rgba(255,200,50,0.04)';
            ctx.lineWidth = 1;
            const offset = (recordsTime * 0.5) % 60;
            for (let x = -60; x < W + 60; x += 60) {
                ctx.beginPath(); ctx.moveTo(x + offset, 0); ctx.lineTo(x + offset, H); ctx.stroke();
            }
            for (let y = -60; y < H + 60; y += 60) {
                ctx.beginPath(); ctx.moveTo(0, y + offset); ctx.lineTo(W, y + offset); ctx.stroke();
            }

            const glowGrad = ctx.createRadialGradient(W / 2, 80, 0, W / 2, 80, 400);
            glowGrad.addColorStop(0, 'rgba(255,200,50,0.15)');
            glowGrad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = glowGrad;
            ctx.fillRect(0, 0, W, H);

            ctx.textAlign = 'center';
            ctx.fillStyle = '#ffdd00';
            ctx.font = 'bold 54px Arial';
            ctx.shadowBlur = 25;
            ctx.shadowColor = '#ffaa00';
            ctx.fillText('🏆  RECORDES', W / 2, 70);
            ctx.shadowBlur = 0;

            ctx.fillStyle = '#888';
            ctx.font = '14px Arial';
            ctx.fillText('NIGHTFALL — Top ' + MAX_RECORDS + ' melhores partidas', W / 2, 96);

            ctx.strokeStyle = 'rgba(255,200,50,0.4)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(W / 2 - 300, 115);
            ctx.lineTo(W / 2 + 300, 115);
            ctx.stroke();

            if (records.length === 0) {
                ctx.fillStyle = '#666';
                ctx.font = 'italic 22px Arial';
                ctx.fillText('Nenhum recorde ainda...', W / 2, H / 2);
                ctx.fillStyle = '#555';
                ctx.font = '16px Arial';
                ctx.fillText('Jogue sua primeira partida para aparecer aqui!', W / 2, H / 2 + 30);
            } else {
                const tableX = W / 2 - 400;
                const tableW = 800;
                const headerY = 150;

                ctx.textAlign = 'left';
                ctx.fillStyle = '#888';
                ctx.font = 'bold 14px Arial';
                ctx.fillText('RANK', tableX + 20, headerY);
                ctx.fillText('PONTUAÇÃO', tableX + 120, headerY);
                ctx.fillText('MOEDAS', tableX + 340, headerY);
                ctx.textAlign = 'center';
                ctx.fillText('FASE ALCANÇADA', tableX + 500, headerY);
                ctx.textAlign = 'right';
                ctx.fillText('DATA', tableX + tableW - 20, headerY);

                ctx.strokeStyle = 'rgba(255,200,50,0.3)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(tableX + 10, headerY + 10);
                ctx.lineTo(tableX + tableW - 10, headerY + 10);
                ctx.stroke();

                records.forEach((r, i) => {
                    const rowY = headerY + 40 + i * 48;

                    if (i === 0) {
                        ctx.fillStyle = 'rgba(255,215,0,0.12)';
                        ctx.fillRect(tableX + 10, rowY - 18, tableW - 20, 40);
                        ctx.strokeStyle = 'rgba(255,215,0,0.5)';
                        ctx.lineWidth = 1.5;
                        ctx.strokeRect(tableX + 10, rowY - 18, tableW - 20, 40);
                    } else if (i === 1) {
                        ctx.fillStyle = 'rgba(192,192,192,0.08)';
                        ctx.fillRect(tableX + 10, rowY - 18, tableW - 20, 40);
                    } else if (i === 2) {
                        ctx.fillStyle = 'rgba(205,127,50,0.08)';
                        ctx.fillRect(tableX + 10, rowY - 18, tableW - 20, 40);
                    } else {
                        ctx.fillStyle = 'rgba(255,255,255,0.02)';
                        ctx.fillRect(tableX + 10, rowY - 18, tableW - 20, 40);
                    }

                    const medalEmojis = ['🥇', '🥈', '🥉'];
                    ctx.textAlign = 'center';
                    if (i < 3) {
                        ctx.font = '22px Arial';
                        ctx.fillText(medalEmojis[i], tableX + 40, rowY + 2);
                    } else {
                        ctx.fillStyle = '#666';
                        ctx.font = 'bold 18px Arial';
                        ctx.fillText((i + 1) + 'º', tableX + 40, rowY + 2);
                    }

                    ctx.textAlign = 'left';
                    ctx.fillStyle = i === 0 ? '#ffdd00' : (i < 3 ? '#fff' : '#aaa');
                    ctx.font = 'bold 24px Arial';
                    ctx.fillText(r.score, tableX + 120, rowY + 4);

                    ctx.fillStyle = '#ffdd00';
                    ctx.font = 'bold 18px Arial';
                    ctx.fillText('$' + r.coins, tableX + 340, rowY + 2);

                    ctx.textAlign = 'center';
                    if (r.victory) {
                        ctx.fillStyle = '#00ff88';
                        ctx.font = 'bold 18px Arial';
                        ctx.fillText('✓ VITÓRIA', tableX + 500, rowY + 2);
                    } else {
                        ctx.fillStyle = '#ff8888';
                        ctx.font = 'bold 20px Arial';
                        ctx.fillText('FASE ' + r.phase, tableX + 500, rowY + 2);
                        const barX = tableX + 460, barW = 80, barY = rowY + 12;
                        ctx.fillStyle = 'rgba(255,100,100,0.2)';
                        ctx.fillRect(barX, barY, barW, 5);
                        ctx.fillStyle = '#ff5555';
                        ctx.fillRect(barX, barY, barW * (r.phase / 10), 5);
                    }

                    ctx.textAlign = 'right';
                    ctx.fillStyle = '#666';
                    ctx.font = '14px Arial';
                    ctx.fillText(r.date, tableX + tableW - 20, rowY + 2);
                });
            }

            // Botão VOLTAR
            const btn = BUTTONS.records[0];
            const hoverBack = mouseOverButton(btn);

            ctx.fillStyle = hoverBack ? 'rgba(255,170,0,0.35)' : 'rgba(40,40,40,0.85)';
            ctx.fillRect(btn.x, btn.y, btn.w, btn.h);
            ctx.strokeStyle = hoverBack ? '#ffaa00' : '#666';
            ctx.lineWidth = hoverBack ? 4 : 2;
            ctx.strokeRect(btn.x, btn.y, btn.w, btn.h);

            ctx.fillStyle = hoverBack ? '#ffdd44' : '#aaa';
            ctx.font = 'bold 22px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('← VOLTAR', btn.x + btn.w / 2, btn.y + btn.h / 2 + 1);
            ctx.textBaseline = 'alphabetic';

            ctx.fillStyle = '#555';
            ctx.font = '12px Arial';
            ctx.fillText('ESC ou ENTER para voltar ao menu  •  Clique no botão acima', W / 2, H - 15);

            ctx.save();
            ctx.translate(mouse.x, mouse.y);
            ctx.strokeStyle = 'rgba(255,200,50,0.9)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(0, 0, 10, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(-16, 0); ctx.lineTo(-6, 0);
            ctx.moveTo(6, 0); ctx.lineTo(16, 0);
            ctx.moveTo(0, -16); ctx.lineTo(0, -6);
            ctx.moveTo(0, 6); ctx.lineTo(0, 16);
            ctx.stroke();
            ctx.restore();
        }

        function drawMenu() {
            menuTime++;

            const bgGrad = ctx.createLinearGradient(0, 0, W, H);
            bgGrad.addColorStop(0, '#05050f');
            bgGrad.addColorStop(0.5, '#0a0518');
            bgGrad.addColorStop(1, '#100510');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, W, H);

            ctx.save();
            ctx.translate(W / 2, H * 0.75);
            ctx.strokeStyle = 'rgba(120,60,255,0.15)';
            ctx.lineWidth = 1;
            for (let i = -20; i <= 20; i++) {
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(i * 60, -H * 0.75);
                ctx.stroke();
            }
            const scrollOffset = (menuTime * 2) % 60;
            for (let y = -H * 0.75; y < 200; y += 60) {
                const depth = y + scrollOffset;
                const scale = 1 + depth / 200;
                ctx.globalAlpha = Math.max(0, 1 - Math.abs(depth) / (H * 0.5));
                ctx.beginPath();
                ctx.moveTo(-W * 1.5 * scale, y + scrollOffset);
                ctx.lineTo(W * 1.5 * scale, y + scrollOffset);
                ctx.stroke();
            }
            ctx.globalAlpha = 1;
            ctx.restore();

            const vig = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.9);
            vig.addColorStop(0, 'rgba(0,0,0,0)');
            vig.addColorStop(1, 'rgba(0,0,0,0.9)');
            ctx.fillStyle = vig;
            ctx.fillRect(0, 0, W, H);

            for (let i = 0; i < 60; i++) {
                const seed = i * 137;
                const speed = 0.2 + (i % 5) * 0.08;
                const x = (seed * 7919 + menuTime * speed) % (W + 100) - 50;
                const y = (seed * 104729 + menuTime * 0.3) % (H + 100) - 50;
                const size = 0.5 + (i % 3) * 0.5;
                const alpha = 0.2 + Math.sin(menuTime * 0.03 + i) * 0.15;
                ctx.fillStyle = i % 3 === 0
                    ? `rgba(150,100,255,${alpha})`
                    : `rgba(200,150,255,${alpha})`;
                ctx.beginPath();
                ctx.arc(x, H - y, size, 0, Math.PI * 2);
                ctx.fill();
            }

            const titleY = 110;
            const pulse = Math.sin(menuTime * 0.04) * 4;

            const glowGrad = ctx.createRadialGradient(W / 2, titleY, 0, W / 2, titleY, 350);
            glowGrad.addColorStop(0, 'rgba(120,60,255,0.3)');
            glowGrad.addColorStop(0.5, 'rgba(80,30,200,0.1)');
            glowGrad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = glowGrad;
            ctx.fillRect(0, titleY - 200, W, 400);

            ctx.textAlign = 'center';

            ctx.fillStyle = 'rgba(80,40,200,0.7)';
            ctx.font = 'bold 88px Arial';
            ctx.fillText('NIGHTFALL', W / 2, titleY + pulse + 6);

            const titleGrad = ctx.createLinearGradient(0, titleY - 70, 0, titleY + 25);
            titleGrad.addColorStop(0, '#e0c8ff');
            titleGrad.addColorStop(0.4, '#a855f7');
            titleGrad.addColorStop(0.7, '#7c3aed');
            titleGrad.addColorStop(1, '#3b0764');
            ctx.fillStyle = titleGrad;
            ctx.font = 'bold 88px Arial';
            ctx.fillText('NIGHTFALL', W / 2, titleY + pulse);

            ctx.strokeStyle = 'rgba(220,190,255,0.85)';
            ctx.lineWidth = 1.5;
            ctx.strokeText('NIGHTFALL', W / 2, titleY + pulse);

            ctx.fillStyle = '#a855f7';
            ctx.font = 'bold 16px Arial';
            ctx.shadowBlur = 12;
            ctx.shadowColor = '#7c3aed';
            ctx.fillText('T Á T I C A L   A R E N A', W / 2, titleY + 32);
            ctx.shadowBlur = 0;

            ctx.strokeStyle = 'rgba(150,80,255,0.8)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(W / 2 - 180, titleY + 32);
            ctx.lineTo(W / 2 - 50, titleY + 32);
            ctx.moveTo(W / 2 + 50, titleY + 32);
            ctx.lineTo(W / 2 + 180, titleY + 32);
            ctx.stroke();

            // Desenha botões
            BUTTONS.menu.forEach((btn, i) => {
                const isHover = menuSelection === i;
                drawMenuButton(btn.x, btn.y, btn.w, btn.h, btn.label, isHover, btn.color);
            });

            ctx.fillStyle = '#555';
            ctx.font = '11px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('WASD mover   MOUSE mirar   CLIQUE atirar   R recarregar   P pausar', W / 2, H - 30);

            if (confirmClear) {
                ctx.fillStyle = 'rgba(0,0,0,0.85)';
                ctx.fillRect(0, 0, W, H);
                ctx.fillStyle = '#ff4444';
                ctx.font = 'bold 48px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('LIMPAR RECORDES?', W / 2, H / 2 - 40);
                ctx.fillStyle = '#aaa';
                ctx.font = '18px Arial';
                ctx.fillText('Essa ação não pode ser desfeita!', W / 2, H / 2 - 5);

                BUTTONS.confirmClear.forEach((btn) => {
                    const hovered = mouseOverButton(btn);
                    ctx.fillStyle = hovered ? 'rgba(255,68,68,0.4)' : 'rgba(255,68,68,0.15)';
                    if (btn.id === 'no') ctx.fillStyle = hovered ? 'rgba(120,120,120,0.4)' : 'rgba(80,80,80,0.2)';
                    ctx.fillRect(btn.x, btn.y, btn.w, btn.h);
                    ctx.strokeStyle = btn.id === 'yes' ? '#ff4444' : '#888';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(btn.x, btn.y, btn.w, btn.h);
                    ctx.fillStyle = btn.id === 'yes' ? '#ff6666' : '#ccc';
                    ctx.font = 'bold 22px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(btn.label, btn.x + btn.w / 2, btn.y + 33);
                });

                ctx.fillStyle = '#666';
                ctx.font = '13px Arial';
                ctx.fillText('ENTER = SIM  •  ESC = NÃO', W / 2, H / 2 + 130);
            }

            const mx = mouse.x, my = mouse.y;
            if (!confirmClear) {
                BUTTONS.menu.forEach((btn, i) => {
                    if (mouseOverButton(btn)) menuSelection = i;
                });
            }

            ctx.save();
            ctx.translate(mx, my);
            ctx.strokeStyle = '#c084fc';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 0, 10, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(-16, 0); ctx.lineTo(-6, 0);
            ctx.moveTo(6, 0); ctx.lineTo(16, 0);
            ctx.moveTo(0, -16); ctx.lineTo(0, -6);
            ctx.moveTo(0, 6); ctx.lineTo(0, 16);
            ctx.stroke();
            ctx.restore();
        }

        function drawMenuButton(x, y, w, h, label, selected, accentColor) {
            const isHover = selected;
            accentColor = accentColor || '#a855f7';

            if (isHover) {
                ctx.shadowBlur = 25;
                ctx.shadowColor = accentColor;
            }

            const bgGrad = ctx.createLinearGradient(x, y, x + w, y + h);
            if (isHover) {
                bgGrad.addColorStop(0, 'rgba(150,80,255,0.35)');
                bgGrad.addColorStop(1, 'rgba(80,30,180,0.25)');
            } else {
                bgGrad.addColorStop(0, 'rgba(25,20,40,0.85)');
                bgGrad.addColorStop(1, 'rgba(15,10,25,0.9)');
            }
            ctx.fillStyle = bgGrad;
            ctx.fillRect(x, y, w, h);
            ctx.shadowBlur = 0;

            ctx.strokeStyle = isHover ? accentColor : 'rgba(80,60,120,0.6)';
            ctx.lineWidth = isHover ? 2.5 : 1.5;
            ctx.strokeRect(x, y, w, h);

            ctx.fillStyle = isHover ? '#e0c8ff' : '#999';
            ctx.font = 'bold 20px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(label, x + w / 2, y + h / 2 + 2);
            ctx.textBaseline = 'alphabetic';
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>

</html>
