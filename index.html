            ctx.fillStyle = '#2a0000';
            ctx.fillRect(barX, barY, barW, barH);
            const hp = Math.max(0, player.hp) / player.maxHp;
            const grad = ctx.createLinearGradient(barX, 0, barX + barW, 0);
            grad.addColorStop(0, '#ff1111');
            grad.addColorStop(1, '#ff6666');
            ctx.fillStyle = grad;
            ctx.shadowBlur = 12;
            ctx.shadowColor = '#ff0000';
            ctx.fillRect(barX, barY, barW * hp, barH);
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(255,255,255,0.15)';
            ctx.fillRect(barX, barY, barW * hp, barH * 0.4);
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.strokeRect(barX, barY, barW, barH);

            ctx.fillStyle = '#fff';
            ctx.font = 'bold 13px Arial';
            ctx.textAlign = 'left';
            ctx.fillText('VIDA  ' + Math.ceil(player.hp) + ' / ' + player.maxHp, barX + 10, barY + 16);

            // Munição
            const ammoY = barY - 34;
            ctx.fillStyle = 'rgba(0,0,0,0.75)';
            ctx.fillRect(barX - 6, ammoY - 6, barW + 12, 24);
            ctx.strokeStyle = wp.color;
            ctx.strokeRect(barX - 6.5, ammoY - 6.5, barW + 13, 25);

            if (player.reloading) {
                ctx.fillStyle = '#3a2200';
                ctx.fillRect(barX, ammoY, barW, 14);
                const t = 1 - player.reloadTimer / player.reloadTime;
                ctx.fillStyle = '#ffaa00';
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#ffaa00';
                ctx.fillRect(barX, ammoY, barW * t, 14);
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 11px Arial';
                ctx.fillText('RECARREGANDO...', barX + 8, ammoY + 11);
            } else {
                ctx.fillStyle = '#1a1a1a';
                ctx.fillRect(barX, ammoY, barW, 14);
                const a = player.ammo / player.maxAmmo;
                ctx.fillStyle = a > 0.3 ? wp.color : '#ff5500';
                ctx.fillRect(barX, ammoY, barW * a, 14);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 11px Arial';
                ctx.fillText(player.ammo + ' / ' + player.maxAmmo, barX + 8, ammoY + 11);
            }

            // Arma atual (embaixo esquerda, ao lado)
            const wX = barX + barW + 20;
            const wY = H - 55;
            ctx.fillStyle = 'rgba(0,0,0,0.75)';
            ctx.fillRect(wX - 4, wY - 6, 200, 52);
            ctx.strokeStyle = wp.color;
            ctx.lineWidth = 1;
            ctx.strokeRect(wX - 4.5, wY - 6.5, 201, 53);

            ctx.fillStyle = wp.color;
            ctx.font = 'bold 16px Arial';
            ctx.shadowBlur = 10;
            ctx.shadowColor = wp.glow;
            ctx.fillText(wp.name, wX, wY + 12);
            ctx.shadowBlur = 0;

            ctx.fillStyle = '#999';
            ctx.font = '11px Arial';
            ctx.fillText(wp.desc, wX, wY + 30);

            // Info fase
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(28, 28, 340, 80);
            ctx.strokeStyle = 'rgba(255,170,0,0.4)';
            ctx.lineWidth = 1;
            ctx.strokeRect(28.5, 28.5, 339, 79);

            ctx.textAlign = 'left';
            ctx.fillStyle = '#ffa500';
            ctx.font = 'bold 18px Arial';
            ctx.shadowBlur = 8;
            ctx.shadowColor = '#ff6600';
            ctx.fillText(phase.name, 40, 52);
            ctx.shadowBlur = 0;

            ctx.fillStyle = '#999';
            ctx.font = '12px Arial';
            ctx.fillText(phase.desc, 40, 72);

            const progW = 316, progH = 14;
            const progX = 40, progY = 82;
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(progX, progY, progW, progH);

            let progRatio, progText;
            if (phase.objective === 'killCount') {
                progRatio = Math.min(1, killsThisPhase / phase.goal);
                progText = killsThisPhase + ' / ' + phase.goal + ' abates';
            } else {
                progRatio = Math.min(1, (phaseTime / 60) / phase.goal);
                progText = Math.floor(phaseTime / 60) + 's / ' + phase.goal + 's';
            }

            const gp = ctx.createLinearGradient(progX, 0, progX + progW, 0);
            gp.addColorStop(0, '#00cc44');
            gp.addColorStop(1, '#44ff88');
            ctx.fillStyle = gp;
            ctx.fillRect(progX, progY, progW * progRatio, progH);

            ctx.fillStyle = '#fff';
            ctx.font = 'bold 11px Arial';
            ctx.fillText(progText, progX + 8, progY + 11);

            // Score + moedas (topo direita)
            ctx.textAlign = 'right';
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(W - 260, 28, 232, 110);
            ctx.strokeStyle = 'rgba(255,170,0,0.4)';
            ctx.strokeRect(W - 260.5, 28.5, 231, 109);

            ctx.fillStyle = '#ffa500';
            ctx.font = 'bold 28px Arial';
            ctx.shadowBlur = 12;
            ctx.shadowColor = '#ff8800';
            ctx.fillText('SCORE ' + score, W - 40, 58);
            ctx.shadowBlur = 0;

            // Moedas
            ctx.fillStyle = '#ffdd00';
            ctx.font = 'bold 22px Arial';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ffaa00';
            ctx.fillText('$ ' + coins, W - 40, 90);
            ctx.shadowBlur = 0;

            ctx.fillStyle = '#ffcc00';
            ctx.font = 'bold 13px Arial';
            ctx.fillText('FASE ' + (currentPhase + 1) + ' / ' + PHASES.length, W - 40, 112);

            ctx.fillStyle = 'rgba(255,110,110,0.9)';
            ctx.font = '12px Arial';
            ctx.fillText('Inimigos: ' + enemies.length, W - 40, 130);

            // Aliados
            if (allies.length > 0) {
                const aX = W - 200;
                const aY = H - 55;
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(aX - 6, aY - 6, 172, 42);
                ctx.strokeStyle = 'rgba(0,255,136,0.5)';
                ctx.strokeRect(aX - 6.5, aY - 6.5, 173, 43);

                ctx.textAlign = 'left';
                ctx.fillStyle = '#00ff88';
                ctx.font = 'bold 13px Arial';
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#00ff88';
                ctx.fillText('ALIADOS', aX + 2, aY + 12);
                ctx.shadowBlur = 0;

                for (let i = 0; i < allies.length; i++) {
                    const x = aX + 8 + i * 22;
                    const y = aY + 25;
                    ctx.fillStyle = '#66ff99';
                    ctx.beginPath();
                    ctx.arc(x, y, 6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#00ff88';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                }
            }
        }

        /* =========================================================
           OVERLAYS
        ========================================================= */
        function drawOverlays() {
            if (allySpawnBanner > 0) {
                const alpha = Math.min(1, allySpawnBanner / 40);
                ctx.globalAlpha = alpha;
                ctx.fillStyle = 'rgba(0,40,20,0.7)';
                ctx.fillRect(0, 130, W, 60);
                ctx.fillStyle = '#00ff88';
                ctx.font = 'bold 26px Arial';
                ctx.textAlign = 'center';
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#00ff88';
                const count = allies.length;
                ctx.fillText(count + (count === 1 ? ' ALIADO ENTROU EM COMBATE!' : ' ALIADOS ENTRARAM EM COMBATE!'), W / 2, 168);
                ctx.shadowBlur = 0;
                ctx.globalAlpha = 1;
            }

            if (banner > 0) {
                const alpha = Math.min(1, banner / 40);
                ctx.globalAlpha = alpha;
                const grad = ctx.createLinearGradient(0, H / 2 - 90, 0, H / 2 + 50);
                grad.addColorStop(0, 'rgba(0,0,0,0)');
                grad.addColorStop(0.5, 'rgba(0,0,0,0.85)');
                grad.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = grad;
                ctx.fillRect(0, H / 2 - 90, W, 140);

                ctx.strokeStyle = '#ff8800';
                ctx.lineWidth = 2;
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#ff6600';
                ctx.beginPath();
                ctx.moveTo(W / 2 - 300, H / 2 - 50);
                ctx.lineTo(W / 2 + 300, H / 2 - 50);
                ctx.moveTo(W / 2 - 300, H / 2 + 50);
                ctx.lineTo(W / 2 + 300, H / 2 + 50);

                ctx.shadowBlur = 0;

                ctx.fillStyle = '#ffa500';
                ctx.font = 'bold 62px Arial';
                ctx.textAlign = 'center';
                ctx.shadowBlur = 30;
                ctx.shadowColor = '#ff6600';

                ctx.fillRect(0, 0, W, H);

                ctx.font = 'bold 64px Arial';

                } else {
                    ctx.fillStyle = '#ffa500';
                    ctx.font = '22px Arial';

                ctx.fillStyle = '#ffa500';
                ctx.font = 'bold 60px Arial';
                ctx.textAlign = 'center';
                ctx.shadowBlur = 25;
                ctx.shadowColor = '#ff6600';
                ctx.fillText('PAUSADO', W / 2, H / 2);
                ctx.shadowBlur = 0;

                ctx.font = '18px Arial';
                ctx.fillText('P ou ESC para continuar', W / 2, H / 2 + 44);

                ctx.fillRect(0, 0, W, H);
                ctx.fillStyle = '#ff2222';

                ctx.textAlign = 'center';
                ctx.shadowBlur = 40;

                ctx.fillStyle = '#fff';

                ctx.fillText('Score: ' + score, W / 2, H / 2 + 45);

                ctx.fillStyle = '#aaa';
                ctx.font = '18px Arial';
                ctx.fillText('ENTER para jogar de novo  •  ESC para o menu', W / 2, H / 2 + 130);
            }
        }

        /* =========================================================
           LOJA
        ========================================================= */
        function drawShop() {
            shopTime++;

            // Fundo
            ctx.fillStyle = '#0a0510';
            ctx.fillRect(0, 0, W, H);

            // Grade
            const offset = (shopTime * 0.3) % 60;
            ctx.strokeStyle = 'rgba(0,255,136,0.05)';
            for (let x = -60; x < W + 60; x += 60) {
                ctx.beginPath(); ctx.moveTo(x + offset, 0); ctx.lineTo(x + offset, H); ctx.stroke();
            }
            for (let y = -60; y < H + 60; y += 60) {
                ctx.beginPath(); ctx.moveTo(0, y + offset); ctx.lineTo(W, y + offset); ctx.stroke();
            }

            // Brilho central
            const grad = ctx.createRadialGradient(W / 2, 100, 0, W / 2, 100, 400);
            grad.addColorStop(0, 'rgba(0,255,136,0.15)');
            grad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);

            // Título
            ctx.textAlign = 'center';
            ctx.fillStyle = '#00ff88';
            ctx.font = 'bold 56px Arial';
            ctx.shadowBlur = 30;
            ctx.shadowColor = '#00ff88';
            ctx.fillText('LOJA', W / 2, 80);
            ctx.shadowBlur = 0;

            ctx.fillStyle = '#888';
            ctx.font = '14px Arial';
            ctx.fillText('Gaste suas moedas para ficar mais forte', W / 2, 108);

            // Moedas
            ctx.fillStyle = '#ffdd00';
            ctx.font = 'bold 34px Arial';
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#ffaa00';
            ctx.fillText('$ ' + coins, W / 2, 155);
            ctx.shadowBlur = 0;

            // Itens
            shopItems.forEach((it, i) => {
                const selected = i === shopSelection;
                const maxed = it.current >= it.max;
                const canAfford = coins >= it.cost && !maxed;

                // Hover do mouse
                const hovered = mouse.x >= it.x && mouse.x <= it.x + it.w &&
                    mouse.y >= it.y && mouse.y <= it.y + it.h;
                if (hovered) shopSelection = i;

                // Fundo
                const isActive = selected || hovered;
                if (maxed) ctx.fillStyle = 'rgba(20,40,20,0.85)';
                else if (canAfford) ctx.fillStyle = isActive ? 'rgba(0,255,136,0.2)' : 'rgba(20,40,30,0.75)';
                else ctx.fillStyle = isActive ? 'rgba(60,20,20,0.6)' : 'rgba(30,20,20,0.6)';

                ctx.fillRect(it.x, it.y, it.w, it.h);

                // Borda
                if (maxed) {
                    ctx.strokeStyle = 'rgba(0,255,136,0.3)';
                    ctx.lineWidth = 2;
                } else if (canAfford) {
                    ctx.strokeStyle = isActive ? '#00ff88' : 'rgba(0,255,136,0.5)';
                    ctx.lineWidth = isActive ? 3 : 2;
                    if (isActive) { ctx.shadowBlur = 20; ctx.shadowColor = '#00ff88'; }
                } else {
                    ctx.strokeStyle = isActive ? '#ff4444' : 'rgba(255,68,68,0.3)';
                    ctx.lineWidth = 2;
                }
                ctx.strokeRect(it.x, it.y, it.w, it.h);
                ctx.shadowBlur = 0;

                // Cantos destacados
                if (isActive && !maxed && canAfford) {
                    ctx.strokeStyle = '#aaffcc';
                    ctx.lineWidth = 3;
                    const s = 15;
                    ctx.beginPath();
                    ctx.moveTo(it.x, it.y + s); ctx.lineTo(it.x, it.y); ctx.lineTo(it.x + s, it.y);
                    ctx.moveTo(it.x + it.w - s, it.y); ctx.lineTo(it.x + it.w, it.y); ctx.lineTo(it.x + it.w, it.y + s);
                    ctx.moveTo(it.x, it.y + it.h - s); ctx.lineTo(it.x, it.y + it.h); ctx.lineTo(it.x + s, it.y + it.h);
                    ctx.moveTo(it.x + it.w - s, it.y + it.h); ctx.lineTo(it.x + it.w, it.y + it.h); ctx.lineTo(it.x + it.w, it.y + it.h - s);
                    ctx.stroke();
                }

                // Ícone colorido
                ctx.fillStyle = maxed ? '#00ff88' : canAfford ? it.color : '#666';
                ctx.shadowBlur = 15;
                ctx.shadowColor = maxed ? '#00ff88' : canAfford ? it.color : 'transparent';
                ctx.beginPath();
                ctx.arc(it.x + 40, it.y + it.h / 2, 22, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;

                // Nível dentro do círculo
                ctx.fillStyle = '#000';
                ctx.font = 'bold 18px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(it.current + '/' + it.max, it.x + 40, it.y + it.h / 2 + 1);
                ctx.textBaseline = 'alphabetic';

                // Nome
                ctx.textAlign = 'left';
                ctx.fillStyle = maxed ? '#00ff88' : canAfford ? '#fff' : '#888';
                ctx.font = 'bold 22px Arial';
                ctx.fillText(it.name, it.x + 80, it.y + 30);

                // Desc
                ctx.fillStyle = '#999';
                ctx.font = '13px Arial';
                ctx.fillText(it.desc, it.x + 80, it.y + 52);

                // Custo / MAX
                if (maxed) {
                    ctx.fillStyle = '#00ff88';
                    ctx.font = 'bold 16px Arial';
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = '#00ff88';
                    ctx.fillText('MAXIMIZADO', it.x + 80, it.y + 82);
                    ctx.shadowBlur = 0;
                } else {
                    ctx.fillStyle = canAfford ? '#ffdd00' : '#ff5555';
                    ctx.font = 'bold 18px Arial';
                    ctx.shadowBlur = canAfford ? 8 : 0;
                    ctx.shadowColor = canAfford ? '#ffaa00' : 'transparent';
                    ctx.fillText('$ ' + it.cost, it.x + 80, it.y + 82);
                    ctx.shadowBlur = 0;

                    ctx.fillStyle = '#666';
                    ctx.font = '11px Arial';
                    ctx.fillText('ENTER / CLIQUE', it.x + it.w - 100, it.y + it.h - 12);
                }
            });

            // Botão continuar
            const bx = W / 2 - 130, by = H - 80, bw = 260, bh = 50;
            const hoverCont = mouse.x >= bx && mouse.x <= bx + bw && mouse.y >= by && mouse.y <= by + bh;

            ctx.fillStyle = hoverCont ? 'rgba(255,170,0,0.3)' : 'rgba(40,40,40,0.85)';
            ctx.fillRect(bx, by, bw, bh);
            ctx.strokeStyle = hoverCont ? '#ffaa00' : '#666';
            ctx.lineWidth = hoverCont ? 3 : 2;
            if (hoverCont) { ctx.shadowBlur = 20; ctx.shadowColor = '#ffaa00'; }
            ctx.strokeRect(bx, by, bw, bh);
            ctx.shadowBlur = 0;

            ctx.fillStyle = hoverCont ? '#ffdd44' : '#aaa';
            ctx.font = 'bold 22px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('CONTINUAR  →', W / 2, by + bh / 2 + 1);
            ctx.textBaseline = 'alphabetic';

            ctx.fillStyle = '#555';
            ctx.font = '12px Arial';
            ctx.fillText('ENTER para comprar  •  ESC para pular a loja', W / 2, H - 15);

            // Crosshair da loja
            const mx = mouse.x, my = mouse.y;
            ctx.strokeStyle = 'rgba(0,255,136,0.9)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(mx, my, 8, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(mx - 12, my); ctx.lineTo(mx - 4, my);
            ctx.moveTo(mx + 4, my); ctx.lineTo(mx + 12, my);
            ctx.moveTo(mx, my - 12); ctx.lineTo(mx, my - 4);
            ctx.moveTo(mx, my + 4); ctx.lineTo(mx, my + 12);
            ctx.stroke();
        }

        /* =========================================================
           MENU
        ========================================================= */
        function drawMenu() {
            menuTime++;
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, W, H);

            const offset = (menuTime * 0.5) % 60;
            ctx.strokeStyle = 'rgba(255,140,0,0.08)';
            ctx.lineWidth = 1;
            for (let x = -60; x < W + 60; x += 60) {
                ctx.beginPath(); ctx.moveTo(x + offset, 0); ctx.lineTo(x + offset, H); ctx.stroke();
            }
            for (let y = -60; y < H + 60; y += 60) {
                ctx.beginPath(); ctx.moveTo(0, y + offset); ctx.lineTo(W, y + offset); ctx.stroke();
            }

            const grad = ctx.createRadialGradient(W / 2, H / 2 - 50, 0, W / 2, H / 2 - 50, W / 2);
            grad.addColorStop(0, 'rgba(255,120,0,0.12)');
            grad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);

            const titleY = 160;
            const pulse = Math.sin(menuTime * 0.05) * 3;
            ctx.textAlign = 'center';

            ctx.fillStyle = 'rgba(255,80,0,0.4)';
            ctx.font = 'bold 96px Arial';
            ctx.shadowBlur = 50;
            ctx.shadowColor = '#ff4400';
            ctx.fillText('SHOOTER', W / 2, titleY + pulse);
            ctx.shadowBlur = 0;

            ctx.fillStyle = '#ff9900';
            ctx.font = 'bold 96px Arial';
            ctx.shadowBlur = 30;
            ctx.shadowColor = '#ff6600';
            ctx.fillText('SHOOTER', W / 2, titleY + pulse);
            ctx.shadowBlur = 0;

            ctx.strokeStyle = '#ffee88';
            ctx.lineWidth = 1;
            ctx.strokeText('SHOOTER', W / 2, titleY + pulse);

            ctx.fillStyle = '#ffcc00';
            ctx.font = 'bold 22px Arial';
            ctx.fillText('T Á T I C A L   A R E N A', W / 2, titleY + 48);

            ctx.strokeStyle = '#ff8800';
            ctx.lineWidth = 2;
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#ff6600';
            ctx.beginPath();
            ctx.moveTo(W / 2 - 260, 252); ctx.lineTo(W / 2 - 40, 252);
            ctx.moveTo(W / 2 + 40, 252); ctx.lineTo(W / 2 + 260, 252);
            ctx.stroke();
            ctx.shadowBlur = 0;

            ctx.fillStyle = '#ffaa00';
            ctx.save();
            ctx.translate(W / 2, 252);
            ctx.rotate(Math.PI / 4);
            ctx.fillRect(-5, -5, 10, 10);
            ctx.restore();

            const btnW = 340, btnH = 62;
            const btn1Y = 320, btn2Y = 400;

            drawMenuButton(W / 2 - btnW / 2, btn1Y, btnW, btnH, 'INICIAR', menuSelection === 0);
            drawMenuButton(W / 2 - btnW / 2, btn2Y, btnW, btnH, 'SAIR', menuSelection === 1);

            ctx.fillStyle = '#666';
            ctx.font = '13px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('5 FASES  •  5 ARMAS  •  5 MAPAS  •  ALIADOS  •  LOJA', W / 2, H - 100);

            ctx.fillStyle = '#444';
            ctx.font = '12px Arial';
            ctx.fillText('WASD mover   MOUSE mirar   CLIQUE atirar   R recarregar', W / 2, H - 72);

            ctx.save();
            ctx.translate(W / 2, 590);
            ctx.rotate(menuTime * 0.02);
            ctx.shadowBlur = 25;
            ctx.shadowColor = '#00aaff';
            ctx.fillStyle = '#44ddff';
            ctx.beginPath();
            ctx.arc(0, 0, 14, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.restore();

            const vig = ctx.createRadialGradient(W / 2, H / 2, H * 0.4, W / 2, H / 2, H * 0.9);
            vig.addColorStop(0, 'rgba(0,0,0,0)');
            vig.addColorStop(1, 'rgba(0,0,0,0.75)');
            ctx.fillStyle = vig;
            ctx.fillRect(0, 0, W, H);

            const mx = mouse.x, my = mouse.y;
            if (mx >= W / 2 - btnW / 2 && mx <= W / 2 + btnW / 2) {
                if (my >= btn1Y && my <= btn1Y + btnH) menuSelection = 0;
                if (my >= btn2Y && my <= btn2Y + btnH) menuSelection = 1;
            }

            ctx.strokeStyle = 'rgba(255,80,80,0.9)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(mx, my, 8, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(mx - 12, my); ctx.lineTo(mx - 4, my);
            ctx.moveTo(mx + 4, my); ctx.lineTo(mx + 12, my);
            ctx.moveTo(mx, my - 12); ctx.lineTo(mx, my - 4);
            ctx.moveTo(mx, my + 4); ctx.lineTo(mx, my + 12);
            ctx.stroke();
        }

        function drawMenuButton(x, y, w, h, label, selected) {
            const isHover = selected;
            const pulse = Math.sin(menuTime * 0.1) * 0.5 + 0.5;

            if (isHover) {
                const grad = ctx.createLinearGradient(x, y, x + w, y + h);
                grad.addColorStop(0, 'rgba(255,140,0,0.35)');
                grad.addColorStop(1, 'rgba(255,80,0,0.2)');
                ctx.fillStyle = grad;
            } else {
                ctx.fillStyle = 'rgba(30,30,30,0.75)';
            }
            ctx.fillRect(x, y, w, h);

            ctx.strokeStyle = isHover ? '#ffaa00' : '#3a3a3a';
            ctx.lineWidth = isHover ? 3 : 1.5;
            if (isHover) { ctx.shadowBlur = 20 + pulse * 10; ctx.shadowColor = '#ff8800'; }
            ctx.strokeRect(x, y, w, h);
            ctx.shadowBlur = 0;

            ctx.fillStyle = isHover ? '#ffdd44' : '#888';
            ctx.font = 'bold 26px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            if (isHover) { ctx.shadowBlur = 15; ctx.shadowColor = '#ff8800'; }
            ctx.fillText(label, x + w / 2, y + h / 2 + 2);
            ctx.shadowBlur = 0;
            ctx.textBaseline = 'alphabetic';
        }

        /* =========================================================
           LOOP
        ========================================================= */
        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>

</html>
